<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitcoin Arena Explorer</title>
<meta name="theme-color" content="#0f0a10">
<meta name="description" content="Every order's transaction on the Bitcoin Arena: its round, its locks, when each node stored it, and how long each step took.">
<style>
  :root { --bg:#0f0a10; --panel:#1a1218; --line:#33232c; --text:#f6ece4; --dim:#a8968c; --btc:#f7931a; --bull:#2fd38a; --cyan:#4fd1ff; --bear:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.55 Inter, system-ui, sans-serif; }
  a { color: var(--cyan); text-decoration: none; } a:hover { text-decoration: underline; }
  code, .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 13px; }
  /* THE ARENA'S HEADER AND FOOTER (kanban #694, 2026-10-26: "the header of those pages does not match the style of the arena and games pages";
     #699 "all pages are missing the footer"; #701): https://testnet.bitcoin-arena.io/site-chrome.js, loaded from the Arena site and not copied,
     so the menu, the look and the build line stay the site's - the logo, "← Arena" and the menu at the top, the build line and Donate at the
     foot. Under it the explorer's own bar: its name, Transactions, Metrics and the search. */
  nav { background: rgba(15,10,16,.9); border-bottom: 1px solid var(--line); }
  nav .in, main { width: min(1180px, calc(100% - 32px)); margin: 0 auto; }
  nav .in { display: flex; align-items: center; gap: 14px; height: 56px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 700 17px system-ui; color: var(--text); }
  .brand:hover { text-decoration: none; }
  form { margin-left: auto; display: flex; gap: 8px; flex: 1; max-width: 560px; }
  input { flex: 1; min-width: 0; background: #140d12; border: 1px solid var(--line); border-radius: 10px; color: var(--text); padding: 8px 12px; font: 13px "JetBrains Mono", monospace; }
  button { background: var(--btc); color: #1a0f00; border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 700; cursor: pointer; }
  h1 { font-size: 26px; margin: 24px 0 6px; } h2 { font-size: 18px; margin: 28px 0 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin: 12px 0; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; } th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .dim { color: var(--dim); } .ok { color: var(--bull); } .bad { color: var(--bear); } .slow { color: var(--btc); font-weight: 700; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; } dt { color: var(--dim); } dd { margin: 0; word-break: break-all; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
  .filters select, .filters input { background: #140d12; border: 1px solid var(--line); border-radius: 10px; color: var(--text); padding: 7px 10px; font: 13px system-ui; }
  .filters input { flex: 1; min-width: 160px; max-width: 280px; font-family: "JetBrains Mono", monospace; }
  .pager { display: flex; gap: 8px; justify-content: flex-end; margin: 12px 0; }
  .pager button:disabled { opacity: .35; cursor: default; }
  tr.pg td { color: var(--cyan); } td.nw { white-space: nowrap; } tr.away td { color: var(--dim); }
  details.grp { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 16px; margin: 10px 0; overflow-x: auto; }
  details.grp > summary { cursor: pointer; list-style: none; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
  details.grp > summary::-webkit-details-marker { display: none; }
  details.grp > summary::before { content: '▸'; color: var(--btc); } details.grp[open] > summary::before { content: '▾'; }
  details.grp > summary .hint { margin-left: auto; font-size: 12px; }
  details.grp[open] > summary { margin-bottom: 8px; }
  th.n, td.n { text-align: right; }
  /* the Metrics page (kanban #676): the links in the bar, three figures as cards, a bar per day */
  .links { display: flex; gap: 4px; } .links a { color: var(--dim); padding: 6px 10px; border-radius: 8px; font-weight: 600; }
  .links a.on, .links a:hover { color: var(--text); background: var(--panel); text-decoration: none; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .stat { display: flex; flex-direction: column; gap: 4px; margin: 0; } .stat span { color: var(--dim); font-size: 13px; }
  .stat b { font-size: 26px; color: var(--btc); } .stat small { color: var(--dim); }
  td.barcell { width: 40%; } .vbar { display: block; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--btc), #ffd166); }
  /* A PHONE, NO SIDEWAYS SCROLL (kanban #628, 2026-10-24: "make the Explorer mobile friendly, I should not scroll horizontally"):
     every table's rows stacked, long ids and keys wrapped, the bar wrapped */
  @media (max-width: 640px) {
    html, body { overflow-x: hidden; }
    nav .in { flex-wrap: wrap; height: auto; padding: 8px 0; gap: 8px; }
    form { margin-left: 0; max-width: none; width: 100%; }
    .card, details.grp { overflow-x: visible; padding: 10px 12px; }
    table.rows thead { display: none; }
    table.rows, table.rows tbody, table.rows tr { display: block; width: 100%; }
    table.rows tr { padding: 7px 0; border-bottom: 1px solid var(--line); }
    table.rows td { display: inline; border: 0; padding: 0 8px 0 0; white-space: normal; }
    table.rows td.nw { white-space: nowrap; }
    .mono, dd, td, p.mono { overflow-wrap: anywhere; word-break: break-word; }
    dl { grid-template-columns: 1fr; } dt { margin-top: 6px; }
    h1 { font-size: 22px; } h2 { font-size: 16px; }
  }
  @media (max-width: 640px) { .day { display: none; } details.grp > summary .hint { display: none; } main { width: calc(100% - 16px); } th, td { padding: 5px 5px; } }
  .bar { height: 8px; background: var(--btc); border-radius: 4px; min-width: 2px; }
</style>
</head>
<body>
<script src="https://testnet.bitcoin-arena.io/site-chrome.js"></script>
<!-- THE EXPLORER (kanban #624): React (packages/arena-web/src/explorer/main.jsx, built to explorer.js); the Worker builds what its store
     holds into the page before this script, so it draws at once -->
<div id="root"></div>
<script src="/explorer.js"></script>
</body>
</html>
