#: the Arena's transaction explorer on explorer.bitcoin-arena.io (kanban #624): every order's transaction, read from the nodes every minute and
# kept in D1 (a page never waits on a node). A Worker with static assets, as bitcoin-arena-site: its custom domain gets its DNS record.
name = "bitcoin-arena-explorer"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = false
routes = [
  { pattern = "explorer.bitcoin-arena.io", custom_domain = true },
]

[assets]
directory = "./www"
binding = "ASSETS"
run_worker_first = true

#: the newest transactions, each seat's last read, and each transaction read (tx:<id>)
[[kv_namespaces]]
binding = "EXPLORER"
id = "4a493f041b6a48c0a2ec27b5f5458466"

#: every transaction, merged from the nodes (migrations/)
[[d1_databases]]
binding = "DB"
database_name = "arena-explorer"
database_id = "988ad7ad-6d01-4413-a644-a71030dd332f"
migrations_dir = "migrations"

[triggers]
#: the transactions every minute; the Network health page's copy (kanban #686, health.js readHealth) on its own trigger, so a run of its own
crons = ["* * * * *", "*/1 * * * *"]
