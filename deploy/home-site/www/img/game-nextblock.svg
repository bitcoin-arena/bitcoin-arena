<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
<title>Tick Tock, Next Block: a truck of mempool transactions races to the miners through the price war of the bulls and the bears</title>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1420"/><stop offset=".55" stop-color="#170d15"/><stop offset="1" stop-color="#0d080c"/></linearGradient>
<radialGradient id="blockglow" cx="78%" cy="20%" r="45%"><stop offset="0" stop-color="#ffd166" stop-opacity=".75"/><stop offset=".25" stop-color="#f7931a" stop-opacity=".35"/><stop offset="1" stop-color="#f7931a" stop-opacity="0"/></radialGradient>
<radialGradient id="bullglow" cx="85%" cy="70%" r="45%"><stop offset="0" stop-color="#2fd38a" stop-opacity=".28"/><stop offset="1" stop-color="#2fd38a" stop-opacity="0"/></radialGradient>
<radialGradient id="bearglow" cx="8%" cy="35%" r="45%"><stop offset="0" stop-color="#ff5d5d" stop-opacity=".28"/><stop offset="1" stop-color="#ff5d5d" stop-opacity="0"/></radialGradient>
<linearGradient id="road" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#3a2730"/><stop offset="1" stop-color="#22161d"/></linearGradient>
<linearGradient id="cube" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe29a"/><stop offset="1" stop-color="#f7931a"/></linearGradient>
<linearGradient id="truck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#e2672a"/></linearGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
</defs>
<rect width="800" height="500" fill="url(#sky)"/>
<rect width="800" height="500" fill="url(#bearglow)"/>
<rect width="800" height="500" fill="url(#bullglow)"/>
<rect width="800" height="500" fill="url(#blockglow)"/>
<!-- stars / sparks in the sky -->
<g fill="#ffd166" opacity=".5"><circle cx="120" cy="40" r="1.6"/><circle cx="300" cy="70" r="1.2"/><circle cx="430" cy="30" r="1.4"/><circle cx="520" cy="95" r="1"/><circle cx="210" cy="110" r="1"/><circle cx="700" cy="230" r="1.2"/></g>
<!-- the road to the miners, in perspective -->
<path d="M-40 520 L330 520 L640 150 L600 150 Z" fill="url(#road)"/>
<path d="M150 520 L620 150" stroke="#ffd166" stroke-width="4" stroke-dasharray="22 18" opacity=".55"/>
<path d="M-40 520 L600 150" stroke="#4a3440" stroke-width="3"/><path d="M330 520 L640 150" stroke="#4a3440" stroke-width="3"/>
<!-- the next block, where the miners wait -->
<g transform="translate(622 96)">
  <circle r="70" fill="#ffd166" opacity=".18" filter="url(#soft)"/>
  <path d="M0 -40 L38 -20 L38 22 L0 42 L-38 22 L-38 -20 Z" fill="url(#cube)"/>
  <path d="M0 -40 L38 -20 L0 0 L-38 -20 Z" fill="#fff1c9" opacity=".75"/><path d="M0 0 L38 -20 L38 22 L0 42 Z" fill="#c9561c" opacity=".55"/>
  <text x="0" y="12" text-anchor="middle" font-family="Space Grotesk, Arial, sans-serif" font-weight="700" font-size="30" fill="#2a1400">₿</text>
</g>
<!-- miners' pickaxes -->
<g stroke="#ffd166" stroke-width="5" stroke-linecap="round" fill="none" opacity=".9">
  <path d="M690 160 l26 -26"/><path d="M704 128 q14 4 20 18"/>
  <path d="M556 128 l-24 -24"/><path d="M542 96 q-13 3 -18 17"/>
</g>
<!-- the price front: rises (bulls) and falls (bears) along the road -->
<path d="M40 470 L95 430 L130 448 L180 392 L215 410 L262 352 L300 372 L338 318 L372 334 L410 280 L445 296 L478 248 L512 262 L548 214 L585 190" fill="none" stroke="#ffd166" stroke-width="5" stroke-linejoin="round" filter="url(#soft)" opacity=".7"/>
<g fill="none" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
  <path d="M40 470 L95 430" stroke="#2fd38a"/><path d="M95 430 L130 448" stroke="#ff5d5d"/><path d="M130 448 L180 392" stroke="#2fd38a"/><path d="M180 392 L215 410" stroke="#ff5d5d"/>
  <path d="M215 410 L262 352" stroke="#2fd38a"/><path d="M262 352 L300 372" stroke="#ff5d5d"/><path d="M300 372 L338 318" stroke="#2fd38a"/><path d="M338 318 L372 334" stroke="#ff5d5d"/>
  <path d="M372 334 L410 280" stroke="#2fd38a"/><path d="M410 280 L445 296" stroke="#ff5d5d"/><path d="M445 296 L478 248" stroke="#2fd38a"/><path d="M478 248 L512 262" stroke="#ff5d5d"/>
  <path d="M512 262 L548 214" stroke="#2fd38a"/><path d="M548 214 L585 190" stroke="#2fd38a"/>
</g>
<!-- the bulls charge from the right -->
<g fill="#2fd38a">
  <g transform="translate(560 330) scale(1.25)"><path d="M-22 -6 q-14 -10 -10 -26 q6 12 16 14 h32 q10 -2 16 -14 q4 16 -10 26 l-4 18 q-8 14 -22 14 q-14 0 -22 -14 z"/><circle cx="-8" cy="2" r="3" fill="#0d080c"/><circle cx="12" cy="2" r="3" fill="#0d080c"/><ellipse cx="2" cy="18" rx="9" ry="5" fill="#1d8a5a"/></g>
  <g transform="translate(690 300) scale(.95)" opacity=".85"><path d="M-22 -6 q-14 -10 -10 -26 q6 12 16 14 h32 q10 -2 16 -14 q4 16 -10 26 l-4 18 q-8 14 -22 14 q-14 0 -22 -14 z"/><circle cx="-8" cy="2" r="3" fill="#0d080c"/><circle cx="12" cy="2" r="3" fill="#0d080c"/></g>
  <g transform="translate(470 420) scale(1.05)" opacity=".9"><path d="M-22 -6 q-14 -10 -10 -26 q6 12 16 14 h32 q10 -2 16 -14 q4 16 -10 26 l-4 18 q-8 14 -22 14 q-14 0 -22 -14 z"/><circle cx="-8" cy="2" r="3" fill="#0d080c"/><circle cx="12" cy="2" r="3" fill="#0d080c"/></g>
  <path d="M520 300 l-18 -8 M528 312 l-22 0 M522 324 l-18 8" stroke="#2fd38a" stroke-width="3" stroke-linecap="round" opacity=".7"/>
</g>
<!-- the bears push back from the left -->
<g fill="#ff5d5d">
  <g transform="translate(150 250) scale(1.2)"><circle cx="-18" cy="-18" r="9"/><circle cx="18" cy="-18" r="9"/><circle cx="0" cy="0" r="24"/><circle cx="-8" cy="-4" r="3" fill="#0d080c"/><circle cx="8" cy="-4" r="3" fill="#0d080c"/><ellipse cx="0" cy="9" rx="10" ry="7" fill="#b83a3a"/><circle cx="0" cy="6" r="3" fill="#0d080c"/></g>
  <g transform="translate(60 330) scale(.9)" opacity=".85"><circle cx="-18" cy="-18" r="9"/><circle cx="18" cy="-18" r="9"/><circle cx="0" cy="0" r="24"/><circle cx="-8" cy="-4" r="3" fill="#0d080c"/><circle cx="8" cy="-4" r="3" fill="#0d080c"/></g>
  <g transform="translate(250 175) scale(.8)" opacity=".8"><circle cx="-18" cy="-18" r="9"/><circle cx="18" cy="-18" r="9"/><circle cx="0" cy="0" r="24"/><circle cx="-8" cy="-4" r="3" fill="#0d080c"/><circle cx="8" cy="-4" r="3" fill="#0d080c"/></g>
  <path d="M192 262 l18 -6 M194 276 l22 2 M188 290 l18 10" stroke="#ff5d5d" stroke-width="3" stroke-linecap="round" opacity=".7"/>
</g>
<!-- clashes on the front -->
<g fill="#ffd166"><path d="M262 352 l6 -14 l4 12 l12 -6 l-6 12 l14 4 l-14 4 l6 12 l-12 -6 l-4 12 l-6 -14 l-12 6 l6 -12 l-14 -4 l14 -4 l-6 -12 z" transform="translate(-4 -2) scale(.8) translate(66 88)"/>
<path d="M0 -14 l4 10 l10 -4 l-4 10 l10 4 l-10 4 l4 10 l-10 -4 l-4 10 l-4 -10 l-10 4 l4 -10 l-10 -4 l10 -4 l-4 -10 l10 4 z" transform="translate(410 280)"/>
<path d="M0 -12 l3 9 l9 -3 l-3 9 l9 3 l-9 3 l3 9 l-9 -3 l-3 9 l-3 -9 l-9 3 l3 -9 l-9 -3 l9 -3 l-3 -9 l9 3 z" transform="translate(512 262)" opacity=".85"/></g>
<!-- the truck, hugging the front, loaded with mempool transactions -->
<g transform="translate(318 392) rotate(-38)">
  <path d="M-120 22 h-40 M-120 34 h-60 M-120 46 h-34" stroke="#ffd166" stroke-width="4" stroke-linecap="round" opacity=".6"/>
  <rect x="-108" y="-6" width="118" height="54" rx="7" fill="#2b1d25" stroke="#4a3440" stroke-width="2"/>
  <g stroke="#0d080c" stroke-width="2">
    <rect x="-102" y="-30" width="26" height="26" rx="4" fill="#ff5d5d"/><rect x="-74" y="-30" width="26" height="26" rx="4" fill="#4fd1ff"/><rect x="-46" y="-30" width="26" height="26" rx="4" fill="#2fd38a"/><rect x="-18" y="-30" width="26" height="26" rx="4" fill="#b98cff"/>
    <rect x="-88" y="-54" width="26" height="26" rx="4" fill="#ffd166"/><rect x="-60" y="-54" width="26" height="26" rx="4" fill="#ff5ab4"/><rect x="-32" y="-54" width="26" height="26" rx="4" fill="#f7931a"/>
  </g>
  <path d="M12 -2 h34 q12 0 18 12 l12 22 v16 h-64 z" fill="url(#truck)"/>
  <path d="M22 4 h22 q8 0 12 8 l6 12 h-40 z" fill="#2a1420" opacity=".85"/>
  <circle cx="-76" cy="52" r="13" fill="#0d080c" stroke="#a8968c" stroke-width="4"/><circle cx="-14" cy="52" r="13" fill="#0d080c" stroke="#a8968c" stroke-width="4"/><circle cx="52" cy="52" r="13" fill="#0d080c" stroke="#a8968c" stroke-width="4"/>
  <rect x="74" y="30" width="8" height="8" rx="2" fill="#fff1c9"/>
</g>
<!-- score pop: the closer to the front, the more you score -->
<g font-family="Space Grotesk, Arial, sans-serif" font-weight="700">
  <text x="352" y="300" font-size="30" fill="#ffd166" stroke="#2a1400" stroke-width="5" paint-order="stroke">+120</text>
  <text x="250" y="352" font-size="18" fill="#ffd166" opacity=".7" stroke="#2a1400" stroke-width="4" paint-order="stroke">+40</text>
</g>
</svg>
