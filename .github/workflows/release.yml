name: node release

# THE ARENA NODE ON GITHUB RELEASES (Linux, macOS, Windows). A tag v<version> builds every asset with the same script
# (tools/release/build-linux.sh), tests the installer and the seat doors it uses, installs each asset fresh and checks it runs,
# and drafts the release with the assets and SHA256SUMS. The draft is signed outside CI with the Arena release key
# (tools/release/sign.sh, ruling 6: the key never sits in CI) and then published; the installer refuses unsigned assets.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'version without v, e.g. 0.1.0-rc.1 (a dry run: built and tested, no release)'
        required: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      # the tracked node_modules links point at a developer's checkout: CI installs the two pinned dependencies instead
      - name: dependencies
        run: |
          rm packages/arena-node/node_modules
          (cd packages/arena-node && npm install --omit=dev --no-audit --no-fund --no-package-lock @noble/curves@2.4.0 @noble/hashes@2.4.0 ws@8.21.3 bcryptjs@3.0.3)
      - name: installer tests
        working-directory: packages/arena-installer
        run: for t in test/*.test.js; do node --test --test-timeout=120000 "$t"; done
      - name: seat doors the installer uses
        working-directory: packages/arena-node
        run: node --test --test-timeout=120000 test/reach-check.test.js
      # THE PAGE SCRIPTS THE ASSET CARRIES ARE THE BUILD OF THIS COMMIT (kanban #564): the node's pages draw only with React, packed by
      # esbuild into packages/arena-web/dist; built again here at the pinned versions and compared byte for byte
      - name: page bundles fresh
        working-directory: packages/arena-web
        run: |
          npm install --no-audit --no-fund --no-package-lock esbuild@0.25.12 react@19.3.1 react-dom@19.3.1
          node --test --test-timeout=120000 test/dist-fresh.test.mjs

  # EVERY ASSET IS ASSEMBLED ON LINUX (GNU tar and zip, fixed order and times: the same bytes from the same commit), then installed
  # fresh on its own system (smoke)
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: version
        id: v
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" | sed 's/=v/=/' >> "$GITHUB_OUTPUT"
      - name: build
        env:
          GH_TOKEN: ${{ github.token }}   # the custody binaries come from this repo's release custody-76012ad9 (build-release.sh 3b)
        run: |
          for t in "linux x64" "linux arm64" "darwin arm64" "darwin x64" "windows x64"; do
            set -- $t; tools/release/build-release.sh "${{ steps.v.outputs.version }}" $1 $2 out
          done
      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: |
            out/*.tar.gz
            out/*.zip
            out/SHA256SUMS

  # A FRESH INSTALL OF EACH ASSET ON ITS OWN SYSTEM (F.1): unpacked into an empty directory, its seat started on its own runtime hosting
  # nextblock, and (Linux, macOS) its installer started and its setup link entered
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, asset: linux-x64 }
          - { os: ubuntu-24.04-arm, asset: linux-arm64 }
          - { os: macos-latest, asset: darwin-arm64 }
          - { os: macos-15-intel, asset: darwin-x64 }   # macos-13 is retired: run 39112904496 waited for it 14 min
          - { os: windows-latest, asset: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assets
          path: out
      - name: fresh install (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          mkdir run && tar -xzf out/arena-node-*-${{ matrix.asset }}.tar.gz -C run
          R=$(echo "$PWD"/run/arena-node-*)
          (cd "$R/packages/arena-node" && ARENA_DONATION_NETWORK=testnet4 ARENA_APPS="$R/packages/nextblock/plugin/nextblock.js" \
            "$R/runtime/node" src/main.js 31917 "$PWD/seat.db" > "$PWD/seat.log" 2>&1 &)
          for i in $(seq 1 90); do curl -sf -o /dev/null http://127.0.0.1:31917/identity && break; sleep 1; done
          curl -sf http://127.0.0.1:31917/games | grep -q '"name":"nextblock"' || { cat seat.log; exit 1; }
          ("$R/arena-install" --local --port 31918 --seat-port 31919 --home "$PWD/home" > inst.log 2>&1 &)   # --local: a runner has no display (session.js)
          for i in $(seq 1 30); do grep -q '?t=' inst.log && break; sleep 1; done
          link=$(grep -oE 'http://127.0.0.1:31918/\?t=[A-Za-z0-9_-]+' inst.log)
          cookie=$(curl -s -o /dev/null -D - "$link" | grep -i set-cookie | grep -oE 'arena_wizard=[^;]+')
          curl -sf -H "cookie: $cookie" http://127.0.0.1:31918/api/state | grep -q '"step":"chain"'
          "$R/runtime/cloudflared" --version
          # the custody gateway (slice 5), built on the MacBook for this system: it runs here (glibc, architecture, signing)
          if [ -e "$R/runtime/custody/gatewayd" ]; then "$R/runtime/custody/gatewayd" --version; else echo "no custody binaries in this asset"; fi
          echo "fresh install of $(cat "$R/VERSION") ($(cat "$R/COMMIT")) on ${{ matrix.asset }}: seat and installer run"
      - name: fresh install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-ChildItem out\arena-node-*-windows-x64.zip).FullName -DestinationPath run
          $R = (Get-ChildItem run\arena-node-*).FullName
          $env:ARENA_DONATION_NETWORK = 'testnet4'; $env:ARENA_APPS = "$R\packages\nextblock\plugin\nextblock.js"
          Start-Process -FilePath "$R\runtime\node.exe" -ArgumentList 'src\main.js','31917',"$PWD\seat.db" -WorkingDirectory "$R\packages\arena-node" -RedirectStandardOutput seat.log -RedirectStandardError seat.err
          $ok = $false; for ($i = 0; $i -lt 90; $i++) { try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:31917/identity | Out-Null; $ok = $true; break } catch { Start-Sleep 1 } }
          if (-not $ok) { Get-Content seat.log, seat.err; exit 1 }
          if (-not ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:31917/games).Content -match '"name":"nextblock"')) { exit 1 }
          & "$R\runtime\cloudflared.exe" --version
          if (Test-Path "$R\runtime\custody\gatewayd.exe") { & "$R\runtime\custody\gatewayd.exe" --version; if ($LASTEXITCODE -ne 0) { exit 1 } } else { "no custody binaries in this asset" }
          if (Test-Path "$R\runtime\tor\tor.exe") { & "$R\runtime\tor\tor.exe" --version; if ($LASTEXITCODE -ne 0) { exit 1 } }
          # THE INSTALLER STARTS (rc.10 shipped a Windows zip whose installer stopped at "Cannot find package '@noble/curves'")
          Start-Process -FilePath "$R\runtime\node.exe" -ArgumentList "$R\packages\arena-installer\bin\arena-install.mjs",'--port','31918','--seat-port','31919','--home',"$PWD\home" -RedirectStandardOutput inst.log -RedirectStandardError inst.err
          $link = $null; for ($i = 0; $i -lt 30; $i++) { $m = Select-String -Path inst.log -Pattern 'http://127.0.0.1:31918/\?t=[A-Za-z0-9_-]+' -ErrorAction SilentlyContinue; if ($m) { $link = $m.Matches[0].Value; break }; Start-Sleep 1 }
          if (-not $link) { Get-Content inst.log, inst.err; exit 1 }
          $s = New-Object Microsoft.PowerShell.Commands.WebRequestSession; Invoke-WebRequest -UseBasicParsing -WebSession $s $link | Out-Null
          if (-not ((Invoke-WebRequest -UseBasicParsing -WebSession $s http://127.0.0.1:31918/api/state).Content -match '"step":"chain"')) { exit 1 }
          "fresh install of $(Get-Content $R\VERSION) on windows-x64: seat and installer run"

  # THE INSTALLER PACKAGES (2026-10-19: "for windows we want an exe, for Mac OS we want a deb ... a small gui version
  # of the installer that launches the browser"): the Windows setup .exe (NSIS) and the Linux .debs made on Linux, the macOS .dmg on a Mac
  # (hdiutil), each from the assets above (tools/release/package.sh, package-mac.sh); their lines join SHA256SUMS, which the release key signs
  packages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: assets
          path: out
      - name: version
        id: v
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" | sed 's/=v/=/' >> "$GITHUB_OUTPUT"
      - name: NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis
      - name: setup .exe and .debs
        run: tools/release/package.sh "${{ steps.v.outputs.version }}" out windows linux
      # the x64 .deb installed here and its setup started: it prints the installer's one-time link (no desktop: the terminal way)
      - name: the .deb installs and its setup starts
        run: |
          sudo apt-get install -y -qq ./out/arena-node_*_amd64.deb
          (HOME=$PWD/debhome timeout 60 arena-node-setup --local --port 31938 --seat-port 31939 > setup.log 2>&1 || true)
          cat setup.log | head -20
          grep -qE 'http://127.0.0.1:31938/\?t=' setup.log
      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          path: |
            out/*.exe
            out/*.deb
            out/SHA256SUMS.packages

  packages-mac:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: assets
          path: out
      - name: version
        id: v
        run: echo "version=${{ github.event.inputs.version || github.ref_name }}" | sed 's/=v/=/' >> "$GITHUB_OUTPUT"
      - name: .dmg
        run: |
          tools/release/package-mac.sh "${{ steps.v.outputs.version }}" out
          mv out/SHA256SUMS.packages out/SHA256SUMS.packages-mac
      # the arm64 image mounts and holds the app with its release; the release's runtime runs from it
      - name: the .dmg mounts and its app holds the node
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/arenadmg out/ArenaNode-*-darwin-arm64.dmg
          test -x "/tmp/arenadmg/Arena Node.app/Contents/MacOS/arena-node-app"
          "/tmp/arenadmg/Arena Node.app/Contents/Resources/release/"arena-node-*/runtime/node --version
          hdiutil detach /tmp/arenadmg
      - uses: actions/upload-artifact@v4
        with:
          name: packages-mac
          path: |
            out/*.dmg
            out/SHA256SUMS.packages-mac

  # the setup .exe installed silently on Windows (no administrator): the node's files and the window's script where the shortcuts point
  packages-windows:
    needs: packages
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages-linux
          path: pk
      - name: silent install
        shell: pwsh
        run: |
          $exe = (Get-ChildItem pk\ArenaNodeSetup-*.exe).FullName
          Start-Process -FilePath $exe -ArgumentList '/S' -Wait
          $d = Join-Path $env:LOCALAPPDATA 'ArenaNode'
          if (-not (Test-Path "$d\ArenaNode.ps1")) { Get-ChildItem $d; exit 1 }
          $r = (Get-ChildItem $d -Directory -Filter 'arena-node-*').FullName
          & "$r\runtime\node.exe" --version; if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Arena Node\Arena Node.lnk")) { exit 1 }
          "installed: $r"

  release:
    needs: [smoke, packages, packages-mac, packages-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: assets
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: packages-linux
          path: assets
      - uses: actions/download-artifact@v4
        with:
          name: packages-mac
          path: assets
      - name: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat assets/SHA256SUMS assets/SHA256SUMS.packages assets/SHA256SUMS.packages-mac | sort -k2 > SHA256SUMS
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft --title "Arena node ${{ github.ref_name }}" \
            --notes "Testnet4 only. Windows: ArenaNodeSetup-*.exe. macOS: ArenaNode-*.dmg (drag Arena Node to Applications; the first time right-click > Open). Linux: arena-node_*.deb (then Arena Node in the menu, or arena-node-setup). Or download the asset for your machine, unpack it, run ./arena-install and open the link it prints (add --tunnel on a remote machine). SHA256SUMS is signed with the Arena release key (SHA256SUMS.sig), published at https://testnet.bitcoin-arena.io/release-key.txt." \
            assets/*.tar.gz assets/*.zip assets/*.exe assets/*.deb assets/*.dmg SHA256SUMS
