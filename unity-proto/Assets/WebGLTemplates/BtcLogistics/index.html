<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1014; }
    body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #e8eaed; }

    #canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

    /* The loading screen sits ON TOP of the canvas rather than beside it, so
       there is never a moment of blank page between the two. */
    #boot {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 22px; padding: 24px;
      background: radial-gradient(circle at 50% 35%, #1b2430 0%, #0d1014 70%);
      transition: opacity .5s ease; z-index: 10;
    }
    #boot.done { opacity: 0; pointer-events: none; }

    #title { font-size: clamp(22px, 5vw, 40px); font-weight: 700; letter-spacing: -0.02em; }
    #title span { color: #f7931a; }               /* the one bitcoin orange */
    #sub { color: #8b949e; font-size: 14px; margin-top: -14px; }

    #track { width: min(440px, 82vw); height: 8px; border-radius: 99px; background: #222932; overflow: hidden; }
    #bar { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #f7931a, #ffc46b);
           transition: width .25s ease; }

    /* DANIEL'S HOW-TO ON THE LOADING SCREEN (2026-09-14 07:55): four panels,
       each whole and never stretched, white knocked out for this dark ground -
       1-2-3-4 in a row on a wide screen, 1-2 over 3-4 on a tall one, shrunk to
       fit and no smaller than readable. A phone on its side gets a shorter row so
       the bar and the words under it stay on screen. */
    /* Each panel is cut from Daniel's whole at its true edges (tools/cut-howto.py)
       and keeps its own shape: in a row all four share one height (6.248 = the
       four widths over that height); 1-2 over 3-4 is two equal columns, each
       panel at its natural height. */
    #howto { --h: min(calc((min(1100px, 94vw) - 18px) / 6.248), 30vh);
      display: flex; gap: 6px; justify-content: center; align-items: flex-start; }
    #howto img { display: block; height: var(--h); width: auto; }
    @media (orientation: portrait) {
      #howto { display: grid; grid-template-columns: repeat(2, 1fr); align-items: start; width: min(620px, 94vw, 66vh); }
      #howto img { width: 100%; height: auto; }
    }
    @media (orientation: landscape) and (max-height: 500px) {
      #boot { gap: 8px; padding-block: 10px; }
      #howto { --h: min(calc((94vw - 18px) / 6.248), 26vh); }
    }

    #pct { font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 600; }
    #stage { color: #8b949e; font-size: 13px; min-height: 1.5em; text-align: center; }
    #note { color: #5c6570; font-size: 12px; max-width: 460px; text-align: center; }

    /* THE DEPOSIT A LOCK ROUND ASKS FOR, ON THE LOADING SCREEN - the only thing
       a player sees while the page waits for it (W1b). Selectable, so any
       wallet can be given the invoice. Empty, it takes no room. */
    #blwp-deposit { max-width: min(560px, 90vw); text-align: center; font-size: 13px; color: #e8eaed; }
    #blwp-deposit:empty { display: none; }
    /* ...AND OVER THE GAME once the loading screen is gone: PLAY in the lobby
       takes the seat in the running page (M3.3-34), so a lock round's deposit
       is asked for after Unity loaded. */
    body > #blwp-deposit { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 25;
      padding: 12px 14px; border-radius: 6px; background: rgba(13, 16, 20, 0.94); border: 1px solid #3a3f45; }
    #blwp-deposit code { display: block; margin-top: 8px; padding: 8px 10px; border-radius: 4px;
      background: #0d1014; border: 1px solid #3a3f45; color: #ffc46b; word-break: break-all;
      user-select: all; font: 400 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }

    #err { display: none; color: #ff6b6b; max-width: 560px; text-align: center; font-size: 14px; }
    #err.show { display: block; }
    /* A donation that already left the wallet, from the tab's notes, under a
       refusal: the player is told what was paid even when the round is gone. */
    #blwp-donation-noted { display: none; color: #e8eaed; max-width: 560px; text-align: center; font-size: 14px; }
    #blwp-donation-noted.show { display: block; }

    /* THE LOBBY (M3.3-34): a link naming nodes and no round lists the rounds
       they hold, over everything else, until the player joins one. Every row
       is the client's line - checked against its contract - and Join is the
       round's own link. Hidden unless the link is a lobby link. */
    #blwp-lobby {
      position: absolute; inset: 0; z-index: 30; display: none; overflow: auto;
      padding: 32px 18px; background: rgba(13, 16, 20, 0.96);
    }
    #blwp-lobby.show { display: block; }
    #blwp-lobby h2 { margin: 0 0 4px; font-size: 22px; }
    #blwp-lobby .sub { color: #8b949e; font-size: 13px; margin-bottom: 18px; }
    #blwp-lobby .row { display: flex; gap: 14px; align-items: center; max-width: 820px;
      padding: 12px 14px; margin-bottom: 10px; border-radius: 6px; background: #161b22;
      border-left: 3px solid #3a3f45; }
    #blwp-lobby .row.free { border-left-color: #f7931a; }
    #blwp-lobby .row .line { flex: 1; font-size: 14px; }
    #blwp-lobby .row .id { color: #8b949e; font: 400 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
    #blwp-lobby a.join { color: #0d1014; background: #f7931a; padding: 8px 14px; border-radius: 4px;
      font-weight: 700; text-decoration: none; white-space: nowrap; }
    #blwp-lobby .none, #blwp-lobby .refused { color: #8b949e; font-size: 13px; max-width: 820px; }
    #blwp-lobby .refused { margin-top: 14px; white-space: pre-wrap; }

    /* Who is in this round. Hidden until a round is named. Pointer-events none
       so it cannot steal the canvas. */
    #blwp-players {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      z-index: 20; pointer-events: none; display: none;
      font: 600 14px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e8eaed; background: rgba(13, 16, 20, 0.78);
      border-left: 3px solid #f7931a; padding: 8px 14px; border-radius: 4px;
      letter-spacing: 0.01em;
      white-space: pre; text-align: left;
    }

    /* THE WALLET, and it takes pointer events because it is the one thing on
       this page a player types into. Hidden until a round that asks for money
       is named - a free round has nothing to pay and no reason to ask. */
    #blwp-wallet {
      position: absolute; top: 14px; right: 14px; z-index: 21; display: none;
      font: 600 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #e8eaed; background: rgba(13, 16, 20, 0.86);
      border-left: 3px solid #f7931a; padding: 10px 12px; border-radius: 4px;
      max-width: 320px; text-align: left;
    }
    #blwp-wallet .owed { font-size: 15px; }
    #blwp-wallet .spent { opacity: 0.75; font-weight: 400; margin-top: 4px; }
    #blwp-wallet .why { opacity: 0.9; font-weight: 400; margin-top: 6px; white-space: pre-wrap; }
    #blwp-wallet input {
      width: 100%; margin-top: 8px; padding: 6px 8px; border-radius: 3px;
      border: 1px solid #3a3f45; background: #0d1014; color: #e8eaed;
      font: 400 12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    #blwp-wallet button {
      margin-top: 8px; padding: 6px 12px; border-radius: 3px; border: 0;
      background: #f7931a; color: #14171a; font: 600 13px/1 inherit; cursor: pointer;
    }
    #blwp-wallet button[disabled] { opacity: 0.5; cursor: default; }
    /* A PHONE ON ITS SIDE (M3.2 6e). Measured on the daily page at 844x390: the
       320x428 panel at the right edge ended 52 px below the screen ("Pay the
       stake" cut) and lay over the throttle. The touch pads are Unity's
       TouchPad.RectFor: button s = 20% and margin m = 3.5% of the short side,
       so the throttle starts s + m = 23.5% of it in from the right, and the
       bottom row (steering, brake, handbrake) starts s + m up from the bottom.
       The panel keeps left of the one and above the other, wide enough that
       its lines are few; the input and the button share a row. The height cap
       only guards a longer why - it scrolls rather than run off the screen. */
    @media (orientation: landscape) and (max-height: 500px) {
      #blwp-wallet {
        left: 14px; right: calc(23.5vh + 12px); max-width: none;
        max-height: calc(76.5vh - 22px); overflow-y: auto;
      }
      #blwp-wallet input { width: calc(100% - 150px); margin-right: 8px; vertical-align: middle; }
      #blwp-wallet button { vertical-align: middle; }
    }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="-1"></canvas>
  <div id="blwp-lobby"></div>
  <div id="blwp-players"></div>
  <div id="blwp-refund"></div>
  <div id="blwp-wallet">
    <div class="owed" id="blwp-owed"></div>
    <div class="spent" id="blwp-spent"></div>
    <div class="spent" id="blwp-donation"></div>
    <div class="spent" id="blwp-settled"></div>
    <div class="spent" id="blwp-budget"></div>
    <input id="blwp-nwc" type="password" autocomplete="off" spellcheck="false"
           placeholder="nostr+walletconnect://…">
    <button id="blwp-pay" type="button">Pay the stake</button>
    <div class="why" id="blwp-why"></div>
  </div>

  <script>
  // GETTING SOUND OUT OF AN iPHONE.
  //
  // iOS Safari keeps every AudioContext suspended until one is resumed from
  // inside a real gesture handler, and it wants something PLAYED in that same
  // handler before it believes the context is in use. Unity's own unlock, and
  // ours in AudioUnlock.jslib, both run from `SplashScreen.Play` - which is an
  // OnGUI callback in the frame loop, not the gesture's call stack. Safari does
  // not count that, and the game was silent on a phone while being fine on a
  // desktop, where a resume alone is enough.
  //
  // So the unlock moves out here, into a listener that IS the gesture. It needs
  // Unity's context, and Unity does not put it on `window` - reading
  // `Module.WEBAudio.audioContext` in a Unity 6 build gave nothing while buffers
  // were audibly starting. The only reliable handle is to take it as it is
  // built, which is why this runs BEFORE the loader.
  (function () {
    var Orig = window.AudioContext || window.webkitAudioContext;
    if (!Orig) return;
    var seen = [];
    var Wrapped = function () {
      var c = new (Function.prototype.bind.apply(Orig, [null].concat([].slice.call(arguments))))();
      seen.push(c);
      return c;
    };
    Wrapped.prototype = Orig.prototype;
    window.AudioContext = Wrapped;
    window.webkitAudioContext = Wrapped;

    var state = { contexts: seen, unlocks: 0, running: 0, media: 'none' };
    window.__blwpAudio = state;

    // THE RINGER SWITCH.
    //
    // An unlocked, running AudioContext is still SILENT on an iPhone whose
    // ring/silent switch is set to silent - iOS mutes Web Audio with the
    // ringer unless the page owns a media PLAYBACK session. Photographed:
    // Safari showed its speaker icon in the address bar (the system believed
    // sound was playing) while the phone made none, with the silent-mode bell
    // in the status bar.
    //
    // An <audio> element that is actually playing is what changes the session
    // category. It carries half a second of silence on a loop, so it costs
    // nothing to hear and everything to have. `playsinline` keeps iOS from
    // taking it fullscreen, and it must be STARTED in the gesture like the
    // context.
    var keeper = document.createElement('audio');
    keeper.setAttribute('playsinline', '');
    keeper.loop = true;
    keeper.preload = 'auto';
    keeper.volume = 0.001;
    keeper.src = 'data:audio/wav;base64,UklGRkQDAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YSADAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==';
    keeper.style.display = 'none';
    document.body.appendChild(keeper);

    function unlock() {
      state.unlocks++;
      var running = 0;
      for (var i = 0; i < seen.length; i++) {
        var c = seen[i];
        try {
          if (c.state !== 'running' && c.resume) c.resume();
          // the silent sample: this is the half iOS actually requires, and it
          // has to be started here, not in a promise callback
          var b = c.createBuffer(1, 1, 22050);
          var s = c.createBufferSource();
          s.buffer = b;
          s.connect(c.destination);
          (s.start || s.noteOn).call(s, 0);
        } catch (e) { /* an older context: the resume will have to do */ }
        if (c.state === 'running') running++;
      }
      state.running = running;

      // and the media session, in this same handler
      if (keeper.paused) {
        var play = keeper.play();
        if (play && play.then) {
          play.then(function () { state.media = 'playing'; })
              .catch(function (e) { state.media = 'refused: ' + e.name; });
        } else {
          state.media = 'playing';
        }
      }
      console.log('[audio] gesture #' + state.unlocks + ' contexts=' + seen.length +
                  ' running=' + running + ' media=' + state.media +
                  ' paused=' + keeper.paused);
    }

    // Every gesture, not just the first: Unity builds its context while the
    // player loads, and on a phone the first tap may land before it exists.
    ['pointerdown', 'touchend', 'mousedown', 'keydown'].forEach(function (n) {
      document.addEventListener(n, unlock, { capture: true, passive: true });
    });
  })();
  </script>

  <div id="boot">
    <div id="title">Bitcoin <span>Logistics</span> War</div>
    <div id="sub">build {{{ PRODUCT_VERSION }}}</div>
    <div id="howto">
      <img src="howto-1.png" alt="How to play, 1 of 4">
      <img src="howto-2.png" alt="How to play, 2 of 4">
      <img src="howto-3.png" alt="How to play, 3 of 4">
      <img src="howto-4.png" alt="How to play, 4 of 4">
    </div>
    <div id="pct">0%</div>
    <div id="track"><div id="bar"></div></div>
    <div id="stage">Connecting …</div>
    <div id="note"><span id="total">…</span> to load. The first time is the
      slowest — after that most of it is in the browser cache.</div>
    <div id="blwp-deposit"></div>
    <div id="err"></div>
    <div id="blwp-donation-noted"></div>
  </div>

  <!-- The deterministic core, loaded before Unity so the jslib glue can reach
       it. Generated by packages/core/tools/bundle.js and verified against the
       module build across four engines - see packages/core/README.md. It is a
       plain script rather than a module because Unity's jslib runs in the page
       realm and cannot import. -->
  <script src="blwp-core.js"></script>

  <!-- THE BLWP CLIENT, beside the core and never inside it.
       The core is what the game is drawn from; the client is what the player's
       commitments are published through. Two bundles, one tree, copied
       together by SyncCore - a page holding a client that signs a state hash a
       different core produced is the fault that arrangement exists to prevent.

       No session is opened unless a round is named. A player who was given
       none gets exactly the game that shipped before any of this, which is why
       BLWP_ROUND is undefined here rather than filled in with something
       plausible: a round contract is agreed before anyone moves, and inventing
       one in the page would be inventing a lobby. -->
  <script src="blwp-client.js"></script>
  <!-- Same secp256k1 the daemons use. Without it a named round never takes a seat. -->
  <script src="blwp-curve.js"></script>

  <script>
    const boot = document.getElementById('boot');
    const bar = document.getElementById('bar');
    const pct = document.getElementById('pct');
    const stage = document.getElementById('stage');
    const err = document.getElementById('err');

    // Unity reports one number for the whole load. Naming what is happening at
    // each part of it is the difference between "it is stuck" and "it is
    // working" - at 35 MB that judgement gets made by the person waiting.
    // Written in by the build, which is the only place the real figure is
    // known: the template cannot see the files it will be shipped beside.
    const TOTAL_MB = '__TOTAL_MB__';
    document.getElementById('total').textContent =
      TOTAL_MB.indexOf('_') === 0 ? 'A few megabytes' : TOTAL_MB + ' MB';

    const STAGES = [
      [0.00, 'Loading the program …'],
      [0.35, 'Loading the game data …'],
      [0.80, 'Building the battlefield …'],
      [0.97, 'Almost there …'],
    ];

    function show(p) {
      const clamped = Math.max(0, Math.min(1, p));
      bar.style.width = (clamped * 100).toFixed(1) + '%';
      // megabytes as well as percent: a percentage alone says nothing about
      // whether the wait is ten seconds or two minutes
      const done = (parseFloat(TOTAL_MB) || 0) * clamped;
      pct.textContent = parseFloat(TOTAL_MB)
        ? `${Math.round(clamped * 100)} %  ·  ${done.toFixed(1)} / ${TOTAL_MB} MB`
        : `${Math.round(clamped * 100)} %`;
      for (let i = STAGES.length - 1; i >= 0; i--) {
        if (clamped >= STAGES[i][0]) { stage.textContent = STAGES[i][1]; break; }
      }
    }

    // A DONATION THAT LEFT THE WALLET IS SHOWN EVEN WHEN THE ROUND CANNOT BE
    // REACHED (M3.2 6e). Measured before: a reload whose round link failed to
    // fetch showed only this screen's refusal - no wallet panel, no line - while
    // the tab's notes held "paid 1334, unpaid 666". The client reads the notes
    // for the round this link names and this tab's own key; no node and no
    // wallet is asked anything.
    function showNotedDonation() {
      const el = document.getElementById('blwp-donation-noted');
      if (!el || typeof BLWPCLIENT === 'undefined' || !BLWPCLIENT.notedDonationForLink) return;
      let noted = null;
      try { noted = BLWPCLIENT.notedDonationForLink(location.search, { storage: window.sessionStorage, curve: window.BLWP_CURVE }); } catch { noted = null; }
      if (!noted) return;
      el.textContent = BLWPCLIENT.donationPaidLine(noted);
      el.classList.add('show');
    }

    function fail(message) {
      err.textContent = message;
      err.classList.add('show');
      stage.textContent = 'Could not start';
    }

    const canvas = document.getElementById('canvas');
    const config = {
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: '{{{ COMPANY_NAME }}}',
      productName: '{{{ PRODUCT_NAME }}}',
      productVersion: '{{{ PRODUCT_VERSION }}}',
    };

    // Match the drawing buffer to the device, or a phone renders a blurry
    // upscale of a desktop-sized canvas.
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
    }
    resize();
    window.addEventListener('resize', resize);

    // NODE SIGNATURES ARE SCHNORR. Letter 26: a node's identity is its bond
    // key. crypto.subtle here is Ed25519, which is the session key, not the
    // advert. The jslib still hands Ed25519 to Client.at; this replaces it
    // with the curve the daemons signed under. Photographed 2026-09-09 09:33.
    if (typeof BLWPCLIENT !== 'undefined' && BLWPCLIENT.Client) {
      const at = BLWPCLIENT.Client.at.bind(BLWPCLIENT.Client);
      BLWPCLIENT.Client.at = function (discovery, opts) {
        const verify = (sig, msg, key) => !!(window.BLWP_CURVE && window.BLWP_CURVE.verify
          && window.BLWP_CURVE.verify(sig, msg, key));
        // AND EVERY NODE THE ROUND NAMED, so each checkpoint reaches the whole
        // committee. Measured 2026-09-10: sent to one daemon of the 2-of-2, a
        // run stored 1 checkpoint on A and 0 on B, and every later one was
        // refused. The client proves one node; these are where else to deliver.
        const nodes = discovery.nodes || window.BLWP_NODES;
        // AND THE PLAYER'S STAKE LOCK, if this page made one (W1b): `join`
        // hands it to every seat once the seat holds the entry.
        return at(Object.assign({}, discovery, { nodes: nodes }),
          Object.assign({}, opts, { verify: verify, stakeLock: window.BLWP_STAKE_LOCK || undefined }));
      };
    }

    // THE ROUND THIS PAGE WAS SENT TO, if it was sent to one.
    //
    // The page still refuses to INVENT a round - there is no contract written
    // down here and there never will be. What it can do is be told about one
    // that already exists: `?round=` names an id the daemons agreed on before
    // anybody opened this page, `node=` names who holds it, and the contract
    // is fetched and then HASHED - a node that answers with a different round
    // is refused rather than played. Every rule in that sentence is in
    // `@blwp/client`, where `node --test` drives it against real daemons; this
    // is only where the answer is put.
    //
    // BEFORE UNITY, not beside it: `NetSession` reads once, at Start, whether
    // there is a session to open, so a fetch that landed later would be a
    // round nobody joined.
    //
    // Two tabs are two players, because the key is in `sessionStorage` and
    // that is per tab. Without a round named, none of this runs and the page
    // is the single-player daily it has always been.
    // THE DONATION AUTHORITY'S SCHEME IS Ed25519 (ruled 2026-09-13), and this page
    // checks it with the browser's own crypto - as the session key is made.
    async function pageEd25519Verify(sig, msg, pub) {
      try {
        const key = await crypto.subtle.importKey('raw', pub, { name: 'Ed25519' }, false, ['verify']);
        return await crypto.subtle.verify({ name: 'Ed25519' }, key, sig, msg);
      } catch { return false; }
    }
    async function joinTheRoundIfOneWasNamed() {
      if (typeof BLWPCLIENT === 'undefined') return;
      const named = await BLWPCLIENT.joinFromQuery(location.search);
      if (!named) return;

      window.BLWP_ROUND = named.round;
      // BLWP_CHAIN AND BLWP_ADVERT ARE SET LAST, beside BLWP_ENTRY (M3.3-34): they
      // are what tells Unity there is a session to open (BlwpNetNodeUrl), and a
      // seat PLAY takes in this page lands while Unity is already running - a
      // session opened before the entry exists fails and cannot be opened again.
      // THE NODES THIS ROUND NAMED, so the bridge can ask all of them what the
      // round's randomness is. The player's own world is seeded from it, and a
      // page that asked one node would let that node put this player alone in
      // a world nobody replays.
      window.BLWP_NODES = named.nodes;
      // THE PLAYER'S KEY IS A KEY, and this page makes one.
      //
      // `player_pubkey` used to be 32 random bytes. It is where a winner's
      // payout is sent, so it has to be a secp256k1 x-only key - and the
      // browser's own crypto has no secp256k1, only Ed25519 and P-256. The
      // curve is loaded beside this script (`blwp-curve.js`), which is why the
      // guard below is a guard and not the normal path.
      const random = (n) => crypto.getRandomValues(new Uint8Array(n));
      if (!window.BLWP_CURVE || typeof window.BLWP_CURVE.pointX !== 'function') {
        throw new Error('this page has no curve to make a player key with');
      }
      // THE ROUND'S KEY FROM THE PLAYER'S SEED (§24, v4.6.2, F2). The tab keeps a
      // seed, not a key; each round's key is derived from it, and its refund
      // fingerprint is shown so the player can compare it OUTSIDE this page:
      //   node packages/blwp-node/tools/refund-key.mjs <seed> <round id>
      //
      // A SEED THE PLAYER ALREADY HOLDS is what makes the check mean anything: a
      // seed this page minted is one this page knows. So the player can paste
      // their own (or the backup from an earlier session) and the page reloads
      // and joins under it. A tab that imported nothing mints its own, for this
      // tab only, and nothing is kept where every tab reads it: a returning
      // session pastes the backup again.
      const seed = BLWPCLIENT.tabSeed({ storage: window.sessionStorage, random });
      const origin = BLWPCLIENT.seedOrigin({ storage: window.sessionStorage });
      const player = BLWPCLIENT.playerFor(
        Object.assign({}, named.round, { id: BLWPCLIENT.fromHex(named.roundIdHex) }),
        { seed, curve: window.BLWP_CURVE });
      // WHAT THIS TAB ALREADY DONATED TO THIS ROUND, FROM ITS NOTES, before any
      // seat (M3.2 6e): the panel shows it even if the seat is refused later;
      // payDonation's own answer replaces it when it comes.
      if (!window.BLWP_DONATION_PAID) {
        window.BLWP_DONATION_PAID = BLWPCLIENT.donationNotedState(window.sessionStorage,
          { roundId: player.roundId, playerPubkey: player.pubkey }) || undefined;
      }
      const refundEl = document.getElementById('blwp-refund');
      if (refundEl) {
        refundEl.textContent = 'refund key fingerprint ' + player.fingerprint
          + (origin === 'imported' ? ' (from the seed you imported)'
            : ' (from a seed this page made: back it up, or use your own below)')
          + ' - check it: refund-key.mjs <your seed> ' + named.roundIdHex;
        const backup = document.createElement('details');
        const label = document.createElement('summary');
        label.textContent = 'seed backup';
        const code = document.createElement('code');
        code.textContent = BLWPCLIENT.toHex ? BLWPCLIENT.toHex(seed) : Array.from(seed, (b) => b.toString(16).padStart(2, '0')).join('');
        backup.append(label, code);
        const own = document.createElement('div');
        const paste = document.createElement('input');
        paste.type = 'password'; paste.autocomplete = 'off'; paste.placeholder = 'your seed (64 hex)';
        const use = document.createElement('button');
        use.type = 'button'; use.textContent = 'use my seed';
        const why = document.createElement('div');
        use.addEventListener('click', () => {
          try {
            BLWPCLIENT.importSeed(paste.value, { storage: window.sessionStorage });
            location.reload();
          } catch (e) { why.textContent = e.message; }
        });
        own.append(paste, use, why);
        refundEl.append(backup, own);
      }

      // AND THE PAGE DEALS ITS OWN STAKE (23.1 steps 1 and 2).
      //
      // WHAT THIS FIXES IS A SILENT SEAT. `entryFor` was called with no stake,
      // so every seat this page ever took carried `random(32)` where
      // `sha256(P)` belongs and 32 zero bytes where the shares belong -
      // `stakeFor` was compiled into the bundle and had ZERO CALLERS. The
      // daemon accepts those zeros on purpose for M2, so nothing refused and
      // nothing said anything: a free seat at a paying round that the player
      // was never told about.
      //
      // DEALT TO THE SETTLEMENT SEATS AND TO NOBODY ELSE. `named.nodes` is the
      // contract's flat list, which `Roster.seatsFor` builds as the UNION of
      // the role committees - measured at nine keys for a seven-seat
      // settlement committee, two of them seats that could never open a share.
      // `fetchSettlementSeats` asks every node and refuses disagreement, the
      // same rule the randomness follows.
      //
      // THE HOLD INVOICE IS NOT THIS PAGE'S JOB YET. Dealing the stake is what
      // makes an entry settleable; paying it is bolt11 and a wallet, which is
      // M3.2. So the seat is dealt and the player is TOLD it is unpaid.
      // WHETHER THIS ROUND ASKS FOR MONEY, asked of the client rather than
      // read off the contract. The page names no contract field - a page that
      // carried its own could carry its own committee next - and the rule sits
      // where `node --test` can drive it.
      const pays = BLWPCLIENT.roundPays(named.round);
      // THE PLAYER'S DONATION (M3.2 6e, §22A): asked here in the browser's own
      // prompt, like the name, and only for a round that asks a stake. Default 0
      // - pressing nothing or cancelling donates nothing - and above 5% it asks a
      // second time. Kept per round in this tab, so a reload over a kept lock
      // writes the same amount. The rule is `chooseDonation`, where node --test
      // drives it; this page only asks and passes the answer on.
      // THE ROUND'S DONATION SET FIRST (M3.2 6e, §22A): from every seat of the
      // round, checked - the network's Ed25519 donation authority at the round's
      // height, rotations included, and the set the round names - so the prompt
      // lists every recipient before the wallet approves. With no set that
      // checks there is no donation to choose: it stays 0, and the page says why.
      let donationSet = null;
      if (pays) {
        const ds = await BLWPCLIENT.fetchDonationSet({ round: named.round, nodes: named.nodes, verifyEd25519: pageEd25519Verify });
        if (ds.ok) donationSet = ds.set;
        else { window.BLWP_DONATION_SET_WHY = ds.why; console.error('[blwp] no donation: ' + ds.why); }
      }
      window.BLWP_DONATION_SET = donationSet;
      const donation = pays && donationSet
        ? BLWPCLIENT.chooseDonation({ roundIdHex: named.roundIdHex, round: named.round,
          ask: (m, d) => window.prompt(m, d), confirm: (m) => window.confirm(m), storage: window.sessionStorage,
          recipientsLine: BLWPCLIENT.donationRecipientsLine(donationSet) })
        : { bps: 0, donationMsat: 0n };
      window.BLWP_DONATION = { bps: donation.bps, donationMsat: String(donation.donationMsat), kept: !!donation.kept };
      let stake = null;
      let claimKey = null;
      let stakeLock = null;
      if (pays) {
        let seats = null;
        try {
          seats = await BLWPCLIENT.fetchSettlementSeats(named.roundIdHex, named.nodes);
        } catch (e) {
          // REFUSED BY NAME rather than seated silently. A paying round whose
          // settlement committee this page cannot learn is a round whose stake
          // it cannot deal to anybody, and taking the seat anyway is the bug
          // this letter closed.
          window.BLWP_SEAT_REFUSED = 'this round pays and its settlement committee '
            + 'could not be learned, so no stake could be dealt: ' + e.message;
          console.error('[blwp] seat refused: ' + window.BLWP_SEAT_REFUSED);
          return;
        }
        // A ROUND WHOSE STAKE GOES INTO A FEDERATION LOCK NAMES AN ATTESTED
        // CLAIM KEY (23.1 step 0): the settlement seats' signatures, counted in
        // `@blwp/client` against the same seats, at the round's threshold. A
        // key short of it refuses the seat by name - one seat serving its own
        // key must not be the key a stake is locked to.
        if (BLWPCLIENT.roundLocks(named.round)) {
          // WAITED FOR, A LITTLE: the seats make the key when they seat the
          // round, and a link opened at once can find one seat still making it.
          const stageNow = document.getElementById('stage');
          const att = await BLWPCLIENT.awaitAttestedClaimKey({
            round: Object.assign({}, named.round, { id: BLWPCLIENT.fromHex(named.roundIdHex) }),
            seats: seats.seats, nodes: named.nodes, curve: window.BLWP_CURVE,
          }, {
            onWait: (short) => {
              if (stageNow) stageNow.textContent = 'Waiting for the round\'s seats to make its claim key: '
                + String(short.attested || 0) + ' of ' + String(short.needed || '?') + ' …';
            },
          });
          if (!att.ok) {
            window.BLWP_SEAT_REFUSED = att.why;
            console.error('[blwp] seat refused: ' + att.why);
            return;
          }
          claimKey = att;
        }
        // `round.id` IS BYTES, and the page holds the hex it was sent. The
        // contract decodes without an id - it is the hash OF the contract -
        // so it is put back on here rather than left for `stakeFor` to guess.
        // A LOCK THIS TAB ALREADY MADE FOR THIS ROUND, THAT NO SEAT HAS COMMITTED
        // (W1b): the same stake and the same lock, not a second deal and a second
        // deposit - a reload between the lock and the seat taking the entry.
        const kept = BLWPCLIENT.roundLocks(named.round)
          ? BLWPCLIENT.savedLock(window.sessionStorage, { roundId: BLWPCLIENT.fromHex(named.roundIdHex), playerPubkey: player.pubkey })
          : null;
        // A LOCK A SEAT ALREADY COMMITTED (6d, W4 hole 1): no new stake and no second
        // deposit - measured before, a reload onto the round link set out to fund a second
        // 980000 + 20000 msat. The join stops and says why; the collect runs from the
        // record the first join kept.
        const use = BLWPCLIENT.keptLockUse(kept);
        if (use.use === 'staked') {
          window.BLWP_SEAT_REFUSED = use.why;
          console.error('[blwp] seat refused: ' + use.why);
          return;
        }
        const reuse = use.use === 'reuse' ? use.kept : null;
        stake = reuse ? reuse.stake : await BLWPCLIENT.stakeFor(
          Object.assign({}, named.round, { id: BLWPCLIENT.fromHex(named.roundIdHex) }), {
            seats: seats.seats, curve: window.BLWP_CURVE, random, playerPubkey: player.pubkey,
            needed: BLWPCLIENT.sharesNeededFor(named.round),
          });
        // A HANDOUT TOO FEW SEATS HOLD IS A STAKE NOBODY CAN OPEN, and the
        // count is a DECISION rather than a number in a log. Reconstruction
        // takes five of seven; measured with three reachable, the node this
        // page joined seated the player 201 while every other node refused the
        // entry 400, and the stake could never have been settled.
        //
        // The posting and the threshold are in `@blwp/client` for the reason
        // `roundPays` is: this file is the one `node --test` cannot load.
        // A kept stake's handout was taken by the seats before its lock was made.
        const put = reuse ? { ok: true, accepted: seats.seats.length, refused: [] }
          : await BLWPCLIENT.postHandout(stake, named.nodes, { needed: BLWPCLIENT.sharesNeededFor(named.round) });
        if (!put.ok) {
          window.BLWP_SEAT_REFUSED = put.why;
          console.error('[blwp] seat refused: ' + put.why + ' — ' + put.refused.join('; '));
          return;
        }
        // AND A ROUND WHOSE STAKE GOES INTO A FEDERATION LOCK GETS ITS LOCK
        // NOW, BEFORE THE ENTRY IS BUILT (W1b; 23.1 steps 3-5). The entry names
        // the lock's outpoint, so there is no entry without one - this page used
        // to write zeros there and every seat could only refuse it. The lock
        // client is the stock fedimint client built to wasm; what it is asked is
        // decided in `@blwp/client` (`lockStake`), where `node --test` drives it.
        // The deposit invoice is shown here for the player's own wallet to pay.
        if (BLWPCLIENT.roundLocks(named.round)) {
          const depositEl = document.getElementById('blwp-deposit');
          // ON THE LOADING SCREEN, which is all a player sees while this waits:
          // the step on the stage line, the invoice in its own selectable box.
          const stageEl = document.getElementById('stage');
          const whose = { roundId: BLWPCLIENT.fromHex(named.roundIdHex), playerPubkey: player.pubkey };
          // WHAT THE PAYOUT IS COLLECTED WITH after the window (6d): the same seed,
          // round and federation the lock was made with.
          window.BLWP_LOCK_JOIN = { invite: named.federation, roundIdHex: named.roundIdHex, seed, nodes: named.nodes };
          const committedTo = (eid) => BLWPCLIENT.markLockCommitted(window.sessionStorage, Object.assign({ entryId: eid }, whose));
          if (reuse) {
            stakeLock = { outpoint: reuse.lock.outpoint, fields: reuse.lock.fields, feeLock: reuse.lock.feeLock || null,
              needed: BLWPCLIENT.sharesNeededFor(named.round), onCommitted: committedTo };
            window.BLWP_STAKE_LOCK = stakeLock;
            if (stageEl) stageEl.textContent = BLWPCLIENT.lockLine(stakeLock);
            console.log('[blwp] stake lock kept from before the reload, at '
              + BLWPCLIENT.toHex(stakeLock.outpoint.txid) + ':' + String(stakeLock.outpoint.outIdx));
          } else try {
            const wasm = await import('./blwp_lock_client.js');
            await wasm.default();
            const made = await BLWPCLIENT.lockStake({
              round: named.round, roundId: BLWPCLIENT.fromHex(named.roundIdHex), invite: named.federation,
              seed, stake, claimKey, playerPubkey: player.pubkey, LockClient: wasm.LockClient,
              donationMsat: donation.donationMsat,
              storage: window.sessionStorage,
              onStep: (step) => {
                if (stageEl) stageEl.textContent = 'Stake lock: ' + step + ' …';
                if (window.BLWP_JOIN) window.BLWP_JOIN.stage = 'stake lock: ' + step;
                console.log('[blwp] stake lock: ' + step);
              },
              onDeposit: (d) => {
                window.BLWP_DEPOSIT = { invoice: d.invoice, amountMsat: String(d.amountMsat) };
                if (depositEl) {
                  depositEl.textContent = 'Pay ' + String((d.amountMsat + 999n) / 1000n) + ' sat into the round\'s federation '
                    + 'from any Lightning wallet to lock your stake:';
                  const box = document.createElement('code');
                  box.textContent = d.invoice;
                  depositEl.appendChild(box);
                }
                console.log('[blwp] stake lock deposit: ' + String(d.amountMsat) + ' msat, ' + d.invoice);
              },
            });
            // AND ITS FEE LOCK, ONLY WHEN THE GATE SAID IT CAN PAY A SEAT (Pick b):
            // a 100 sat round makes none, so the player is charged no lock that expires unused.
            stakeLock = { outpoint: made.outpoint, fields: made.fields, feeLock: made.feeLock || null,
              needed: BLWPCLIENT.sharesNeededFor(named.round), onCommitted: committedTo };
            console.log('[blwp] fee lock: ' + (made.feeLock ? 'minted, ' + String(made.feeLock.fields.amountMsat) + ' msat' : 'none - ' + made.feeGate.why));
            // KEPT BEFORE ANYTHING ELSE CAN HAPPEN TO THE TAB: a reload from here
            // on uses this lock, not a second deposit.
            BLWPCLIENT.saveLock(window.sessionStorage, Object.assign({ stake, lock: made }, whose));
            window.BLWP_STAKE_LOCK = stakeLock;
            if (depositEl) depositEl.textContent = '';
            if (stageEl) stageEl.textContent = BLWPCLIENT.lockLine(stakeLock);
            console.log('[blwp] stake locked at ' + BLWPCLIENT.toHex(made.outpoint.txid) + ':' + String(made.outpoint.outIdx));
          } catch (e) {
            window.BLWP_SEAT_REFUSED = 'this round\'s stake goes into a federation lock, and it was not made: ' + e.message;
            console.error('[blwp] seat refused: ' + window.BLWP_SEAT_REFUSED);
            return;
          }
          // AND WHAT THE COLLECT NEEDS AFTER THE WINDOW, KEPT IN THE TAB (6d): a reload -
          // onto the round link or anywhere - collects from this, not from the join.
          BLWPCLIENT.saveCollect(window.sessionStorage, Object.assign({}, window.BLWP_LOCK_JOIN, { round: named.round, stakeLock }));
        }
        window.BLWP_STAKE = {
          dealt: true, seats: seats.seats.length, agreed: seats.agreed,
          accepted: put.accepted, refused: put.refused, paid: false,
          // WHO TO COUNT, once it is paid (23.1 step 5): the settlement seats'
          // keys and the node addresses this page holds.
          seatKeys: seats.seats, nodes: named.nodes,
        };
        // WHETHER IT IS PAID IS NOT SAID HERE. The node answers `x-hold` when it
        // takes the entry and `Client.join` keeps it; the chip prints that
        // rather than this page's assumption. Dealing is not funding, and a
        // page that printed "not paid" as a constant would be reporting its
        // own guess as the player's balance.
        console.log('[blwp] stake dealt to ' + seats.seats.length + ' settlement seat(s), '
          + put.accepted + ' accepted the handout. Paying it is M3.2; the chip says '
          + 'what the node holds.');
      } else {
        window.BLWP_STAKE = { dealt: false, paid: false, free: true };
        console.log('[blwp] this round asks no stake, so none is dealt');
      }

      window.BLWP_ENTRY = BLWPCLIENT.entryFor(
        Object.assign({}, named.round, { id: BLWPCLIENT.fromHex(named.roundIdHex) }), {
          seed, curve: window.BLWP_CURVE, playerPubkey: player.pubkey, random, ...(stake ? { stake } : {}),
          ...(claimKey ? { claimKey } : {}), ...(stakeLock ? { stakeLock } : {}),
          donationMsat: donation.donationMsat,
        });
      window.BLWP_CHAIN = named.chain;
      window.BLWP_ADVERT = named.advert;
      console.log('[blwp] joining round ' + named.roundIdHex + ' from ' + named.from);
    }

    // ------------------------------------------------------------ the wallet
    //
    // M3.2 item 6, the player's half. FOUR THINGS AND NOT ONE RULE: paste a
    // connection, show what this seat owes, show the running total, and call
    // `payStake`. Everything that DECIDES is in `@blwp/client` where
    // `node --test` drives it - `tabWallet` holds the connection, `spendLog`
    // is what §24A.1 requires a client to show, `spentLine` turns it into a
    // sentence, and `payStake` refuses a quote this entry did not sign. This
    // page renders and calls; it computes nothing.
    //
    // THERE IS NO BOLT11 ON THIS PAGE. `payStake` takes an ENTRY, so there is
    // no argument here that could carry an invoice and no second way to pay.
    const wallet = (typeof BLWPCLIENT !== 'undefined' && BLWPCLIENT.tabWallet)
      ? BLWPCLIENT.tabWallet({ storage: window.sessionStorage }) : null;
    // KEPT IN THE TAB (M3.2 6e): measured before, a reload said "nothing paid
    // this session" beside "1334 msat paid" - the log was page memory.
    const spent = (typeof BLWPCLIENT !== 'undefined' && BLWPCLIENT.spendLog)
      ? BLWPCLIENT.spendLog({ storage: window.sessionStorage }) : null;
    let owed = null;          // the last quote, as the client checked it
    let budget = null;        // what the WALLET said it will still let us spend
    let paying = false;
    let donationPaying = false;       // the donation is paid once per seat
    let walletWhy = '';

    function theClient() {
      const inst = window.unityInstance;
      const mod = (inst && inst.Module) || (typeof Module !== 'undefined' ? Module : window.Module);
      return (mod && mod.blwpNet && mod.blwpNet.client) || null;
    }

    /**
     * WHAT THIS SEAT OWES, asked of the client and never worked out here.
     *
     * `invoice()` refuses an amount, a hash or a seat this entry did not sign,
     * so a quote that reaches this page is one the player's own contract
     * stands behind.
     */
    async function askWhatIsOwed() {
      const client = theClient();
      // A LOCK ROUND'S STAKE IS THE LOCK (W1b), not a hold invoice: no node
      // quotes it, and asking would be a question with no answer.
      if (window.BLWP_ROUND && BLWPCLIENT.roundLocks(window.BLWP_ROUND)) return;
      // A FREE ROUND ASKS NOBODY FOR AN INVOICE (M3.3-34): there is no stake,
      // no wallet and no Lightning in it. Measured before this: two free seats
      // asked GET /invoice 37 times in 55 s, each refused by the node.
      if (window.BLWP_ROUND && !BLWPCLIENT.roundPays(window.BLWP_ROUND)) return;
      // THE SEATED ENTRY, which carries its round id and session key. This
      // passed BLWP_ENTRY, which carries neither, so every quote threw
      // "expected 32 bytes, got nothing" in entryId and the button never lit -
      // measured on the page, today's included.
      if (!client || !client.seatEntry || owed) return;
      const said = await client.invoice(client.seatEntry);
      if (said.ok) owed = said;
      else if (said.status !== 404) walletWhy = said.why;
      paintWallet();
    }

    /**
     * WHAT THE WALLET WILL STILL LET THIS CONNECTION SPEND.
     *
     * ASKED, NEVER READ OFF THE CONNECTION STRING. NIP-47's URI carries no
     * budget - the field that pretended it did is gone - so this is three
     * read-only calls to the wallet, and a wallet that reports neither a budget
     * nor a balance says so in words rather than showing an empty number.
     */
    async function askTheBudget() {
      if (!wallet || !wallet.connected || budget) return;
      const held = wallet.current();
      if (!held.ok) return;
      budget = await BLWPCLIENT.walletBudget(held, {
        curve: window.BLWP_CURVE,
        random: (n) => crypto.getRandomValues(new Uint8Array(n)),
      });
      paintWallet();
    }

    async function payTheStake() {
      const client = theClient();
      if (paying || !client || !client.seatEntry
          || (window.BLWP_ROUND && BLWPCLIENT.roundLocks(window.BLWP_ROUND))) return;
      const pasted = document.getElementById('blwp-nwc').value.trim();
      if (pasted) {
        const took = wallet.connect(pasted);
        if (!took.ok) { walletWhy = took.why; return paintWallet(); }
        document.getElementById('blwp-nwc').value = '';
        budget = null;                 // a different wallet has a different one
      }
      const held = wallet.current();
      if (!held.ok) { walletWhy = held.why; return paintWallet(); }

      paying = true;
      walletWhy = 'asking the wallet…';
      paintWallet();
      const said = await client.payStake(client.seatEntry, {
        connection: held, curve: window.BLWP_CURVE, log: spent,
        random: (n) => crypto.getRandomValues(new Uint8Array(n)),
      });
      paying = false;
      // AND COUNT WHO HAS SEEN IT (23.1 step 5): every settlement seat is asked,
      // lightly, until enough have; the chip prints "seen by N of M". Nothing
      // waits on it - the player is already driving. WHATEVER payStake SAID: a
      // wallet can answer after it gave up and still have paid. The chip also
      // starts it from the seat; a second start joins the running count.
      if (client.watchStake && window.BLWP_STAKE && window.BLWP_STAKE.seatKeys) {
        client.watchStake({
          seats: window.BLWP_STAKE.seatKeys, nodes: window.BLWP_STAKE.nodes, contract: window.BLWP_ROUND,
        }).catch((e) => console.error('[blwp] stake count: ' + e.message));
      }
      walletWhy = said.ok
        ? 'paid — the stake is held for this round'
        : said.why;
      // The quote is asked again so the state a player is shown is the node's
      // and not this page's memory of it - and so is the budget, which has
      // just moved by exactly the amount that was paid.
      owed = null;
      budget = null;
      await askWhatIsOwed();
      await askTheBudget();
      return paintWallet();
    }

    // WHERE THIS SEAT'S STAKE WENT (M3.2 6e). Measured before: after a round
    // settled the panel still said HELD - the quote is asked once and never
    // again - and nothing on the page said what the pool took. Every settlement
    // seat is asked, lightly, until the hold has left HELD; the answer is the
    // seats' own (`settlementBy`), and the line is the client's.
    let settlementAsking = false;
    async function askTheSettlement() {
      const c = theClient();
      if (settlementAsking || !c || !c.seatEntry || !c.where || !c.where.entryId) return;
      if (!window.BLWP_ROUND || !BLWPCLIENT.roundPays(window.BLWP_ROUND) || BLWPCLIENT.roundLocks(window.BLWP_ROUND)) return;
      if (!window.BLWP_STAKE || !window.BLWP_STAKE.seatKeys) return;
      const was = window.BLWP_SETTLEMENT;
      if (was && ['SETTLED', 'CANCELLED', 'EXPIRED'].includes(was.hold)) return;
      settlementAsking = true;
      try {
        window.BLWP_SETTLEMENT = await BLWPCLIENT.settlementBy({
          entryId: c.where.entryId, seats: window.BLWP_STAKE.seatKeys, nodes: window.BLWP_STAKE.nodes,
        });
        // A STAKE THAT CAME BACK IS NOT SPENT (M3.2 6e): a hold the seats say ended
        // CANCELLED or EXPIRED is marked returned in the running total - the rule is
        // the client's; the hash is the hold's (the entry's stake commitment).
        if (spent && c.seatEntry.stakeCommitment)
          BLWPCLIENT.noteSettlement(spent, window.BLWP_SETTLEMENT, c.seatEntry.stakeCommitment);
      } catch (e) { console.error('[blwp] settlement: ' + e.message); }
      settlementAsking = false;
      paintWallet();
    }

    // THE WINNER'S PAYOUT, COLLECTED BY THIS PAGE (6d, W4). After the window the
    // seats' one settlement pays the winner a pre-expired payout contract to its
    // key; the page asks the seats for it and spends it into this tab's federation
    // wallet. A loser is told there is none, and its lock client is asked nothing.
    // Which it is, is the client's (`redeemPayout`); this only asks and paints.
    let payoutAsking = false;
    async function collectThePayout() {
      // FROM THE TAB'S KEPT RECORDS, NOT THE JOIN'S GLOBALS: measured, a reload lost the
      // globals and left the winner's 978000 msat payout and 980000 msat stake in the
      // federation. The newest round is the one painted.
      if (payoutAsking || typeof BLWPCLIENT === 'undefined' || !BLWPCLIENT.savedCollects) return;
      const kept = BLWPCLIENT.savedCollects(window.sessionStorage).filter((r) => BLWPCLIENT.roundLocks(r.round));
      if (!kept.length) return;
      const newest = kept[kept.length - 1];
      window.BLWP_COLLECT = { roundIdHex: newest.roundIdHex, round: newest.round, stakeLock: newest.stakeLock };
      if (newest.done) window.BLWP_COLLECT_LINE = [newest.done.payout, newest.done.stake].filter(Boolean).join(' · ');
      const owed = kept.filter((r) => !r.done);
      if (!owed.length) { paintWallet(); return; }
      payoutAsking = true;
      try {
        const wasm = await import('./blwp_lock_client.js');
        await wasm.default();
        for (const r of owed) {
          const ask = { round: r.round, roundId: BLWPCLIENT.fromHex(r.roundIdHex), invite: r.invite,
            seed: r.seed, curve: window.BLWP_CURVE, LockClient: wasm.LockClient, storage: window.sessionStorage, nodes: r.nodes };
          const p = await BLWPCLIENT.redeemPayout(ask);
          // AND THE PLAYER'S OWN STAKE (6d): once the seats have settled - they forfeit a
          // qualifier's lock only then - into the same wallet; a loser's is told it went
          // into the pool.
          // ASKED EVERY TIME, not only after a final payout: returnStake checks for the seats'
          // settlement itself. Measured: a payout the page could not finish kept the stake
          // step from ever asking, and the winner's 980000 msat stayed in the federation.
          const s = await BLWPCLIENT.returnStake(Object.assign({}, ask, { client: p.client || null }));
          if (r === newest) {
            window.BLWP_COLLECT_LINE = null;
            window.BLWP_PAYOUT = Object.assign({}, p, { client: undefined });
            window.BLWP_STAKE_BACK = s ? Object.assign({}, s, { client: undefined }) : null;
          }
          if (p.final && s && s.final) {
            const done = { payout: BLWPCLIENT.payoutLine(p), stake: BLWPCLIENT.stakeBackLine(s) };
            BLWPCLIENT.markCollectDone(window.sessionStorage, r.roundIdHex, done);
            console.log('[blwp] payout: ' + done.payout);
            console.log('[blwp] stake: ' + done.stake);
          }
        }
      } catch (e) { console.error('[blwp] payout: ' + e.message); }
      payoutAsking = false;
      paintWallet();
    }

    function paintWallet() {
      const el = document.getElementById('blwp-wallet');
      if (!el || !wallet || typeof BLWPCLIENT === 'undefined') return;
      // A ROUND THAT ASKS NO MONEY GETS NO WALLET. Nothing to pay, nothing to
      // show, and a payment box on a free round is a question with no answer.
      // A ROUND THE TAB STILL COLLECTS FROM counts as shown when no round is joined (6d):
      // after a reload onto the lobby the panel still says what came back.
      const shown = window.BLWP_ROUND || (window.BLWP_COLLECT && window.BLWP_COLLECT.round);
      const pays = shown && BLWPCLIENT.roundPays(shown);
      if (!pays) { el.style.display = 'none'; return; }
      el.style.display = 'block';
      // EACH DONATION SHARE, PAID / UNPAID / OUTCOME UNKNOWN (M3.2 6e): the
      // client's line off the client's state - which on a reload is the tab's
      // notes - painted before the lock branch, so a lock round shows it too.
      document.getElementById('blwp-donation').textContent = BLWPCLIENT.donationPaidLine(window.BLWP_DONATION_PAID);
      // AND WHERE THE STAKE WENT once the round settled (M3.2 6e): the seats' own
      // hold state, the hold's amount and the round's pool - read, not computed.
      document.getElementById('blwp-settled').textContent = BLWPCLIENT.settledLine(window.BLWP_SETTLEMENT);
      // A LOCK ROUND'S STAKE GOES INTO ITS LOCK (W1b), from the deposit on the
      // loading screen: the panel says so, then where the lock is and when it
      // comes back - and never offers a hold invoice. Keyed on the ROUND, not on
      // the lock: measured, keyed on the lock the hold panel stood beside the
      // deposit invoice the whole time the page waited for it.
      if (shown && BLWPCLIENT.roundLocks(shown)) {
        const lockShown = window.BLWP_STAKE_LOCK || (window.BLWP_COLLECT && window.BLWP_COLLECT.stakeLock);
        document.getElementById('blwp-owed').textContent = lockShown
          ? BLWPCLIENT.lockLine(lockShown)
          : 'this round\'s stake goes into a federation lock: pay the deposit shown below';
        document.getElementById('blwp-settled').textContent = window.BLWP_COLLECT_LINE || [BLWPCLIENT.payoutLine(window.BLWP_PAYOUT),
          BLWPCLIENT.stakeBackLine(window.BLWP_STAKE_BACK)].filter(Boolean).join(' · ');
        for (const id of ['blwp-spent', 'blwp-budget', 'blwp-why']) document.getElementById(id).textContent = '';
        for (const id of ['blwp-nwc', 'blwp-pay']) document.getElementById(id).style.display = 'none';
        return;
      }

      // THE BREAKDOWN IS THE CLIENT'S. 22A: the commitment, the fee and the
      // donation coming OUT of it, the net stake, and what the wallet is asked
      // - all off the entry this player signed, none of it subtracted here.
      document.getElementById('blwp-owed').textContent =
        BLWPCLIENT.owedLine(window.BLWP_ENTRY, owed, window.BLWP_SETTLEMENT);
      // THE TOTAL IS THE CLIENT'S. A page that added up its own payments would
      // be showing a figure nobody checked.
      document.getElementById('blwp-spent').textContent = BLWPCLIENT.spentLine(spent);
      // AND WHAT IS LEFT, in the wallet's own words. `budgetLine` says WHICH
      // number it is - a budget is this connection's allowance and a balance is
      // everything the player owns, and on a payment screen the two must never
      // read alike.
      document.getElementById('blwp-budget').textContent =
        wallet.connected ? BLWPCLIENT.budgetLine(budget) : '';
      document.getElementById('blwp-nwc').placeholder = wallet.connected
        ? 'wallet connected · paste another to replace it'
        : 'nostr+walletconnect://…';
      document.getElementById('blwp-pay').disabled = paying || !owed;
      document.getElementById('blwp-why').textContent = walletWhy;
    }

    const nodeHealth = {};
    async function probeNodes() {
      const nodes = (new URLSearchParams(location.search).get('node') || '')
        .split(',').map((s) => s.trim()).filter(Boolean);
      await Promise.all(nodes.map(async (u, i) => {
        const name = /blwp-b|:8091/.test(u) ? 'B' : /blwp-a|:8090/.test(u) ? 'A' : String(i + 1);
        try {
          const r = await fetch(u.replace(/\/+$/, '') + '/identity');
          nodeHealth[name] = r.ok ? 'ok' : 'http ' + r.status;
        } catch (e) {
          nodeHealth[name] = 'down';
        }
      }));
    }
    function playLine(net) {
      if (!net) return 'play · not started';
      if (net.error) return 'play · ' + net.error;
      const c = net.client;
      if (!c) return 'play · ' + (net.state || 'opening');
      const where = c.base || '';
      const which = /blwp-b|:8091/.test(where) ? 'B' : /blwp-a|:8090/.test(where) ? 'A' : where;
      const sock = c.sock && c.sock.readyState === 1 ? 'up' : (c.state || 'no socket');
      return 'play · ' + which + ' ' + sock;
    }
    function paintPlayers() {
      const el = document.getElementById('blwp-players');
      if (!el) return;
      if (!window.BLWP_ROUND) { el.style.display = 'none'; return; }
      el.style.display = 'block';
      const inst = window.unityInstance;
      const mod = (inst && inst.Module) || (typeof Module !== 'undefined' ? Module : window.Module);
      const net = mod && mod.blwpNet;
      const seated = !!(window.BLWP_ENTRY);
      const others = (net && net.ghosts && typeof net.ghosts.others === 'number') ? net.ghosts.others : 0;
      // WHETHER ANYBODY IS DRAWING THEM. A field filling with pictures nobody
      // takes reads the same as an empty round unless the line says so.
      const stalled = !!(net && net.ghosts && net.ghosts.stalled);
      // AND WHERE THE NEWEST OF THEM IS. Each player parks at their own bay -
      // 24 doors, 6.8 m apart - so two tabs start up to 156 m apart on one
      // apron, and a truck drawn correctly at the far end is off screen. Read
      // this against the other tab's own position readout: the same numbers
      // mean the picture is right and the camera is pointed elsewhere.
      const at = (typeof BLWPCLIENT !== 'undefined' && BLWPCLIENT.newestPose && net)
        ? BLWPCLIENT.newestPose(net.ghosts) : null;
      const ab = ['A', 'B'].map((n) => n + ' ' + (nodeHealth[n] || '…')).join(' · ');
      // AND WHETHER THIS TAB'S OWN INPUTS ARE LANDING. A tab whose batches the
      // node refuses keeps its socket, its player count and its driving, and
      // loses only every watcher's picture of it - frozen at the last tick that
      // landed. It is the one fault none of the numbers above can show.
      const refused = (net && net.client && net.client.refusedWhy) || null;
      // WHY THERE IS NO SEAT, AND WHAT THE SEAT COST. Both went to the console
      // only, so a refused seat read exactly like a round nobody was sent to
      // and a free seat read exactly like a funded one. The hold state is the
      // NODE's word, kept by `Client.join` from the answer it already gives.
      const seatRefused = window.BLWP_SEAT_REFUSED || null;
      // THE COUNT RUNS FROM THE SEAT, not only from this page's own payment: a
      // payment that lands after payStake gave up would otherwise never be
      // counted. Started once; stopped at N >= T, at the run's end, or on close.
      const c = net && net.client;
      // AND THE DONATION, ONCE THE SEATS HOLD THE STAKE (M3.2 6e, §24A.2, §22A):
      // measured before, it went as soon as the seats took the entry - before
      // "Pay the stake" - so a seated player who never paid the stake donated.
      // `c.stakeCommitted` is the seats' count; the Client refuses before it too.
      // the player's wallet pays each recipient of the checked set its share,
      // through the player's own Client (\`payDonation\`) - an entry and a set,
      // never an invoice. A failed
      // share is reported and not redirected; the entry stands either way. It
      // waits for a connected wallet, and runs once per page - and ONCE PER
      // PLAYER PER ROUND ACROSS A RELOAD: handed the tab's sessionStorage, the
      // Client notes each share before its wallet is asked and never asks a
      // noted one again, so a reload over a kept lock reports and sends nothing.
      if (c && c.seatEntry && window.BLWP_DONATION_SET && typeof c.seatEntry.donationMsat === 'bigint'
          && c.seatEntry.donationMsat > 0n && c.stakeCommitted === true && !donationPaying && wallet) {
        const heldWallet = wallet.current();
        if (heldWallet.ok) {
          donationPaying = true;
          window.BLWP_DONATION_PAID = { state: 'paying' };
          c.payDonation(c.seatEntry, window.BLWP_DONATION_SET, {
            round: window.BLWP_ROUND, connection: heldWallet, curve: window.BLWP_CURVE, log: spent, storage: window.sessionStorage,
            random: (n) => crypto.getRandomValues(new Uint8Array(n)),
          }).then((said) => {
            window.BLWP_DONATION_PAID = BLWPCLIENT.donationPaidState(window.BLWP_DONATION_SET, said);
            paintWallet();
          }).catch((e) => { window.BLWP_DONATION_PAID = { state: 'error', why: e.message }; paintWallet(); });
        }
      }
      if (c && c.watchStake && c.seatEntry && window.BLWP_STAKE && window.BLWP_STAKE.seatKeys
          && !c.stakeWatch && !c.stakeCommitted && !c.ended && !c.stakeWatchStopped) {
        net.client.watchStake({
          seats: window.BLWP_STAKE.seatKeys, nodes: window.BLWP_STAKE.nodes, contract: window.BLWP_ROUND,
        }).catch((e) => console.error('[blwp] stake count: ' + e.message));
      }
      const stake = window.BLWP_STAKE
        ? Object.assign({}, window.BLWP_STAKE, {
          hold: (net && net.client && net.client.seatHold) || null,
          seen: (net && net.client && net.client.stakeCount) || null,
        })
        : null;
      const who = (typeof BLWPCLIENT !== 'undefined' && BLWPCLIENT.playersLine)
        ? BLWPCLIENT.playersLine({ seated, others, stalled, at, refused, seatRefused, stake, names: window.BLWP_OTHER_NAMES || [] })
        : (seated ? (others ? (1 + others) + ' players in this round' : '1 player · waiting') : 'round named · not seated');
      el.textContent = ab + '\n' + playLine(net) + '\n' + who;
    }
    // WHO THE OTHER PLAYERS ARE (M3.3-34): this tab hands the round's seats its
    // name, signed with the round key it is seated under, and asks them for the
    // others' - every record checked against its player's key before its name
    // is drawn. A seat that has not seated this player yet refuses it (409), so
    // it is handed again until every seat has kept it. The name decides nothing.
    // Each ask is given 8 s, and one exchange runs at a time: a seat that does
    // not answer must not hold the others' names back. When no seat answers,
    // `namesOf` says so and the names already drawn stay drawn.
    const namesKept = new Set();
    let namesBusy = false;
    const namesFetch = (u, o) => fetch(u, Object.assign({}, o, { signal: AbortSignal.timeout(8000) }));
    async function exchangeNames() {
      if (namesBusy || typeof BLWPCLIENT === 'undefined' || !BLWPCLIENT.namesOf) return;
      if (!window.BLWP_ROUND || !window.BLWP_ENTRY || !window.BLWP_CURVE) return;
      namesBusy = true;
      const said = { posted: [], error: null };
      try {
        const nodes = window.BLWP_NODES || [];
        const left = nodes.filter((n) => !namesKept.has(n));
        if (left.length) {
          try {
            const signed = BLWPCLIENT.nameRecordFor(window.BLWP_ROUND, { storage: window.sessionStorage,
              random: (n) => crypto.getRandomValues(new Uint8Array(n)), curve: window.BLWP_CURVE });
            for (const s of await BLWPCLIENT.postName(signed, left, { fetcher: namesFetch })) {
              said.posted.push(s.node + ' ' + s.status);
              if (s.status === 201 || s.status === 200) namesKept.add(s.node);
            }
          } catch (e) { said.error = 'name: ' + e.message; console.error('[blwp] name: ' + e.message); }
        }
        try {
          const mine = window.BLWP_ENTRY.playerPubkey ? BLWPCLIENT.toHex(window.BLWP_ENTRY.playerPubkey) : null;
          const all = await BLWPCLIENT.namesOf({ roundId: BLWPCLIENT.roundId(window.BLWP_ROUND), nodes, fetcher: namesFetch,
            verify: (s, m, k) => !!window.BLWP_CURVE.verify(s, m, k) });
          window.BLWP_OTHER_NAMES = all.filter((x) => x.player !== mine).map((x) => x.name);
        } catch (e) { said.error = 'names: ' + e.message; console.error('[blwp] names: ' + e.message); }
      } finally {
        // WHAT THE LAST EXCHANGE DID, for a harness or a player's console.
        window.BLWP_NAMES_SAID = { posted: said.posted, kept: [...namesKept], shown: window.BLWP_OTHER_NAMES || [],
          error: said.error, atMs: Date.now() };
        namesBusy = false;
      }
    }
    setInterval(exchangeNames, 3000);
    setInterval(paintPlayers, 500);
    const payButton = document.getElementById('blwp-pay');
    if (payButton) payButton.addEventListener('click', payTheStake);
    setInterval(() => { askWhatIsOwed(); askTheBudget(); paintWallet(); }, 1000);
    setInterval(askTheSettlement, 5000);
    setInterval(collectThePayout, 5000);
    probeNodes();
    setInterval(probeNodes, 2000);
    paintPlayers();

    const script = document.createElement('script');
    script.src = 'Build/{{{ LOADER_FILENAME }}}';
    script.onerror = () => fail('The loader could not be loaded.');
    script.onload = () => {
      createUnityInstance(canvas, config, show)
        .then((instance) => {
          window.unityInstance = instance;
          show(1);
          // the deposit box outlives the loading screen: a seat taken later asks there
          const deposit = document.getElementById('blwp-deposit');
          if (deposit) document.body.appendChild(deposit);
          boot.classList.add('done');
          setTimeout(() => boot.remove(), 600);
          canvas.focus();
        })
        .catch(fail);
    };

    // THE LOBBY (M3.3-34, §25), when the link names nodes and no round.
    //
    // "A lobby carries nothing": the named nodes say which rounds they hold,
    // and `fetchLobby` fetches and hashes every one before it is a row - free
    // or paying and open or pending are the CONTRACT's, and the seat counts are
    // shown as what each node says. Join is the round's own link, so the seat
    // is taken by exactly the path a shared round link takes. Unity DRAWS it:
    // the lobby is the title screen (SplashScreen, DailyLobby.cs).
    //
    // AND AT THE BARE ROOT, THE DAILY'S OWN LOBBY: a visitor who opens the page
    // with no link at all is shown the rounds the Daily's seats hold, named by
    // `daily.json` deployed beside this page - the same names a lobby link
    // carries, held to the same rules (`dailyLobbySearch`). Read only when the
    // address carries no query; a missing or broken file leaves the root the
    // offline daily it was.
    async function dailySearch() {
      if (location.search.replace(/^\?/, '') !== '' || !BLWPCLIENT.dailyLobbySearch) return null;
      try {
        const r = await fetch('daily.json', { cache: 'no-store' });
        return r.ok ? BLWPCLIENT.dailyLobbySearch(await r.json()) : null;
      } catch { return null; }
    }
    async function showTheLobbyIfOneWasNamed() {
      if (typeof BLWPCLIENT === 'undefined' || !BLWPCLIENT.lobbyQuery) return false;
      let search = location.search;
      let named = BLWPCLIENT.lobbyQuery(search);
      if (!named) {
        const daily = await dailySearch();
        if (daily) { search = daily; named = BLWPCLIENT.lobbyQuery(search); }
      }
      if (!named) return false;
      window.BLWP_LOBBY_FROM = search === location.search ? 'link' : 'daily.json';
      // WHO THIS TAB IS (M3.3-34): the identity key the page generated from the
      // tab's seed, the name made from it, and the player's own name over it.
      // Unity draws it (SplashScreen, DailyLobby.cs); it is decided here. The
      // name decides nothing.
      const tabRandom = (n) => crypto.getRandomValues(new Uint8Array(n));
      let me = null;
      const who = () => {
        try { me = BLWPCLIENT.tabIdentity({ storage: window.sessionStorage, random: tabRandom, curve: window.BLWP_CURVE }); }
        catch (e) { me = null; window.BLWP_IDENTITY = { error: e.message }; return; }
        window.BLWP_IDENTITY = { name: me.name, generated: me.generated, custom: me.custom, pubkey: me.pubkeyHex, fingerprint: me.fingerprint };
      };
      who();
      let refused = [];
      const leftOf = (line) => { const m = String(line).match(/closes in (\d+):(\d\d)/); return m ? Number(m[1]) * 60 + Number(m[2]) : -1; };
      const seatedOf = (line) => { const m = String(line).match(/(\d+) seated/); return m ? Number(m[1]) : 0; };
      const paint = async () => {
        let got;
        // 2 OF 2 (M3.3-34): each seat's listing is its own BIP-340 signature,
        // checked with the curve the daemons sign under; Join is offered only
        // when the round's threshold of its own seats say open and seated.
        try {
          got = await BLWPCLIENT.fetchLobby({ nodes: named.nodes,
            verify: (s, m, k) => !!(window.BLWP_CURVE && window.BLWP_CURVE.verify && window.BLWP_CURVE.verify(s, m, k)) });
        } catch (e) { got = { rows: [], refused: [e.message] }; }
        const now = Date.now();
        window.BLWP_LOBBY = got.rows.map((r) => ({ id: r.id, phase: r.phase, free: r.free, wallet: r.wallet,
          seatsAgree: r.seatsAgree, needed: r.needed, joinable: r.joinable,
          line: BLWPCLIENT.lobbyLine(r, now), join: r.joinable ? BLWPCLIENT.lobbyJoinSearch(search, r.id) : null }));
        refused = got.refused || [];
      };
      // THE LOBBY, AS UNITY DRAWS IT (Daniel 2026-09-12 22:11-22:16): the title
      // screen is the lobby - no HTML over the game. What it shows is this, and
      // what it presses comes back here.
      window.BLWP_LOBBY_VIEW = () => ({ mode: 'lobby', from: window.BLWP_LOBBY_FROM,
        you: me ? { name: me.name, custom: !!me.custom, generated: me.generated || '', fingerprint: me.fingerprint || '' }
          : { name: 'no identity', custom: false, generated: '', fingerprint: '' },
        rows: (window.BLWP_LOBBY || []).map((r) => ({ id: r.id, line: r.line, free: !!r.free, agree: r.seatsAgree | 0,
          needed: r.needed | 0, joinable: !!r.join, leftS: leftOf(r.line), seated: seatedOf(r.line) })),
        refused: refused.map(String), nodes: named.nodes.length,
        join: window.BLWP_JOIN ? { state: window.BLWP_JOIN.state, why: String(window.BLWP_JOIN.why || ''), stage: String(window.BLWP_JOIN.stage || '') }
          : { state: '', why: '', stage: '' } });
      window.BLWP_LOBBY_ACT = {
        // PLAY: the round's own link, so the seat is taken by exactly the path a
        // shared round link takes - IN THIS PAGE (Daniel 2026-09-13 07:11: "after
        // PLAY the loading screen must not come again. PLAY starts the round").
        // It used to navigate to the link: the page reloaded, Unity loaded a
        // second time, and the player sat through the loading screen again. Now
        // the address becomes the round's link (with `play=1`, so a reload still
        // starts the round), the seat is taken by the same code a round link
        // runs, and Unity starts the round when BLWP_JOIN says joined.
        join(id) {
          const r = (window.BLWP_LOBBY || []).find((x) => x.id === id && x.join);
          if (!r) return false;
          if (window.BLWP_JOIN && window.BLWP_JOIN.state === 'joining') return true;
          const back = location.search;
          history.replaceState(null, '', location.pathname + r.join + '&play=1');
          window.BLWP_SEAT_REFUSED = null;
          const join = window.BLWP_JOIN = { state: 'joining', why: '', stage: '' };
          const refuse = (why) => {
            join.state = 'refused';
            join.why = String(why);
            // not seated: the lobby's address back, and no round left named for Unity to open
            window.BLWP_ROUND = undefined;
            window.BLWP_ENTRY = undefined;
            history.replaceState(null, '', location.pathname + back);
          };
          joinTheRoundIfOneWasNamed()
            .then(() => {
              if (window.BLWP_ENTRY) join.state = 'joined';
              else refuse(window.BLWP_SEAT_REFUSED || 'this page took no seat in that round');
            })
            .catch((e) => refuse(e && e.message ? e.message : e));
          return true;
        },
        // THE NAME, in the browser's own prompt: a phone's keyboard types into it.
        editName() {
          const typed = window.prompt('Your name in the lobby - leave it empty for the name made from your key',
            me && me.custom ? me.name : '');
          if (typed === null) return '';
          const r = BLWPCLIENT.setPlayerName(typed, { storage: window.sessionStorage });
          who();
          return r.ok ? '' : r.why;
        },
        // THE PRIVATE KEY BACKUP, shown where it can be selected and copied.
        keyBackup() {
          window.prompt('Private key backup - this tab\'s seed. Copy it and keep it; it stays in this tab.',
            BLWPCLIENT.toHex(BLWPCLIENT.tabSeed({ storage: window.sessionStorage, random: tabRandom })));
        },
      };
      await paint();
      setInterval(paint, 5000);
      return true;
    }

    // UNITY LOADS IN THE LOBBY TOO: the lobby is its title screen. A lobby that
    // cannot be read leaves the offline game, never a dead page.
    showTheLobbyIfOneWasNamed()
      .catch((e) => { console.error('[blwp] that lobby cannot be read: ' + e.message); return false; })
      .then((lobby) => (lobby ? null : joinTheRoundIfOneWasNamed()))
      .then(() => document.body.appendChild(script))
      .catch((e) => { fail('That round link cannot be used: ' + e.message); showNotedDonation(); });
  </script>
</body>
</html>
