<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Testnet4 Wallet</title>
<style>:root{--bg:#0f1218;--text:#e6e9ef;--dim:#8b93a3}@media (prefers-color-scheme: light){:root{--bg:#f5f6f8;--text:#1b2230;--dim:#5d6676}}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;padding:24px 16px}a{color:#4fa3ff}.dim{color:var(--dim)}</style>
</head><body>
<p id="say">Opening the testnet4 wallet…</p>
<p class="dim" id="how"></p>
<script>
// THE WALLET'S ONE STABLE ADDRESS (btc-phase0, 2026-10-03): /wallet runs on the Beelink behind two routes - Tailscale Funnel
// and a Cloudflare quick tunnel whose name changes when it restarts. The keeper publishes the tunnel's current name in
// daily.json (testnet.alt); this page goes there, and to the Funnel address when no tunnel is named.
const FUNNEL = 'https://beelink.tail1723e2.ts.net/wallet/';
(async () => {
  let to = FUNNEL;
  try {
    const d = await (await fetch('../daily.json', { cache: 'no-store' })).json();
    const host = d && d.testnet && d.testnet.alt && d.testnet.alt['beelink.tail1723e2.ts.net/wallet'];
    if (host && /^[a-z0-9-]+\.trycloudflare\.com$/.test(host)) to = 'https://' + host + '/wallet/';
  } catch (e) { /* the Funnel address */ }
  document.getElementById('how').innerHTML = 'If nothing happens: <a href="' + to + '">' + to + '</a>';
  location.replace(to);
})();
</script>
</body></html>
