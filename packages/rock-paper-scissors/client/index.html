<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rock Paper Scissors</title>
<!-- ROCK PAPER SCISSORS' OWN CLIENT (kanban #233): one file, its SHA-256 in the game's manifest clients[]. The Bitcoin Arena page
     loads it only from bytes that hash to that, in a frame of its own origin, and hands it the engine as
     window.parent.ARENA_GAME: the lobby's rows of this game, the player's identity, and a head-to-head round's three acts -
     hide(round, move), reveal(round), reveals(round). The stake, the lock, the entry and the hidden move's salt are the
     engine's; this file holds no key, no wallet and no seed. What beats what is this game's (plugin/decide.js), shown here.
     SEEN, NOT READ (kanban #279, Daniel 2026-10-09: "No text wall. More graphical"; "the page refreshes constantly"): the
     round is a picture - the steps, the two seats, a face-down card, a countdown ring, the reveal - drawn once per change of
     state; each second only the countdown moves. -->
<style>
  :root { color-scheme: dark; --bg: #0b0e13; --panel: #141922; --panel2: #1a2130; --line: #2a3242; --dim: #8b95a5; --btc: #f7931a;
    --win: #2fd38a; --loss: #ff5d5d; --draw: #9aa7ff; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px 16px 28px; background: radial-gradient(120% 80% at 50% 0%, #182131 0%, var(--bg) 60%); color: #e6edf3;
    font: 15px/1.4 system-ui, -apple-system, sans-serif; min-height: 100vh; }
  button.back { font: 600 13px system-ui; background: transparent; color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0 14px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
  h1 .icons { margin-left: 6px; font-size: 20px; }
  .chip { font: 700 11px/1 system-ui; letter-spacing: 0.06em; padding: 6px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .chip.free { color: var(--win); border-color: #1f5a43; background: #0f2a20; }
  .chip.paid { color: var(--btc); border-color: #6b4310; background: #2a1c0a; }
  .card { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  /* THE STEPS: where the round is, at a glance */
  .steps { display: flex; justify-content: space-between; margin: 0 4px 16px; position: relative; }
  .steps::before { content: ''; position: absolute; left: 16px; right: 16px; top: 15px; height: 2px; background: var(--line); }
  .step { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 64px; font-size: 11px; color: var(--dim); }
  .step b { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: 2px solid var(--line); font-size: 15px; }
  .step.done b { border-color: var(--win); color: var(--win); }
  .step.now b { border-color: var(--btc); color: var(--btc); box-shadow: 0 0 0 4px rgba(247,147,26,0.15); }
  .step.now { color: #e6edf3; }
  /* THE TABLE: the two seats and the clock between them */
  .table { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .seat { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .seat .who { font-size: 12px; color: var(--dim); }
  .slot { width: 96px; height: 128px; border-radius: 14px; display: grid; place-items: center; font-size: 54px; border: 2px dashed var(--line); background: rgba(255,255,255,0.02); }
  .slot.facedown { border: 2px solid #6b4310; background: repeating-linear-gradient(45deg, #2a1c0a 0 10px, #33230e 10px 20px); font-size: 34px; }
  .slot.in { border: 2px solid #1f5a43; background: repeating-linear-gradient(45deg, #0f2a20 0 10px, #133325 10px 20px); font-size: 34px; }
  .slot.empty { animation: pulse 1.6s ease-in-out infinite; color: var(--dim); font-size: 40px; }
  .slot.shown { border: 2px solid var(--line); background: var(--bg); animation: flip 0.45s ease-out; }
  .slot.win { border-color: var(--win); box-shadow: 0 0 24px rgba(47,211,138,0.35); }
  .slot.loss { border-color: var(--loss); opacity: 0.8; }
  @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  @keyframes flip { from { transform: rotateY(90deg); } to { transform: rotateY(0); } }
  .clock { position: relative; width: 84px; height: 84px; }
  .clock svg { width: 84px; height: 84px; transform: rotate(-90deg); }
  .clock .t { position: absolute; inset: 0; display: grid; place-items: center; font: 700 17px/1 ui-monospace, monospace; }
  .vs { font: 800 14px/1 system-ui; color: var(--dim); text-align: center; }
  /* THE MOVES */
  .pick { margin-top: 16px; text-align: center; color: var(--dim); font-size: 13px; }
  .pick.due { color: var(--btc); font-size: 15px; font-weight: 600; }
  .moves { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .moves button { font: 700 14px/1.2 system-ui; padding: 14px 6px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: #e6edf3; cursor: pointer; transition: transform 0.08s, border-color 0.15s; }
  .moves button span { display: block; font-size: 42px; margin-bottom: 6px; }
  .moves button:hover { border-color: var(--btc); } .moves button:active { transform: scale(0.96); }
  .moves button:disabled { opacity: 0.4; }
  .moves button.chosen, .moves button.chosen:disabled { opacity: 1; border-color: var(--btc); box-shadow: 0 0 0 3px rgba(247,147,26,0.25); }
  .verdict { margin-top: 16px; text-align: center; font: 800 26px/1.2 system-ui; }
  .verdict.win { color: var(--win); } .verdict.loss { color: var(--loss); } .verdict.draw { color: var(--draw); }
  .foot { margin-top: 12px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .none { text-align: center; color: var(--dim); padding: 28px 8px; }
  .none .big { font-size: 44px; display: block; margin-bottom: 8px; animation: pulse 1.6s ease-in-out infinite; }
  .last { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 12px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; color: var(--dim); }
  .last b { font-size: 26px; font-weight: 400; } .last i { font-style: normal; font-size: 11px; } .last em { font: 800 13px system-ui; text-transform: uppercase; letter-spacing: 0.05em; font-style: normal; }
  .last.win em { color: var(--win); } .last.loss em { color: var(--loss); } .last.draw em { color: var(--draw); }
  .presence { display: flex; align-items: center; gap: 14px; margin: 0 0 12px; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line); }
  .presence .icon { font-size: 34px; } .presence b { display: block; font-size: 19px; } .presence small { display: block; color: var(--dim); font-size: 14px; margin-top: 2px; }
  .presence.alone { border-color: #6b4310; background: #2a1c0a; } .presence.alone b { color: var(--btc); }
  .presence.here { border-color: #1f5a43; background: #0f2a20; } .presence.here b { color: var(--win); }
  .presence .dots i { font-style: normal; animation: pulse 1.2s infinite; } .presence .dots i:nth-child(2) { animation-delay: .2s; } .presence .dots i:nth-child(3) { animation-delay: .4s; }
  .board { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 0 12px; padding: 10px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
  .board b { font: 800 38px/1 ui-monospace, monospace; } .board i { font-style: normal; font: 800 30px/1 system-ui; color: var(--dim); } .board .who { color: var(--dim); font-size: 13px; max-width: 30%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* THE STAGE (kanban #284): a Three.js scene - two hands, lit, on a floor of light - in place of the two cards */
  .stage { position: relative; height: min(52vh, 440px); min-height: 280px; margin: 0 -8px; border-radius: 14px; overflow: hidden;
    background: radial-gradient(90% 70% at 50% 35%, #1d2a44 0%, #0f1524 55%, #090c14 100%); }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .stage .ov { position: absolute; inset: 0; pointer-events: none; }
  .stage .ov .top { position: absolute; top: 10px; left: 0; right: 0; display: flex; justify-content: center; }
  .stage .ov .clock .t { text-shadow: 0 2px 8px #000; }
  .stage .ov .who { position: absolute; bottom: 10px; font: 700 12px/1 system-ui; letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 10px;
    border-radius: 999px; background: rgba(9,12,20,0.6); border: 1px solid var(--line); max-width: 44%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stage .ov .who.me { left: 12px; color: #ffc27a; } .stage .ov .who.them { right: 12px; color: #9cc4ff; }
  /* THE VERDICT, BIG (kanban #283, Daniel 2026-10-09: "Like the big WASTED in the truck game ... WON, large, stays 2 seconds, then
     fades. LOST, the same"): over everything, never in the way of a tap */
  .verdict-big { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; pointer-events: none;
    background: radial-gradient(60% 40% at 50% 50%, rgba(0,0,0,0.55), rgba(0,0,0,0) 70%); animation: vb 2.7s ease-out forwards; }
  .verdict-big b { font: 900 clamp(64px, 24vw, 200px)/1 system-ui, -apple-system, sans-serif; letter-spacing: 0.06em; transform-origin: center;
    animation: vbIn 0.35s cubic-bezier(.2,1.6,.4,1) both; -webkit-text-stroke: 2px rgba(0,0,0,0.35); }
  .verdict-big.win b { color: #2fd38a; text-shadow: 0 0 28px rgba(47,211,138,0.85), 0 6px 0 #0b5a3a; }
  .verdict-big.loss b { color: #ff4d4d; text-shadow: 0 0 28px rgba(255,77,77,0.8), 0 6px 0 #6a1010; }
  .verdict-big.draw b { color: #9aa7ff; text-shadow: 0 0 24px rgba(154,167,255,0.75), 0 6px 0 #2b3170; }
  body.lost-gray #view { filter: grayscale(0.85) brightness(0.8); transition: filter 0.3s; }
  #view { transition: filter 0.6s; }
  @keyframes vb { 0% { opacity: 0; } 8% { opacity: 1; } 78% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes vbIn { from { transform: scale(1.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
  <button class="back" type="button" id="back">&larr; Games</button>
  <header><h1>Rock Paper Scissors<span class="icons">✊✋✌️</span></h1><span class="chip" id="kind" hidden></span></header>
  <div id="view"></div>
<script>
  // THE STAGE (kanban #284, Daniel 2026-10-09: "Change the Rock Paper Scissors game to a Three.js version. More dynamic ... The
  // choice of rock, paper, or scissors is animated. You see the hand in that position. The result is animated too. Scissors
  // cut the flat paper hand. The paper hand covers the fist."). Two hands built from the shapes Three.js has - a bevelled
  // palm, jointed fingers and thumb - posed by their joints; this client only shows. Three.js itself is fetched from one
  // pinned build and run only if its bytes hash to THREE_SHA256, so the client still runs no code its manifest hash does
  // not pin. Without WebGL or Three.js the client draws the cards it drew before.
  const THREE_URL = 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';
  const THREE_SHA256 = '3e690ac7d180b0aadf0891bea39eec643e29e2d3e75c99b18689518665f69ba6';
  async function loadStage() {
    const probe = document.createElement('canvas');
    if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) throw new Error('no WebGL');
    const bytes = await (await fetch(THREE_URL, { cache: 'force-cache' })).arrayBuffer();
    const hex = [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))].map((x) => x.toString(16).padStart(2, '0')).join('');
    if (hex !== THREE_SHA256) throw new Error('three.js at ' + THREE_URL + ' is not the pinned build (' + hex.slice(0, 16) + ')');
    const THREE = await import(URL.createObjectURL(new Blob([bytes], { type: 'text/javascript' })));
    return createStage(THREE);
  }

  function createStage(THREE) {
    const box = document.createElement('div'); box.className = 'stage';
    const canvas = document.createElement('canvas'); box.append(canvas);
    const ov = document.createElement('div'); ov.className = 'ov'; box.append(ov);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    renderer.localClippingEnabled = true;
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0b101c, 9, 18);
    const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 60);

    // REFLECTIONS: a small room of light panels, prefiltered once - the clear coat of the hands catches them
    const pmrem = new THREE.PMREMGenerator(renderer);
    const room = new THREE.Scene();
    room.add(new THREE.Mesh(new THREE.SphereGeometry(20, 24, 12), new THREE.MeshBasicMaterial({ color: 0x0a0f1c, side: THREE.BackSide })));
    const panel = (color, pos, w, h) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide })); m.position.set(...pos); m.lookAt(0, 0, 0); room.add(m); };
    panel(0xffffff, [0, 8, 6], 10, 4); panel(0xff9a3c, [-9, 2, -2], 4, 8); panel(0x4aa3ff, [9, 2, -2], 4, 8); panel(0x8899bb, [0, -6, 8], 12, 2);
    scene.environment = pmrem.fromScene(room, 0.03).texture;

    scene.add(new THREE.HemisphereLight(0x9cbcff, 0x20120a, 0.55));
    const key = new THREE.DirectionalLight(0xffffff, 1.7); key.position.set(2.5, 6, 7); scene.add(key);
    const rimL = new THREE.PointLight(0xff8a1c, 26, 12, 2); rimL.position.set(-3.2, 1.6, -2.4); scene.add(rimL);
    const rimR = new THREE.PointLight(0x3c8cff, 26, 12, 2); rimR.position.set(3.2, 1.6, -2.4); scene.add(rimR);

    // THE FLOOR: dark glass with a ring of light under each hand, and a line of light between them
    const FLOOR_Y = -1.25;
    const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 64), new THREE.MeshStandardMaterial({ color: 0x0c1220, roughness: 0.5, metalness: 0.5, envMapIntensity: 0.35 }));
    floor.rotation.x = -Math.PI / 2; floor.position.y = FLOOR_Y; scene.add(floor);
    const ringOf = (color, x) => {
      const m = new THREE.Mesh(new THREE.RingGeometry(0.95, 1.07, 72), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false }));
      m.rotation.x = -Math.PI / 2; m.position.set(x, FLOOR_Y + 0.01, 0); scene.add(m); return m;
    };
    const ringMe = ringOf(0xff9a2e, -1.55), ringThem = ringOf(0x4c9dff, 1.55);
    const line = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.03), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending, depthWrite: false }));
    line.rotation.x = -Math.PI / 2; line.position.y = FLOOR_Y + 0.012; scene.add(line);

    // SPARKS AND DUST: one soft dot, drawn once
    const dot = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
      const r = g.createRadialGradient(32, 32, 0, 32, 32, 32); r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(0.35, 'rgba(255,255,255,0.45)'); r.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = r; g.fillRect(0, 0, 64, 64); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; })();
    const DUST = 160;
    const dustGeo = new THREE.BufferGeometry();
    const dustPos = new Float32Array(DUST * 3), dustSpeed = new Float32Array(DUST);
    for (let i = 0; i < DUST; i++) { dustPos[i * 3] = (Math.random() - 0.5) * 12; dustPos[i * 3 + 1] = FLOOR_Y + Math.random() * 6; dustPos[i * 3 + 2] = -5 + Math.random() * 6; dustSpeed[i] = 0.08 + Math.random() * 0.25; }
    dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
    const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ size: 0.07, map: dot, color: 0xffc58a, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false }));
    scene.add(dust);

    // A HAND: a bevelled palm, four fingers of three joints and a thumb of two, a sleeve with a band of light. Fingers point
    // along +x, the back of the hand faces the camera (+z), a finger curls away from it (rotation.y > 0).
    const FINGERS = [{ y: 0.32, len: [0.36, 0.24, 0.2], r: 0.118 }, { y: 0.105, len: [0.4, 0.27, 0.21], r: 0.125 },
      { y: -0.11, len: [0.37, 0.25, 0.2], r: 0.118 }, { y: -0.315, len: [0.29, 0.2, 0.17], r: 0.104 }];
    const POSES = {
      idle: { f: [[0.3, 0.35, 0.2, 0.07], [0.3, 0.35, 0.2, 0], [0.35, 0.4, 0.25, -0.06], [0.4, 0.45, 0.3, -0.12]], t: [0.7, 0.25, 0.2] },
      rock: { f: [[1.5, 1.75, 1.25, 0], [1.5, 1.75, 1.25, 0], [1.5, 1.75, 1.25, 0], [1.45, 1.75, 1.25, 0]], t: [-0.25, 0.85, 0.55] },
      paper: { f: [[0, 0.04, 0.02, 0.1], [0, 0.03, 0.02, 0.02], [0, 0.04, 0.02, -0.06], [0.02, 0.05, 0.03, -0.15]], t: [0.95, 0.05, 0.05] },
      scissors: { f: [[0, 0.03, 0.02, 0.26], [0, 0.03, 0.02, -0.22], [1.5, 1.75, 1.25, 0], [1.45, 1.75, 1.25, 0]], t: [-0.15, 0.85, 0.6] },
    };
    const NAMES = ['rock', 'paper', 'scissors'];
    // THE SHAPES, SMOOTH (#285, Daniel 2026-10-09: "far more polygons for the hands, they look ugly. Must look like a stylised
    // hand"): a sculpted palm - an ellipsoid of 96 x 64, tapered to the wrist, domed on the back, broad at the knuckles - fingers
    // of round capsules that taper to the tip, knuckle bumps, nails, a padded thumb base, a skin wrist into a rolled sleeve
    const palmGeo = (() => {
      const g = new THREE.SphereGeometry(0.5, 96, 64), p = g.attributes.position, v = new THREE.Vector3();
      for (let i = 0; i < p.count; i++) {
        v.fromBufferAttribute(p, i);
        const u = (v.x + 0.5);                                   // 0 at the wrist, 1 at the knuckles
        const width = 0.74 + 0.3 * Math.sin(Math.min(1, u * 1.15) * Math.PI / 2);
        v.x *= 0.96; v.y *= width * 1.02;
        v.z *= v.z > 0 ? 0.5 : 0.36;                             // a domed back, a flatter palm side
        v.z += 0.04 * Math.cos(v.y * 3.1) * (v.z > 0 ? 1 : 0);   // the back rises a little between the edges
        p.setXYZ(i, v.x, v.y, v.z);
      }
      g.computeVertexNormals(); return g;
    })();
    const segGeo = new Map();
    const capsule = (r, l) => { const k = r.toFixed(3) + ':' + l.toFixed(3); if (!segGeo.has(k)) { const g = new THREE.CapsuleGeometry(r, Math.max(0.01, l - r * 0.6), 16, 40); g.rotateZ(-Math.PI / 2); g.translate(l / 2, 0, 0); segGeo.set(k, g); } return segGeo.get(k); };
    const ball = new THREE.SphereGeometry(1, 48, 32);
    const nailGeo = (() => { const g = new THREE.SphereGeometry(1, 40, 24); g.scale(0.55, 0.42, 0.14); return g; })();
    const wristGeo = new THREE.CylinderGeometry(0.27, 0.3, 0.7, 64, 1, true);
    const sleeveGeo = new THREE.CylinderGeometry(0.38, 0.4, 1.4, 64, 1, false);
    const rimGeo = new THREE.TorusGeometry(0.39, 0.06, 24, 96);
    const bandGeo = new THREE.TorusGeometry(0.405, 0.022, 12, 96);
    function makeHand(skin, sheen, band, side, glow) {
      const mat = new THREE.MeshPhysicalMaterial({ color: skin, emissive: glow, roughness: 0.42, metalness: 0, clearcoat: 0.6, clearcoatRoughness: 0.3, sheen: 0.8, sheenColor: sheen, sheenRoughness: 0.5, envMapIntensity: 1.0 });
      const nailMat = new THREE.MeshPhysicalMaterial({ color: new THREE.Color(skin).lerp(new THREE.Color(0xffffff), 0.45), roughness: 0.18, clearcoat: 1, clearcoatRoughness: 0.05 });
      const sleeveMat = new THREE.MeshStandardMaterial({ color: 0x161c2a, roughness: 0.55, metalness: 0.35 });
      const bandMat = new THREE.MeshBasicMaterial({ color: band });
      const root = new THREE.Group(), body = new THREE.Group(), hand = new THREE.Group();
      root.add(body); body.add(hand);
      hand.add(new THREE.Mesh(palmGeo, mat));
      // the wrist, then the sleeve with its rolled rim and a band of light
      const wrist = new THREE.Mesh(wristGeo, mat); wrist.rotation.z = Math.PI / 2; wrist.scale.set(1, 1, 0.7); wrist.position.x = -0.62; hand.add(wrist);
      const sleeve = new THREE.Mesh(sleeveGeo, sleeveMat); sleeve.rotation.z = Math.PI / 2; sleeve.scale.set(1, 1, 0.8); sleeve.position.x = -1.55; hand.add(sleeve);
      const rim = new THREE.Mesh(rimGeo, sleeveMat); rim.rotation.y = Math.PI / 2; rim.scale.set(1, 0.8, 1); rim.position.x = -0.86; hand.add(rim);
      const cuff = new THREE.Mesh(bandGeo, bandMat); cuff.rotation.y = Math.PI / 2; cuff.scale.set(1, 0.8, 1); cuff.position.x = -1.0; hand.add(cuff);
      const fingers = FINGERS.map((spec) => {
        const base = new THREE.Group(); base.position.set(0.38, spec.y * 0.98, 0.01); hand.add(base);
        // the knuckle: a bump on the back where the finger leaves the palm
        const knuckle = new THREE.Mesh(ball, mat); knuckle.scale.set(spec.r * 1.15, spec.r * 1.08, spec.r * 1.0); knuckle.position.set(0.0, 0, 0.03); base.add(knuckle);
        const joints = []; let parent = base, at = 0;
        spec.len.forEach((l, k) => {
          const r = spec.r * [1, 0.92, 0.85][k];
          const j = new THREE.Group(); j.position.x = at; parent.add(j);
          const seg = new THREE.Mesh(capsule(r, l), mat); seg.scale.z = 0.92; j.add(seg);

    // tab says it is here to the table's seats every 2 s (ARENA_GAME.here) and keeps who else is - the banner reads that, not
    // the moves already in
    // A new round's table is empty for the second or two before the other tab says it moved on with this one: who was
    // seen within HERE_CARRY_MS still counts, so the banner does not blink "alone" at every round's turn
    const HERE_CARRY_MS = 4000;
    let here = { id: null, names: [], at: 0, seenAt: 0, busy: false };
    const lookHere = (id) => {
      if (!A.here || !id || here.busy || (here.id === id && Date.now() - here.at < 2000)) return;
      here.busy = true;
      A.here(id).then((x) => {
        const now = Date.now();
        if (x && x.others.length) here = { id, names: x.others, at: now, seenAt: now, busy: false };
        else here = { ...here, id, names: here.id !== id && now - here.seenAt < HERE_CARRY_MS ? here.names : [], at: now, busy: false };
      }).catch(() => { here.busy = false; });
    };
    const hereAt = (id) => (here.id === id || Date.now() - here.at < HERE_CARRY_MS ? here.names : []);
    // WHAT THE TABLE LOOKS LIKE NOW, as a key: the view is redrawn only when it changes (never a full rebuild each second)
    // a move carried into the next round when nobody answered it (below): { move, since, toId, closeMs, at }
    const CARRY_MS = 120000, CARRY_RETRY_MS = 8000;
    let carry = null;
    let due = null;             // the reveal view's "result in" line, ticked every second: { el, closeMs, endMs }
    let stage = null;           // the Three.js stage (kanban #284), null until it is loaded or if it cannot be
    let pickedFor = null;       // the round the stage's pick preview belongs to
    // THE BIG VERDICT (kanban #283): once per decided round of this tab, when the seats' signed result arrives - on the stage's
    // strike if a show is running - WON / LOST / DRAW, 2 s, then it fades; a loss greys the page under it, as WASTED does
    let bannerFor = null;
    const bigVerdict = (verdict) => {
      const kind = verdict === 'win' ? 'win' : verdict === 'loss' || verdict === 'forfeit' ? 'loss' : 'draw';
      const word = { win: 'WON', loss: 'LOST', draw: verdict === 'void' ? 'NOT PLAYED' : 'DRAW' }[kind];
      const b = el('div', 'verdict-big ' + kind, '<b>' + word + '</b>');
      document.body.append(b);
      if (kind === 'loss') document.body.classList.add('lost-gray');
      setTimeout(() => document.body.classList.remove('lost-gray'), 2300);
      setTimeout(() => b.remove(), 2800);
      window.RPS_VERDICT_SHOWN = { word, at: Date.now() };
    };
    let kept = null;            // the match score of this tab's newest decided round (below)
    const paint = async () => {
      // every listed round of this game (the page's allRows), so the soonest to close is the one offered
      const rows = A.allRows ? A.allRows() : A.rows();
      const players = (A.headToHead && A.headToHead.players) || 2;
      const mine = A.hiddenAll().filter((h) => Date.now() < Number(h.entryCloseMs) + 120000);
      const h = mine.length ? mine[mine.length - 1] : null;
      // THE LAST ROUND THIS TAB PLAYED, as the seats hold it
      let last = null;
      if (h) {
        const held = await A.result(h.roundIdHex);
        const entries = held ? held.entries : [];
        const closeMs = Number(h.entryCloseMs);
        const row = rows.find((r) => r.id === h.roundIdHex);
        last = { id: h.roundIdHex, move: h.move, closeMs, endMs: h.endMs ? Number(h.endMs) : null, free: row ? !!row.free : true, them: Math.max(0, entries.length - 1) };
        if (Date.now() < closeMs) last.phase = 'wait';
        else if (entries.length && entries.length < players) last.phase = 'alone';
        else {
          if (!revealing.has(h.roundIdHex)) { revealing.add(h.roundIdHex); A.reveal(h.roundIdHex).then((x) => { if (!x.ok) revealing.delete(h.roundIdHex); }); }
          const all = await A.reveals(h.roundIdHex);
          const theirs = Object.entries(all).filter(([e]) => e !== h.entryIdHex).map(([, m]) => m);
          const me = entries.find((e) => e.entry === h.entryIdHex);
          last.theirs = theirs.length ? theirs[0] : null;
          last.verdict = me && me.outcome && me.signedBy > 0
            ? (me.outcome === 'DELIVERED' && me.score >= 2 ? 'win' : me.outcome === 'DELIVERED' ? 'draw' : me.outcome === 'VOID' ? 'void' : me.outcome === 'FORFEIT' ? 'forfeit' : 'loss') : null;
          last.phase = last.verdict ? 'result' : 'reveal';
          if (last.verdict && bannerFor !== h.roundIdHex && Date.now() - closeMs < 60000) {
            bannerFor = h.roundIdHex;
            const v = last.verdict;
            // the stage's show may start in this same paint: let it, then wait for its strike
            setTimeout(() => setTimeout(() => bigVerdict(v), stage ? stage.strikeIn() * 1000 : 0), 50);
          }
        }
        // THE SCORE ACROSS ROUNDS (kanban #280): the seats' signed match record - which identity is this tab's, its score first
        const m = held && held.match;
        if (m && m.byEntry && m.byEntry[h.entryIdHex]) {
          const mine = m.identities.indexOf(m.byEntry[h.entryIdHex]);
          if (mine >= 0) last.score = { me: m.score[mine], them: m.score[1 - mine], themName: (m.names || [])[1 - mine] || 'them', themKey: m.identities[1 - mine], played: m.played };
        }
      }
      // WHILE A ROUND OF THIS TAB IS STILL BEING PLAYED (picked, waiting, revealing), that round is the table; once it is
      // decided (or not played), the next open round is, with the last result beside it
      let state;
      // THE MATCH GOES ON while this tab played within the last minute and its last round was played: its score stays up
      // kept from the newest decided round: while the next is picked and waited for, its own record is not there yet, and the
      // board - and whose name the banner gives - must not drop out between moves
      if (last && last.score && (!kept || last.closeMs >= kept.closeMs)) kept = { ...last.score, closeMs: last.closeMs };
      const scoreboard = kept && kept.played && Date.now() - kept.closeMs <= MATCH_CONTINUE_MS ? kept : null;
      if (last && (last.phase === 'wait' || last.phase === 'reveal')) { lookHere(last.id); state = { ...last, openMs: last.closeMs - WINDOW_MS, scoreboard, here: hereAt(last.id) }; }
      else {
        const row = openRound(rows);
        const prev = last ? { id: last.id, closeMs: last.closeMs, phase: last.phase, move: last.move, theirs: last.theirs ?? null, verdict: last.verdict || null, score: last.score || null } : null;
        if (row) lookHere(row.id);
        // A MOVE NOBODY ANSWERED STAYS IN (Daniel 2026-10-09 playtest: "pick, the Wait screen comes, then back to Pick -
        // sometimes it works and the selection is really locked"): a round that closed with this tab alone in it was not
        // played, and the move goes into the next open round by itself - still hidden, so whoever comes cannot see it - until
        // an opponent plays it or CARRY_MS have passed since it was picked
        if (last && last.phase === 'alone' && row && row.id !== last.id && (!carry || (carry.toId !== row.id && Date.now() - carry.at > CARRY_RETRY_MS))) {
          const since = carry && carry.toId === last.id ? carry.since : last.closeMs - WINDOW_MS;
          if (Date.now() - since < CARRY_MS) { carry = { move: last.move, since, toId: row.id, closeMs: row.entryCloseMs, at: Date.now() }; A.hide(row.id, last.move); }
        }
        if (carry && carry.toId === (row && row.id) && Date.now() - carry.at < CARRY_RETRY_MS && !(h && h.roundIdHex === carry.toId))
          state = { phase: 'wait', id: carry.toId, move: carry.move, closeMs: carry.closeMs, openMs: carry.closeMs - WINDOW_MS, them: 0, carried: true, scoreboard, here: hereAt(carry.toId) };
        else state = row ? { phase: 'pick', id: row.id, closeMs: row.entryCloseMs, openMs: row.entryCloseMs - WINDOW_MS, free: !!row.free, joined: joinedOf(row.line) > 0, prev, scoreboard, here: hereAt(row.id) }
          : { phase: 'none', prev, scoreboard };
      }
      const key = JSON.stringify(state);
      if (key !== drawnKey) { drawnKey = key; draw(state); }
      if (live) tickClock(live.clock, live.closeMs, live.openMs);
      tickDue();
    };
    const tickDue = () => {
      if (!due) return;
      const now = Date.now(), waited = Math.max(0, Math.floor((now - due.closeMs) / 1000));
      const left = due.endMs ? Math.ceil((due.endMs - now) / 1000) : null;
      due.el.textContent = 'Result: waiting ' + waited + ' s' + (left === null ? '' : left > 0 ? ' · at most ' + left + ' s more' : ' · past its ' + Math.round((due.endMs - due.closeMs) / 1000) + ' s timeout, the seats are signing');
    };
    const draw = (s) => {
      const view = $('view');
      view.textContent = '';
      live = null;
      due = null;
      const kind = $('kind');
      kind.hidden = s.phase === 'none';
      kind.className = 'chip ' + (s.free ? 'free' : 'paid');
      kind.textContent = s.free ? 'FREE' : 'PAID';
      // THE LAST RESULT, as a strip above the next table: your move, theirs, and how it went
      if (s.prev && (s.prev.phase === 'result' || s.prev.phase === 'alone')) {
        const p = s.prev;
        const words = p.phase === 'alone' ? ['draw', 'not played'] : ({ win: ['win', 'won'], loss: ['loss', 'lost'], forfeit: ['loss', 'lost'], draw: ['draw', 'draw'], void: ['draw', 'not played'] }[p.verdict] || ['draw', '']);
        view.append(el('div', 'last ' + words[0], '<span>last round</span><b>' + MOVES[p.move][1] + '</b><i>vs</i><b>' + (p.theirs === null || p.theirs === undefined ? '∅' : MOVES[p.theirs][1]) + '</b><em>' + words[1] + '</em>'));
      }
      // THE SCORE ACROSS ROUNDS, big, while the match goes on (kanban #280)
      if (s.scoreboard) view.append(el('div', 'board', '<span class="who">You</span><b>' + s.scoreboard.me + '</b><i>:</i><b>' + s.scoreboard.them + '</b><span class="who">'
        + String(s.scoreboard.themName).replace(/[<>&]/g, '') + '</span>'));
      if (s.phase === 'none') {
        if (stage) { const c = el('div', 'card'); stage.show(s); stage.ov.textContent = ''; c.append(stage.box, el('div', 'pick', 'The next round opens in a moment.')); view.append(c); return; }
        view.append(el('div', 'card none', '<span class="big">⏳</span>The next round opens in a moment.')); return;
      }
      // WHO IS HERE, prominently (kanban #280: "Always show prominently when you are alone in the round. Then also Waiting for
      // other Players. When someone else is there, show that")
      if (s.phase === 'pick' || s.phase === 'wait') {
        const moved = s.phase === 'pick' ? s.joined : s.them > 0;     // the other move is in
        const names = s.here || [];
        // who they are: the name the table's seats give their key - the match's own name (the seats sign it) when it is the
        // same player the match goes on with
        const sb = s.scoreboard;
        const seen = names.find((o) => sb && o.key === sb.themKey) || names[0] || null;
        const them = seen ? (sb && seen.key === sb.themKey ? sb.themName : seen.name) : null;
        const clean = (t) => String(t).replace(/[<>&]/g, '');
        const what = s.phase === 'pick' ? (moved ? 'their move is in - pick yours' : 'pick your move')
          : (moved ? 'both moves are in - hidden until the round closes' : 'waiting for their move');
        view.append(names.length || moved
          ? el('div', 'presence here', '<span class="icon">⚔️</span><div><b>' + (them ? 'You are playing against ' + clean(them) : 'Opponent is here') + '</b><small>' + what + '</small></div>')
          : el('div', 'presence alone', '<span class="icon">🙋</span><div><b>You are alone in this round</b><small>Waiting for other players<span class="dots"><i>.</i><i>.</i><i>.</i></span></small></div>'));
      }
      const card = el('div', 'card');
      const at = { pick: 0, wait: 1, alone: 3, reveal: 2, result: 3 }[s.phase];
      card.append(steps(at));
      // ON THE STAGE: the hands play the round; the clock and who is who sit over it
      if (stage) {
        if (s.phase !== 'pick' || pickedFor !== s.id) { stage.preview(null); pickedFor = s.id; }
        stage.show(s);
        card.append(stage.box);
        const ov = stage.ov; ov.textContent = '';
        if (s.phase === 'pick' || s.phase === 'wait') { const top = el('div', 'top'); const c = clock(); top.append(c); ov.append(top); live = { clock: c, closeMs: s.closeMs, openMs: s.openMs }; }
        const sb = s.scoreboard, names = s.here || [];
        const seen = names.find((o) => sb && o.key === sb.themKey) || names[0] || null;
        const themName = seen ? (sb && seen.key === sb.themKey ? sb.themName : seen.name) : (sb ? sb.themName : null);
        ov.append(el('div', 'who me', 'You' + (s.phase === 'wait' || s.phase === 'reveal' ? ' · ' + MOVES[s.move][0] : '')));
        const w = el('div', 'who them'); w.textContent = themName || (s.phase === 'pick' && !s.joined && !names.length ? 'waiting…' : 'opponent'); ov.append(w);
      }
      const table = el('div', 'table');
      const middle = el('div');
      if (stage) { /* the clock is on the stage */ } else if (s.phase === 'pick' || s.phase === 'wait') {
        const c = clock(); middle.append(c);
        live = { clock: c, closeMs: s.closeMs, openMs: s.openMs };
      } else middle.append(el('div', 'vs', 'VS'));
      const put = (...xs) => { if (!stage) card.append(...xs); };
      if (s.phase === 'pick') {
        table.append(seat('you', 'empty', '?'), middle, seat(s.joined ? 'opponent in' : 'opponent', s.joined ? 'in' : 'empty', s.joined ? '✓' : '?'));
        put(table);
        card.append(el('div', 'pick', 'Pick - your opponent cannot see it until the round closes'));
        const g = el('div', 'moves');
        MOVES.forEach(([name, icon], i) => {
          const b = el('button', '', '<span>' + icon + '</span>' + name); b.type = 'button';
          b.addEventListener('click', () => { for (const x of g.querySelectorAll('button')) x.disabled = true; b.classList.add('chosen'); if (stage) stage.preview(i); A.hide(s.id, i); });
          if (stage) { b.addEventListener('pointerenter', () => { if (!b.disabled) stage.preview(i); }); b.addEventListener('pointerleave', () => { if (!b.disabled) stage.preview(null); }); }
          g.append(b);
        });
        card.append(g);
      } else if (s.phase === 'wait') {
        table.append(seat('you · ' + MOVES[s.move][0], 'shown', MOVES[s.move][1]), middle,
          seat(s.them ? 'opponent in' : 'waiting…', s.them ? 'in' : 'empty', s.them ? '🔒' : '?'));
        put(table);
      } else if (s.phase === 'alone') {
        table.append(seat('you · ' + MOVES[s.move][0], 'shown', MOVES[s.move][1]), middle, seat('nobody came', 'empty', '∅'));
        put(table); card.append(el('div', 'verdict draw', 'Not played · stake back'));
      } else {
        const win = s.verdict === 'win', loss = s.verdict === 'loss' || s.verdict === 'forfeit';
        table.append(seat('you', 'shown' + (win ? ' win' : loss ? ' loss' : ''), MOVES[s.move][1]), middle,
          seat('them', s.theirs === null ? 'empty' : 'shown' + (loss ? ' win' : win ? ' loss' : ''), s.theirs === null ? '…' : MOVES[s.theirs][1]));
        put(table);
        // THE RESULT NOT THERE YET (Daniel 2026-10-09: "if the result takes time, show how long it takes, in seconds, with a
        // timeout"): seconds since the moves closed, and the most it can still take - the round's reveal deadline, by which the
        // seats decide whoever revealed
        if (!s.verdict) { const w = el('div', 'pick due'); card.append(w); due = { el: w, closeMs: s.closeMs, endMs: s.endMs }; }
        if (s.verdict) {
          const words = { win: ['win', 'You win 🏆'], loss: ['loss', 'You lose'], forfeit: ['loss', 'Not revealed · you lose'], draw: ['draw', 'Draw · stakes back'], void: ['draw', 'Not played · stake back'] }[s.verdict];
          card.append(el('div', 'verdict ' + words[0], words[1]));
          if (s.score) card.append(el('div', 'pick', 'score ' + s.score.me + ' : ' + s.score.them + (s.score.played ? '' : ' · match over')));
        }
      }
      view.append(card);
    };
    // THE STAGE, once Three.js is in (kanban #284); until then, and without it, the cards
    loadStage().then((st) => { stage = window.RPS_STAGE = st; drawnKey = null; paint(); }).catch((e) => console.warn('[rps] no 3D stage: ' + e.message));
    paint();
    setInterval(paint, 1000);
  }
</script>
</body>
</html>
