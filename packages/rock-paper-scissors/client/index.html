<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rock Paper Scissors</title>
<!-- ROCK PAPER SCISSORS' OWN CLIENT (kanban #233): one file, its SHA-256 in the game's manifest clients[]. The Bitcoin Arena page
     loads it only from bytes that hash to that, in a frame of its own origin, and hands it the engine as
     window.parent.ARENA_GAME: the lobby's rows of this game, the player's identity, and a head-to-head round's three acts -
     hide(round, move), reveal(round), reveals(round). The stake, the lock, the entry and the hidden move's salt are the
     engine's; this file holds no key, no wallet and no seed. What beats what is this game's (plugin/decide.js), shown here.
     SEEN, NOT READ (kanban #279, Daniel 2026-10-09: "No text wall. More graphical"; "the page refreshes constantly"): the
     round is a picture - the steps, the two seats, a face-down card, a countdown ring, the reveal - drawn once per change of
     state; each second only the countdown moves. -->
<style>
  :root { color-scheme: dark; --bg: #0b0e13; --panel: #141922; --panel2: #1a2130; --line: #2a3242; --dim: #8b95a5; --btc: #f7931a;
    --win: #2fd38a; --loss: #ff5d5d; --draw: #9aa7ff; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 14px 16px 28px; background: radial-gradient(120% 80% at 50% 0%, #182131 0%, var(--bg) 60%); color: #e6edf3;
    font: 15px/1.4 system-ui, -apple-system, sans-serif; min-height: 100vh; }
  button.back { font: 600 13px system-ui; background: transparent; color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0 14px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
  h1 .icons { margin-left: 6px; font-size: 20px; }
  .chip { font: 700 11px/1 system-ui; letter-spacing: 0.06em; padding: 6px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .chip.free { color: var(--win); border-color: #1f5a43; background: #0f2a20; }
  .chip.paid { color: var(--btc); border-color: #6b4310; background: #2a1c0a; }
  .card { background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  /* THE STEPS: where the round is, at a glance */
  .steps { display: flex; justify-content: space-between; margin: 0 4px 16px; position: relative; }
  .steps::before { content: ''; position: absolute; left: 16px; right: 16px; top: 15px; height: 2px; background: var(--line); }
  .step { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 64px; font-size: 11px; color: var(--dim); }
  .step b { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--bg); border: 2px solid var(--line); font-size: 15px; }
  .step.done b { border-color: var(--win); color: var(--win); }
  .step.now b { border-color: var(--btc); color: var(--btc); box-shadow: 0 0 0 4px rgba(247,147,26,0.15); }
  .step.now { color: #e6edf3; }
  /* THE TABLE: the two seats and the clock between them */
  .table { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .seat { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .seat .who { font-size: 12px; color: var(--dim); }
  .slot { width: 96px; height: 128px; border-radius: 14px; display: grid; place-items: center; font-size: 54px; border: 2px dashed var(--line); background: rgba(255,255,255,0.02); }
  .slot.facedown { border: 2px solid #6b4310; background: repeating-linear-gradient(45deg, #2a1c0a 0 10px, #33230e 10px 20px); font-size: 34px; }
  .slot.in { border: 2px solid #1f5a43; background: repeating-linear-gradient(45deg, #0f2a20 0 10px, #133325 10px 20px); font-size: 34px; }
  .slot.empty { animation: pulse 1.6s ease-in-out infinite; color: var(--dim); font-size: 40px; }
  .slot.shown { border: 2px solid var(--line); background: var(--bg); animation: flip 0.45s ease-out; }
  .slot.win { border-color: var(--win); box-shadow: 0 0 24px rgba(47,211,138,0.35); }
  .slot.loss { border-color: var(--loss); opacity: 0.8; }
  @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
  @keyframes flip { from { transform: rotateY(90deg); } to { transform: rotateY(0); } }
  .clock { position: relative; width: 84px; height: 84px; }
  .clock svg { width: 84px; height: 84px; transform: rotate(-90deg); }
  .clock .t { position: absolute; inset: 0; display: grid; place-items: center; font: 700 17px/1 ui-monospace, monospace; }
  .vs { font: 800 14px/1 system-ui; color: var(--dim); text-align: center; }
  /* THE MOVES */
  .pick { margin-top: 16px; text-align: center; color: var(--dim); font-size: 13px; }
  .moves { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
  .moves button { font: 700 14px/1.2 system-ui; padding: 14px 6px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: #e6edf3; cursor: pointer; transition: transform 0.08s, border-color 0.15s; }
  .moves button span { display: block; font-size: 42px; margin-bottom: 6px; }
  .moves button:hover { border-color: var(--btc); } .moves button:active { transform: scale(0.96); }
  .moves button:disabled { opacity: 0.4; }
  .verdict { margin-top: 16px; text-align: center; font: 800 26px/1.2 system-ui; }
  .verdict.win { color: var(--win); } .verdict.loss { color: var(--loss); } .verdict.draw { color: var(--draw); }
  .foot { margin-top: 12px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .none { text-align: center; color: var(--dim); padding: 28px 8px; }
  .none .big { font-size: 44px; display: block; margin-bottom: 8px; animation: pulse 1.6s ease-in-out infinite; }
  .last { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 12px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 13px; color: var(--dim); }
  .last b { font-size: 26px; font-weight: 400; } .last i { font-style: normal; font-size: 11px; } .last em { font: 800 13px system-ui; text-transform: uppercase; letter-spacing: 0.05em; font-style: normal; }
  .last.win em { color: var(--win); } .last.loss em { color: var(--loss); } .last.draw em { color: var(--draw); }
  .presence { display: flex; align-items: center; gap: 14px; margin: 0 0 12px; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--line); }
  .presence .icon { font-size: 34px; } .presence b { display: block; font-size: 19px; } .presence small { display: block; color: var(--dim); font-size: 14px; margin-top: 2px; }
  .presence.alone { border-color: #6b4310; background: #2a1c0a; } .presence.alone b { color: var(--btc); }
  .presence.here { border-color: #1f5a43; background: #0f2a20; } .presence.here b { color: var(--win); }
  .presence .dots i { font-style: normal; animation: pulse 1.2s infinite; } .presence .dots i:nth-child(2) { animation-delay: .2s; } .presence .dots i:nth-child(3) { animation-delay: .4s; }
  .board { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 0 12px; padding: 10px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
  .board b { font: 800 38px/1 ui-monospace, monospace; } .board i { font-style: normal; font: 800 30px/1 system-ui; color: var(--dim); } .board .who { color: var(--dim); font-size: 13px; max-width: 30%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
  <button class="back" type="button" id="back">&larr; Games</button>
  <header><h1>Rock Paper Scissors<span class="icons">✊✋✌️</span></h1><span class="chip" id="kind" hidden></span></header>
  <div id="view"></div>
<script>
  const A = window.parent && window.parent.ARENA_GAME;
  const $ = (id) => document.getElementById(id);
  const MOVES = [['Rock', '✊'], ['Paper', '✋'], ['Scissors', '✌️']];
  const R = 36, C = 2 * Math.PI * R;
  const revealing = new Set();
  const mmss = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
  // THE STEPS: 0 pick, 1 wait for entry close, 2 reveal, 3 result
  const steps = (at) => {
    const s = el('div', 'steps');
    [['✋', 'Pick'], ['⏳', 'Wait'], ['👁', 'Reveal'], ['🏁', 'Result']].forEach(([icon, name], i) => {
      const x = el('div', 'step' + (i < at ? ' done' : i === at ? ' now' : ''), '<b>' + (i < at ? '✓' : icon) + '</b>' + name);
      s.append(x);
    });
    return s;
  };
  // THE CLOCK: a ring that empties towards entry close; only its arc and digits move each second
  const clock = () => {
    const c = el('div', 'clock', '<svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="' + R + '" fill="none" stroke="#2a3242" stroke-width="6"/>'
      + '<circle class="arc" cx="42" cy="42" r="' + R + '" fill="none" stroke="#f7931a" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + C + '"/></svg><div class="t"></div>');
    return c;
  };
  const tickClock = (c, closeMs, openMs) => {
    if (!c) return;
    const left = Math.max(0, closeMs - Date.now());
    const span = Math.max(1, closeMs - openMs);
    c.querySelector('.t').textContent = mmss(left);
    c.querySelector('.arc').setAttribute('stroke-dashoffset', String(C * (1 - Math.min(1, left / span))));
  };
  const seat = (who, cls, face) => { const s = el('div', 'seat'); s.append(el('div', 'slot ' + cls, face), el('div', 'who', who)); return s; };

  if (!A || !A.headToHead) {
    $('view').append(el('div', 'none', '<span class="big">✊✋✌️</span>This client runs inside the Bitcoin Arena page, which hands it the game.'));
  } else {
    window.RPS_CLIENT = { hash: A.clientHash, game: A.game.id };
    $('back').addEventListener('click', () => A.back());
    let drawnKey = null;
    let live = null;            // what the countdown needs between redraws: { clock, closeMs, openMs }
    const WINDOW_MS = 10000;    // a round takes picks for 10 s (kanban #280, Daniel 2026-10-09 17:04: "Set rounds to 10 seconds")
    const MATCH_CONTINUE_MS = 60000;   // a match goes on while both keep playing (arena-protocol match.js)
    const joinedOf = (line) => { const m = String(line || '').match(/(\d+) joined/); return m ? Number(m[1]) : 0; };
    // THE ROUND TO PLAY: the open one that closes soonest with a few seconds left - every player's page offers the same one
    const openRound = (rows) => rows.filter((r) => r.joinable && !A.hidden(r.id) && r.entryCloseMs && r.entryCloseMs - Date.now() > 2500)
      .sort((x, y) => x.entryCloseMs - y.entryCloseMs)[0] || null;
    // WHO SITS AT THE TABLE (kanban #280, Daniel 2026-10-09 playtest: two tabs at one table both read "You are alone"): this
    // tab says it is here to the table's seats every 2 s (ARENA_GAME.here) and keeps who else is - the banner reads that, not
    // the moves already in
    // A new round's table is empty for the second or two before the other tab says it moved on with this one: who was
    // seen within HERE_CARRY_MS still counts, so the banner does not blink "alone" at every round's turn
    const HERE_CARRY_MS = 4000;
    let here = { id: null, names: [], at: 0, seenAt: 0, busy: false };
    const lookHere = (id) => {
      if (!A.here || !id || here.busy || (here.id === id && Date.now() - here.at < 2000)) return;
      here.busy = true;
      A.here(id).then((x) => {
        const now = Date.now();
        if (x && x.others.length) here = { id, names: x.others, at: now, seenAt: now, busy: false };
        else here = { ...here, id, names: here.id !== id && now - here.seenAt < HERE_CARRY_MS ? here.names : [], at: now, busy: false };
      }).catch(() => { here.busy = false; });
    };
    const hereAt = (id) => (here.id === id || Date.now() - here.at < HERE_CARRY_MS ? here.names : []);
    // WHAT THE TABLE LOOKS LIKE NOW, as a key: the view is redrawn only when it changes (never a full rebuild each second)
    let kept = null;            // the match score of this tab's newest decided round (below)
    const paint = async () => {
      // every listed round of this game (the page's allRows), so the soonest to close is the one offered
      const rows = A.allRows ? A.allRows() : A.rows();
      const players = (A.headToHead && A.headToHead.players) || 2;
      const mine = A.hiddenAll().filter((h) => Date.now() < Number(h.entryCloseMs) + 120000);
      const h = mine.length ? mine[mine.length - 1] : null;
      // THE LAST ROUND THIS TAB PLAYED, as the seats hold it
      let last = null;
      if (h) {
        const held = await A.result(h.roundIdHex);
        const entries = held ? held.entries : [];
        const closeMs = Number(h.entryCloseMs);
        const row = rows.find((r) => r.id === h.roundIdHex);
        last = { id: h.roundIdHex, move: h.move, closeMs, free: row ? !!row.free : true, them: Math.max(0, entries.length - 1) };
        if (Date.now() < closeMs) last.phase = 'wait';
        else if (entries.length && entries.length < players) last.phase = 'alone';
        else {
          if (!revealing.has(h.roundIdHex)) { revealing.add(h.roundIdHex); A.reveal(h.roundIdHex).then((x) => { if (!x.ok) revealing.delete(h.roundIdHex); }); }
          const all = await A.reveals(h.roundIdHex);
          const theirs = Object.entries(all).filter(([e]) => e !== h.entryIdHex).map(([, m]) => m);
          const me = entries.find((e) => e.entry === h.entryIdHex);
          last.theirs = theirs.length ? theirs[0] : null;
          last.verdict = me && me.outcome && me.signedBy > 0
            ? (me.outcome === 'DELIVERED' && me.score >= 2 ? 'win' : me.outcome === 'DELIVERED' ? 'draw' : me.outcome === 'VOID' ? 'void' : me.outcome === 'FORFEIT' ? 'forfeit' : 'loss') : null;
          last.phase = last.verdict ? 'result' : 'reveal';
        }
        // THE SCORE ACROSS ROUNDS (kanban #280): the seats' signed match record - which identity is this tab's, its score first
        const m = held && held.match;
        if (m && m.byEntry && m.byEntry[h.entryIdHex]) {
          const mine = m.identities.indexOf(m.byEntry[h.entryIdHex]);
          if (mine >= 0) last.score = { me: m.score[mine], them: m.score[1 - mine], themName: (m.names || [])[1 - mine] || 'them', themKey: m.identities[1 - mine], played: m.played };
        }
      }
      // WHILE A ROUND OF THIS TAB IS STILL BEING PLAYED (picked, waiting, revealing), that round is the table; once it is
      // decided (or not played), the next open round is, with the last result beside it
      let state;
      // THE MATCH GOES ON while this tab played within the last minute and its last round was played: its score stays up
      // kept from the newest decided round: while the next is picked and waited for, its own record is not there yet, and the
      // board - and whose name the banner gives - must not drop out between moves
      if (last && last.score && (!kept || last.closeMs >= kept.closeMs)) kept = { ...last.score, closeMs: last.closeMs };
      const scoreboard = kept && kept.played && Date.now() - kept.closeMs <= MATCH_CONTINUE_MS ? kept : null;
      if (last && (last.phase === 'wait' || last.phase === 'reveal')) { lookHere(last.id); state = { ...last, openMs: last.closeMs - WINDOW_MS, scoreboard, here: hereAt(last.id) }; }
      else {
        const row = openRound(rows);
        const prev = last ? { phase: last.phase, move: last.move, theirs: last.theirs ?? null, verdict: last.verdict || null, score: last.score || null } : null;
        if (row) lookHere(row.id);
        state = row ? { phase: 'pick', id: row.id, closeMs: row.entryCloseMs, openMs: row.entryCloseMs - WINDOW_MS, free: !!row.free, joined: joinedOf(row.line) > 0, prev, scoreboard, here: hereAt(row.id) }
          : { phase: 'none', prev, scoreboard };
      }
      const key = JSON.stringify(state);
      if (key !== drawnKey) { drawnKey = key; draw(state); }
      if (live) tickClock(live.clock, live.closeMs, live.openMs);
    };
    const draw = (s) => {
      const view = $('view');
      view.textContent = '';
      live = null;
      const kind = $('kind');
      kind.hidden = s.phase === 'none';
      kind.className = 'chip ' + (s.free ? 'free' : 'paid');
      kind.textContent = s.free ? 'FREE' : 'PAID';
      // THE LAST RESULT, as a strip above the next table: your move, theirs, and how it went
      if (s.prev && (s.prev.phase === 'result' || s.prev.phase === 'alone')) {
        const p = s.prev;
        const words = p.phase === 'alone' ? ['draw', 'not played'] : ({ win: ['win', 'won'], loss: ['loss', 'lost'], forfeit: ['loss', 'lost'], draw: ['draw', 'draw'], void: ['draw', 'not played'] }[p.verdict] || ['draw', '']);
        view.append(el('div', 'last ' + words[0], '<span>last round</span><b>' + MOVES[p.move][1] + '</b><i>vs</i><b>' + (p.theirs === null || p.theirs === undefined ? '∅' : MOVES[p.theirs][1]) + '</b><em>' + words[1] + '</em>'));
      }
      // THE SCORE ACROSS ROUNDS, big, while the match goes on (kanban #280)
      if (s.scoreboard) view.append(el('div', 'board', '<span class="who">You</span><b>' + s.scoreboard.me + '</b><i>:</i><b>' + s.scoreboard.them + '</b><span class="who">'
        + String(s.scoreboard.themName).replace(/[<>&]/g, '') + '</span>'));
      if (s.phase === 'none') { view.append(el('div', 'card none', '<span class="big">⏳</span>The next round opens in a moment.')); return; }
      // WHO IS HERE, prominently (kanban #280: "Always show prominently when you are alone in the round. Then also Waiting for
      // other Players. When someone else is there, show that")
      if (s.phase === 'pick' || s.phase === 'wait') {
        const moved = s.phase === 'pick' ? s.joined : s.them > 0;     // the other move is in
        const names = s.here || [];
        // who they are: the name the table's seats give their key - the match's own name (the seats sign it) when it is the
        // same player the match goes on with
        const sb = s.scoreboard;
        const seen = names.find((o) => sb && o.key === sb.themKey) || names[0] || null;
        const them = seen ? (sb && seen.key === sb.themKey ? sb.themName : seen.name) : null;
        const clean = (t) => String(t).replace(/[<>&]/g, '');
        const what = s.phase === 'pick' ? (moved ? 'their move is in - pick yours' : 'pick your move')
          : (moved ? 'both moves are in - hidden until the round closes' : 'waiting for their move');
        view.append(names.length || moved
          ? el('div', 'presence here', '<span class="icon">⚔️</span><div><b>' + (them ? 'You are playing against ' + clean(them) : 'Opponent is here') + '</b><small>' + what + '</small></div>')
          : el('div', 'presence alone', '<span class="icon">🙋</span><div><b>You are alone in this round</b><small>Waiting for other players<span class="dots"><i>.</i><i>.</i><i>.</i></span></small></div>'));
      }
      const card = el('div', 'card');
      const at = { pick: 0, wait: 1, alone: 3, reveal: 2, result: 3 }[s.phase];
      card.append(steps(at));
      const table = el('div', 'table');
      const middle = el('div');
      if (s.phase === 'pick' || s.phase === 'wait') {
        const c = clock(); middle.append(c);
        live = { clock: c, closeMs: s.closeMs, openMs: s.openMs };
      } else middle.append(el('div', 'vs', 'VS'));
      if (s.phase === 'pick') {
        table.append(seat('you', 'empty', '?'), middle, seat(s.joined ? 'opponent in' : 'opponent', s.joined ? 'in' : 'empty', s.joined ? '✓' : '?'));
        card.append(table);
        card.append(el('div', 'pick', 'Pick - your move stays hidden'));
        const g = el('div', 'moves');
        MOVES.forEach(([name, icon], i) => {
          const b = el('button', '', '<span>' + icon + '</span>' + name); b.type = 'button';
          b.addEventListener('click', () => { for (const x of g.querySelectorAll('button')) x.disabled = true; A.hide(s.id, i); });
          g.append(b);
        });
        card.append(g);
      } else if (s.phase === 'wait') {
        table.append(seat('you · ' + MOVES[s.move][0], 'facedown', '🔒'), middle,
          seat(s.them ? 'opponent in' : 'waiting…', s.them ? 'in' : 'empty', s.them ? '🔒' : '?'));
        card.append(table);
      } else if (s.phase === 'alone') {
        table.append(seat('you', 'facedown', '🔒'), middle, seat('nobody came', 'empty', '∅'));
        card.append(table, el('div', 'verdict draw', 'Not played · stake back'));
      } else {
        const win = s.verdict === 'win', loss = s.verdict === 'loss' || s.verdict === 'forfeit';
        table.append(seat('you', 'shown' + (win ? ' win' : loss ? ' loss' : ''), MOVES[s.move][1]), middle,
          seat('them', s.theirs === null ? 'empty' : 'shown' + (loss ? ' win' : win ? ' loss' : ''), s.theirs === null ? '…' : MOVES[s.theirs][1]));
        card.append(table);
        if (s.verdict) {
          const words = { win: ['win', 'You win 🏆'], loss: ['loss', 'You lose'], forfeit: ['loss', 'Not revealed · you lose'], draw: ['draw', 'Draw · stakes back'], void: ['draw', 'Not played · stake back'] }[s.verdict];
          card.append(el('div', 'verdict ' + words[0], words[1]));
          if (s.score) card.append(el('div', 'pick', 'score ' + s.score.me + ' : ' + s.score.them + (s.score.played ? '' : ' · match over')));
        }
      }
      view.append(card);
    };
    paint();
    setInterval(paint, 1000);
  }
</script>
</body>
</html>
