# THE LOCK CLIENT (W1a): the player's own client code for the stake lock,
# built to wasm on the stock fedimint 0.12.0 client crates (FEDERATION.md item
# 7: fedimint-client-wasm dispatches no LNv2). It joins a federation, takes a
# deposit through a gateway, locks Point(stake_point) to the attested claim_pk
# and reads the outpoint back. Redeem, forfeit, refund and withdraw are W5.
#
# Like tools/stake-lock, it builds only as a member of a fedimint v0.12.0 source
# tree, whose workspace pins every dependency:
#
#   ONE STOCK LINE PATCHED (W5a): fedimint-lnv2-send-expiry.patch, against the
#     v0.12.0 tree (patch -p1 < it, from the tree's root). LNv2 `send` checks
#     `invoice.is_expired()`, which reads std's clock and panics on
#     wasm32-unknown-unknown - measured, every withdraw from the page panicked;
#     the patch makes the same check against fedimint's own clock. The rest of
#     `send` is stock.
#   ONE MINT LINE (2026-10-01, "1 sat = 1 sat"): fedimint-mintv2-whole-msat.patch - the mint client issues and
#     spends notes from 1 msat (client_denominations 0..41; the federation signs 0..41 already), so a deposit credits
#     what was paid and a lock costs its amount. Stock starts at 512 msat and rounded every payment to it.
#   build-wasm.sh does all of it on the fork (v0.12.1 + testnet4), as the user, under /mnt/bitcoin/lockclient-build.
#   ln -s <this directory> <fedimint-0.12.0>/blwp-lock-client
#   add "blwp-lock-client" to <fedimint-0.12.0>/Cargo.toml [workspace] members
#   cargo build --release --target wasm32-unknown-unknown -p blwp-lock-client
#     (secp256k1-sys compiles C: CC_wasm32_unknown_unknown=<llvm>/bin/clang,
#      AR_wasm32_unknown_unknown=<llvm>/bin/llvm-ar)
#   wasm-bindgen --target web (0.2.106, the lockfile's) on the .wasm: the page
#     loads it as a module; Node loads the same output from its bytes
[package]
name = "blwp-lock-client"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
fedimint-api-client = { workspace = true }
fedimint-client = { workspace = true }
fedimint-connectors = { workspace = true }
fedimint-core = { workspace = true }
fedimint-derive-secret = { workspace = true }
fedimint-lnv2-client = { workspace = true }
fedimint-lnv2-common = { workspace = true }
fedimint-mintv2-client = { workspace = true }
futures = { workspace = true }
imbl = { workspace = true }
lightning-invoice = { workspace = true }
macro_rules_attribute = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
