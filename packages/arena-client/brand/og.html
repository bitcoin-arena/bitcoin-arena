<!doctype html><html><head><meta charset="utf-8"><style>
/* THE BITCOIN ARENA LINK PREVIEW (2026-10-14 ~09:25Z: a shared testnet.bitcoin-arena.io link named Tick Tock, Next Block),
   1200 x 630, rendered to arena-og.png by headless Chrome: the home site's mark (the B on the orange tile) and the games it hosts */
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:radial-gradient(circle at 50% 30%,#1b2430 0%,#07090d 72%);font-family:'DejaVu Sans',sans-serif}
.top{position:absolute;left:0;right:0;top:120px;display:flex;justify-content:center;align-items:center;gap:34px}
.mark{width:150px;height:150px;border-radius:38px;background:conic-gradient(from 210deg,#f7931a,#ffd166,#f7931a);display:grid;place-items:center;color:#07090d;font:700 104px 'DejaVu Sans',sans-serif}
.name{color:#fff;font:800 112px/1 'DejaVu Sans',sans-serif;letter-spacing:-3px}
.name b{color:#f7931a}
.tag{position:absolute;left:0;right:0;top:325px;text-align:center;color:#c9d1d9;font:600 38px 'DejaVu Sans',sans-serif}
.games{position:absolute;left:0;right:0;top:420px;display:flex;justify-content:center;gap:56px}
.games div{display:flex;align-items:center;gap:16px;color:#8b949e;font:600 28px 'DejaVu Sans',sans-serif}
.games img{width:72px;height:72px;border-radius:16px;background:#11161d}
</style></head><body>
<div class="top"><div class="mark">₿</div><div class="name">Bitcoin <b>Arena</b></div></div>
<div class="tag">Play for sats. Settle on Bitcoin.</div>
<div class="games"><div><img src="nextblock-icon.svg">Tick Tock</div><div><img src="rps-icon.svg">Rock Paper Scissors</div><div><img src="updown-icon.svg">Up or Down</div></div>
</body></html>
