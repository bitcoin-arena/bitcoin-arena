# THE STAKE LOCK, BUILT BY THE PLAYER'S OWN CLIENT (FEDERATION.md, rehearsal
# step 1). A member of a fedimint v0.12.0 source tree: tools/stake-lock-step1.sh
# links it in as `blwp-stake-lock` and builds it there, against the stock
# client crates. It is client code only - fedimintd is the released,
# unpatched build.
[package]
name = "blwp-stake-lock"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = { workspace = true }
fedimint-api-client = { workspace = true }
fedimint-bip39 = { workspace = true }
fedimint-client = { workspace = true }
fedimint-connectors = { workspace = true }
fedimint-core = { workspace = true }
fedimint-ln-client = { workspace = true }
fedimint-lnv2-client = { workspace = true }
fedimint-lnv2-common = { workspace = true }
fedimint-meta-client = { workspace = true }
fedimint-mint-client = { workspace = true }
fedimint-mintv2-client = { workspace = true }
fedimint-rocksdb = { workspace = true }
fedimint-wallet-client = { workspace = true }
fedimint-walletv2-client = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
