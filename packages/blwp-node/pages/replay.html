<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLWP game replay</title>
<style>
  :root { --bg: #0b0f14; --panel: #12181f; --ink: #e8e8e8; --dim: #8a96a3; --bull: #4caf50; --bear: #e05252; --truck: #ffd54f; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  #bar { display: flex; gap: 10px; align-items: center; padding: 8px 12px; flex-wrap: wrap; }
  #bar button { font: inherit; padding: 6px 14px; background: #1e2833; color: var(--ink); border: 1px solid #33414f; border-radius: 4px; cursor: pointer; }
  #scrub { flex: 1; min-width: 160px; }
  #at, #status { color: var(--dim); font-variant-numeric: tabular-nums; }
  #status { padding: 0 12px 8px; }
  /* the map keeps its shape and leaves room under it for the HUD band, on a phone and on a desk */
  canvas { display: block; width: auto; height: auto; max-width: 100%; max-height: 58vh; margin: 0 auto; background: var(--panel); }
  #legend { padding: 6px 12px; color: var(--dim); font-size: 12px; }
  #legend b { font-weight: 600; }
  /* THE TICK'S OWN NUMBERS, under the map on every tick (Daniel 2026-09-26 07:12), drawn the way the game's HUD draws
     them (11:04): a CONDITION bar, a DANGER meter and the SCORE as the large number, then the numeric line and the working */
  #readout { padding: 10px 12px 14px; font-variant-numeric: tabular-nums; line-height: 1.5; overflow-wrap: anywhere; }
  #meters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
  .meter .label { font-weight: 700; letter-spacing: 0.04em; font-size: 15px; }
  .meter .bar { height: 16px; background: #1b232c; border: 1px solid #33414f; border-radius: 3px; overflow: hidden; }
  .meter .bar i { display: block; height: 100%; width: 0; }
  #hp-label { color: #7ec8ff; } #hp-bar { background: #4ade80; }
  #danger-label { color: #ff8a65; } #danger-bar { background: #e8a33d; }
  #score-big { margin: 8px 0 4px; font-weight: 800; color: #ffd24d; font-size: clamp(30px, 9vw, 56px); line-height: 1.1; }
  #score-big small { font-size: 0.45em; letter-spacing: 0.06em; margin-right: 0.4em; }
  #work { color: var(--dim); }
  /* THE RESULT FIRST, THE DETAILS BELOW (Daniel 2026-09-26 14:14): a glance says whether the round succeeded; the round,
     the entry, the host, the ticks, the score's working and the core follow as a list - whole, wrapped, never cut */
  #result { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  #result .word { font-weight: 800; font-size: clamp(26px, 8vw, 44px); letter-spacing: 0.03em; }
  #result .word.ok { color: #4ade80; } #result .word.fail { color: #ff6b6b; } #result .word.live { color: var(--dim); }
  #result .then { color: var(--dim); font-size: 15px; }
  #details { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 14px 0 0; font-size: 13px; }
  #details dt { color: var(--dim); } #details dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  @media (max-width: 600px) {       /* the phone's band under the map: meters full width, larger */
    #meters { grid-template-columns: 1fr; gap: 10px; }
    .meter .label { font-size: 18px; } .meter .bar { height: 22px; }
    #readout { font-size: 16px; padding-top: 14px; }
  }
</style>
</head>
<body>
<div id="bar">
  <button id="play" disabled>play</button>
  <input id="scrub" type="range" min="0" max="0" value="0" step="1" disabled>
  <span id="at">tick 0</span>
</div>
<div id="status">loading the run…</div>
<canvas id="map" width="1480" height="680"></canvas>
<div id="readout">
  <div id="result"></div>
  <div id="meters">
    <div class="meter"><div class="label" id="hp-label">HEALTH</div><div class="bar"><i id="hp-bar"></i></div></div>
    <div class="meter"><div class="label" id="danger-label">DANGER</div><div class="bar"><i id="danger-bar"></i></div></div>
  </div>
  <div id="score-big"><small>SCORE</small><span id="score-num">0.00000</span></div>
  <div id="line1">&nbsp;</div><div id="work">&nbsp;</div>
  <dl id="details"></dl>
</div>
<div id="legend"><b style="color:var(--truck)">▲</b> your truck · <b style="color:var(--bull)">■</b>/<b style="color:var(--bear)">■</b> tanks ·
  <b style="color:var(--bull)">•</b>/<b style="color:var(--bear)">•</b> infantry · ◆ helicopters · <b style="color:#ff8a65">●</b> bombs</div>
<!-- THE PROTOCOL'S OWN DECODERS AND SEED (the client bundle), from this node - RELATIVE, so a node published under a
     path (https://host/blwp-a/replay) loads its own and not the root's. -->
<script src="replay/client.js"></script>
<script>
// A GAME REPLAY (Daniel 2026-09-25 18:39). Everything is fetched from a node that holds the run - this one, or the
// round's other committee endpoints when it has no transcript - and the run is replayed by stepping the core the round
// names (/replay/core.js, served only for that round's own core). The page draws what that core stepped; it simulates
// nothing of its own. Not a live socket: the whole run is stepped once, then played like a video.
(async function () {
  const q = new URLSearchParams(location.search);
  const round = (q.get('round') || '').toLowerCase(), entry = (q.get('entry') || '').toLowerCase();
  const say = (s) => { document.getElementById('status').textContent = s; };
  if (!/^[0-9a-f]{64}$/.test(round) || !/^[0-9a-f]{64}$/.test(entry)) { say('the link names no round and entry (?round=<hex>&entry=<hex>)'); return; }
  // THIS NODE is the origin AND the path it is published under: an advertised endpoint may carry one
  // (wss://host/blwp-a), and location.origin alone would ask the host's root, which is not this node.
  const here = location.origin + location.pathname.replace(/\/replay\/?$/, '');
  const tryJson = async (url) => { try { const r = await fetch(url); return r.ok ? await r.json() : null; } catch (e) { return null; } };
  const bytesOf = async (url) => { const r = await fetch(url); if (!r.ok) throw new Error(`${url}: ${r.status} ${await r.text()}`); return new Uint8Array(await r.arrayBuffer()); };

  // THE NODE THAT HOLDS THE RUN: this one first, then the round's committee endpoints.
  const others = ((await tryJson(`${here}/replay/nodes?round=${round}`)) || { endpoints: [] }).endpoints.filter((u) => u !== here);
  let base = null, transcript = null;
  for (const n of [here, ...others]) {
    say(`asking ${n} for the run…`);
    transcript = await tryJson(`${n}/replay/transcript?round=${round}&entry=${entry}`);
    if (transcript) { base = n; break; }
  }
  if (!transcript) { say(`no committee node holds that run (asked ${1 + others.length})`); return; }

  // THE ROUND, THE ENTRY AND THE BEACON FROM THAT NODE, AND ITS CORE.
  let contract, ent, beacon;
  try {
    contract = BLWPCLIENT.decodeRoundContract(await bytesOf(`${base}/round?id=${round}`));
    ent = BLWPCLIENT.decodeEntryContract(await bytesOf(`${base}/entry?id=${entry}`));
    beacon = await bytesOf(`${base}/randomness?round=${round}`);
  } catch (e) { say(`the run cannot be read: ${e.message}`); return; }
  await new Promise((ok, no) => { const s = document.createElement('script'); s.src = `${base}/replay/core.js?round=${round}`; s.onload = ok; s.onerror = () => no(new Error('the core that round names')); document.head.appendChild(s); })
    .catch((e) => { say(`${base} serves no ${e.message}`); throw e; });
  const R = window.BLWP_REPLAY, CORE = R.CORE, L = R.layout, ONE = R.ONE;

  // STEP THE WHOLE RUN ONCE, keeping what the map draws at every tick.
  const seedWord = BLWPCLIENT.seedWordForEntry(ent, beacon);
  const st = CORE.start(seedWord);
  // an older core a stored round names may keep no map solids of its own (its host set them): draw none then
  const solids = st.solids && st.solids.box ? { n: st.solids.n, box: Int32Array.from(st.solids.box.subarray(0, st.solids.n * 6)) } : { n: 0, box: new Int32Array(0) };
  const events = CORE.eventsOf(transcript);
  // the map's words, then the tick's own numbers: the truck's hp and the words scoreOf reads (exposure, elapsed ticks,
  // cargo), and the core's practice flag
  const MAP = 3 + L.UNITS * 5 + L.MAX_HELIS * 4 + L.MAX_BOMBS * 3, PER = MAP + 5;
  const frames = new Int32Array(PER * transcript.ticks.length);
  const take = (f) => {
    const s = st.i32; let o = f * PER;
    frames[o++] = s[L.O_TRUCK + L.T_X]; frames[o++] = s[L.O_TRUCK + L.T_Z]; frames[o++] = s[L.O_TRUCK + L.T_HEADING];
    for (let i = 0; i < L.UNITS; i++) {
      const b = L.O_UNITS + i * L.U_WORDS;
      frames[o++] = s[b + L.U_X]; frames[o++] = s[b + L.U_Z]; frames[o++] = s[b + L.U_SIDE];
      frames[o++] = s[b + L.U_STATE] !== 0 && s[b + L.U_HP] > 0 ? 1 : 0; frames[o++] = (i & L.ARMOUR_MASK) === 0 ? 1 : 0;
    }
    for (let i = 0; i < L.MAX_HELIS; i++) {
      const b = L.O_HELIS + i * L.H_WORDS;
      frames[o++] = s[b + L.H_X]; frames[o++] = s[b + L.H_Z]; frames[o++] = s[b + L.H_SIDE]; frames[o++] = s[b + L.H_STATE];
    }
    for (let i = 0; i < L.MAX_BOMBS; i++) {
      const b = L.O_BOMBS + i * L.B_WORDS;
      frames[o++] = s[b + L.B_X]; frames[o++] = s[b + L.B_Z]; frames[o++] = s[b + L.B_STATE];
    }
    frames[o++] = s[L.O_TRUCK + L.T_HP];
    frames[o++] = s[L.O_SCORE + L.S_EXPOSURE]; frames[o++] = s[L.O_SCORE + L.S_ELAPSED]; frames[o++] = s[L.O_SCORE + L.S_CARGO];
    frames[o++] = s[L.O_SCORE + L.S_PRACTICE];
  };
  transcript.ticks.forEach((t, f) => { events.before(st, t.tick); CORE.step(st, t.words); take(f); });
  const result = CORE.result(st);
  // THE SCORE IN POINTS, as the card prints it: the core keeps it in 1e-5 points (score.js SCORE_SCALE), 13715869 is 137.15869
  const points = (u) => (u / 100000).toLocaleString('en-US', { minimumFractionDigits: 5, maximumFractionDigits: 5 });
  const ended = `${result.outcome || 'LIVE'}${result.outcome ? `, score ${result.score}` : ''}`;
  const from = transcript.ticks.length ? transcript.ticks[0].tick : 0;

  // THE MAP, top down: x across, z up, in the core's own metres.
  const cv = document.getElementById('map'), g = cv.getContext('2d');
  const hx = R.HALF_X / ONE, hz = R.HALF_Z / ONE;
  const sx = (x) => ((x / ONE + hx) / (2 * hx)) * cv.width, sz = (z) => ((hz - z / ONE) / (2 * hz)) * cv.height;
  const side = (v) => (v < 0 ? '#4caf50' : '#e05252');
  // THE MAP'S OWN LANDMARKS (Daniel 2026-09-26 11:04, the phone replay: "the map is only dots", he could not tell where
  // the truck was). Drawn once from the core this page stepped - its solids as it built them at the start, and the map's
  // own constants - not a second scene: the post office's shell (teal, MEMPOOL), the miner's (magenta, MINER), and the
  // finish straight, the open corridor from the miner's door to the gate.
  const Mp = R.map || {};
  const hasMap = [Mp.POST_X, Mp.SHELL_HALF, Mp.MINER_X, Mp.MINER_DOOR_X, Mp.MINER_MOUTH_HALF, Mp.MINER_SHELL_HALF].every((v) => typeof v === 'number');
  const landmarks = document.createElement('canvas'); landmarks.width = cv.width; landmarks.height = cv.height;
  (function drawLandmarks() {
    const l = landmarks.getContext('2d');
    if (!hasMap) return;   // an older core names no landmarks: the units, the truck and the gate are drawn as before
    const rect = (x0, z0, x1, z1) => [sx(Math.min(x0, x1)), sz(Math.max(z0, z1)), Math.abs(sx(x1) - sx(x0)), Math.abs(sz(z1) - sz(z0))];
    // the buildings' ground, faint, so each end reads as a place
    l.fillStyle = 'rgba(26, 217, 255, 0.10)'; l.fillRect(...rect(-R.HALF_X, -Mp.SHELL_HALF, Mp.POST_X, Mp.SHELL_HALF));
    l.fillStyle = 'rgba(255, 64, 217, 0.10)'; l.fillRect(...rect(Mp.MINER_X - 2 * ONE, -Mp.MINER_SHELL_HALF, R.HALF_X, Mp.MINER_SHELL_HALF));
    // the finish straight: the corridor from the miner's door to the gate, the mouth's half-width either side
    l.fillStyle = 'rgba(111, 168, 220, 0.16)'; l.fillRect(...rect(Mp.MINER_DOOR_X, -Mp.MINER_MOUTH_HALF, R.GATE_X, Mp.MINER_MOUTH_HALF));
    // the core's own boxes, as it built them for this round (not the map edges, which run the whole world)
    for (let i = 0; i < solids.n; i++) {
      const cx = solids.box[i * 6], cz = solids.box[i * 6 + 1], hx = solids.box[i * 6 + 2], hz = solids.box[i * 6 + 3];
      if (hx > 150 * ONE || hz > 150 * ONE) continue;
      l.fillStyle = cx < 0 ? 'rgba(26, 217, 255, 0.55)' : 'rgba(255, 64, 217, 0.55)';
      l.fillRect(...rect(cx - hx, cz - hz, cx + hx, cz + hz));
    }
    const label = (text, x, y, size, colour, turn) => {
      l.font = `800 ${size}px system-ui, sans-serif`;
      if (!turn) { const half = l.measureText(text).width / 2 + 10; x = Math.max(half, Math.min(cv.width - half, x)); }   // never off the map
      l.save(); l.translate(x, y); if (turn) l.rotate(-Math.PI / 2);
      l.font = `800 ${size}px system-ui, sans-serif`; l.textAlign = 'center'; l.textBaseline = 'middle';
      l.lineWidth = size / 6; l.strokeStyle = 'rgba(11, 15, 20, 0.9)'; l.strokeText(text, 0, 0);
      l.fillStyle = colour; l.fillText(text, 0, 0); l.restore();
    };
    label('MEMPOOL', (sx(-R.HALF_X) + sx(Mp.POST_X)) / 2, sz(0), 50, '#5fe3ff', false);
    label('MINER', (sx(Mp.MINER_X) + sx(R.HALF_X)) / 2, sz(0), 52, '#ff7ae6', true);
    // inside the straight's own band, two lines, so it covers none of the miner's boxes
    const midX = (sx(Mp.MINER_DOOR_X) + sx(R.GATE_X)) / 2;
    label('FINISH', midX, sz(Math.round(Mp.MINER_MOUTH_HALF * 0.72)), 34, '#9fc5ea', false);
    label('STRAIGHT \u2192', midX, sz(Math.round(Mp.MINER_MOUTH_HALF * 0.72)) + 40, 34, '#9fc5ea', false);
  })();

  function draw(f) {
    let o = f * PER;
    g.clearRect(0, 0, cv.width, cv.height);
    g.drawImage(landmarks, 0, 0);
    if (R.GATE_X !== undefined) { g.setLineDash([8, 6]); g.strokeStyle = '#6fa8dc'; g.beginPath(); g.moveTo(sx(R.GATE_X), 0); g.lineTo(sx(R.GATE_X), cv.height); g.stroke(); g.setLineDash([]); }
    const tx = frames[o++], tz = frames[o++], th = frames[o++];
    for (let i = 0; i < L.UNITS; i++) {
      const x = frames[o++], z = frames[o++], sd = frames[o++], alive = frames[o++], armour = frames[o++];
      if (!alive) continue;
      g.fillStyle = side(sd);
      if (armour) g.fillRect(sx(x) - 5, sz(z) - 5, 10, 10);
      else { g.beginPath(); g.arc(sx(x), sz(z), 2.2, 0, 7); g.fill(); }
    }
    for (let i = 0; i < L.MAX_HELIS; i++) {
      const x = frames[o++], z = frames[o++], sd = frames[o++], on = frames[o++];
      if (!on) continue;
      g.fillStyle = side(sd); g.beginPath(); g.moveTo(sx(x), sz(z) - 8); g.lineTo(sx(x) + 8, sz(z)); g.lineTo(sx(x), sz(z) + 8); g.lineTo(sx(x) - 8, sz(z)); g.fill();
    }
    for (let i = 0; i < L.MAX_BOMBS; i++) {
      const x = frames[o++], z = frames[o++], on = frames[o++];
      if (!on) continue;
      g.fillStyle = '#ff8a65'; g.beginPath(); g.arc(sx(x), sz(z), 4, 0, 7); g.fill();
    }
    // the truck: heading is a fraction of a turn in Q16.16, 0.25 being +x
    const a = (th / ONE) * 2 * Math.PI;
    // large, outlined and ringed, so it is found at once on a phone (Daniel 11:04: he could not tell where the truck was)
    g.save(); g.translate(sx(tx), sz(tz));
    g.strokeStyle = 'rgba(255, 213, 79, 0.9)'; g.lineWidth = 4; g.beginPath(); g.arc(0, 0, 34, 0, 7); g.stroke();
    g.rotate(a); g.fillStyle = '#ffd54f'; g.strokeStyle = '#0b0f14'; g.lineWidth = 4;
    g.beginPath(); g.moveTo(0, -26); g.lineTo(17, 18); g.lineTo(-17, 18); g.closePath(); g.stroke(); g.fill(); g.restore();
    document.getElementById('at').textContent = `${clockOf(f + 1)} of ${clockOf(transcript.ticks.length)}`;
    readout(f);
  }

  // THE TICK'S NUMBERS (Daniel 2026-09-26 07:12), on every tick, playing or scrubbed. The factors are the ones scoreOf
  // multiplies - score.js's own exposure5 (danger), time5 (speed) and cargo5 (load), from the core this page stepped -
  // and the score is the core's scoreOf of the same words: what this tick would pay, delivered or not. Line 2 is the
  // arrival card's working for this tick.
  const Sc = R.score || {}, five = (n) => (n / Sc.FACTOR_SCALE).toFixed(5);
  // an older core a stored round names may not carry score.js's factors: its line then says so and no bar is drawn
  const hasFactors = ['exposure5', 'time5', 'cargo5', 'scoreOf'].every((k) => typeof Sc[k] === 'function') && typeof Sc.FACTOR_SCALE === 'number';
  function readout(f) {
    if (!hasFactors) {
      document.getElementById('line1').textContent = `this round's core (${ended}) does not name its score factors`;
      document.getElementById('work').textContent = '';
      return;
    }
    const o = f * PER + MAP;
    const hp = frames[o], exposure = frames[o + 1], elapsed = frames[o + 2], cargo = frames[o + 3], practice = frames[o + 4];
    const danger = five(Sc.exposure5(exposure)), speed = five(Sc.time5(elapsed)), load = five(Sc.cargo5(cargo));
    const score = points(Sc.scoreOf(exposure, elapsed, cargo));
    const hpPct = Math.ceil(Math.max(0, hp) / ONE);   // hp is 100 at full, as the HUD's HEALTH reads it
    document.getElementById('hp-label').textContent = `HEALTH ${hpPct}%`;
    document.getElementById('hp-bar').style.width = `${Math.min(100, hpPct)}%`;
    const dangerF = Sc.exposure5(exposure) / Sc.FACTOR_SCALE;
    document.getElementById('danger-label').textContent = `DANGER \u00d7${dangerF.toFixed(2)}`;
    document.getElementById('danger-bar').style.width = `${(dangerF * 100).toFixed(1)}%`;
    document.getElementById('score-num').textContent = score;
    // health, danger and score are on the bars above (Daniel 2026-09-26 14:25: the line repeating them is the duplicate);
    // speed and practice are on no bar, so they stand here once
    document.getElementById('line1').textContent = `speed ${speed} · practice ${practice ? 'on' : 'off'}`;
    document.getElementById('work').textContent = `load ${load} × danger ${danger} × speed ${speed} × 1000 = ${score}`;
  }

  // THE CORE'S OWN TIME, AS A CLOCK (Daniel 2026-09-26 14:25 and 14:35): mm:ss.ffff - two digits of minutes, two of
  // seconds, a dot, four digits of the fraction - not a tick number and not seconds jammed against microseconds.
  // A tick is TICK_DT seconds in Q16.16.
  const usOf = (ticks) => Math.round((ticks * R.TICK_DT * 1e6) / ONE);
  const clockOf = (ticks) => {
    const tenth = Math.floor(usOf(ticks) / 100);                       // ten-thousandths of a second
    const sec = Math.floor(tenth / 10000), frac = tenth % 10000;
    return `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}.${String(frac).padStart(4, '0')}`;
  };
  // PLAYED LIKE A VIDEO, at the core's own tick rate (ONE / TICK_DT ticks a second).
  const rate = ONE / R.TICK_DT;
  const scrub = document.getElementById('scrub'), play = document.getElementById('play');
  scrub.max = String(transcript.ticks.length - 1); scrub.disabled = false; play.disabled = false;
  let at = 0, playing = false, last = 0;
  const show = (f) => { at = Math.max(0, Math.min(transcript.ticks.length - 1, f)); scrub.value = String(Math.floor(at)); draw(Math.floor(at)); };
  scrub.addEventListener('input', () => show(Number(scrub.value)));
  play.addEventListener('click', () => { playing = !playing; play.textContent = playing ? 'pause' : 'play'; if (playing && at >= transcript.ticks.length - 1) show(0); last = performance.now(); if (playing) requestAnimationFrame(tick); });
  function tick(now) {
    if (!playing) return;
    show(at + ((now - last) / 1000) * rate); last = now;
    if (at >= transcript.ticks.length - 1) { playing = false; play.textContent = 'play'; return; }
    requestAnimationFrame(tick);
  }
  // THE RESULT, THEN THE DETAILS (Daniel 2026-09-26 14:14): no one truncated paragraph, no name cut with an ellipsis
  say('');
  document.getElementById('status').style.display = 'none';
  const hexOf = (u8) => Array.from(u8, (b) => b.toString(16).padStart(2, '0')).join('');
  const res = document.getElementById('result');
  const word = document.createElement('span');
  word.className = 'word ' + (result.outcome === 'DELIVERED' ? 'ok' : result.outcome ? 'fail' : 'live');
  word.textContent = result.outcome || 'LIVE';
  const then = document.createElement('span');
  then.className = 'then';
  then.textContent = `score ${points(result.score)} · ${clockOf(transcript.ticks.length)}`;
  res.append(word, then);
  // WHEN, from the node's own receipt of the run's checkpoints (clock, beside the transcript): the first one projected
  // back to the run's first tick, the last one forward to its end. Absolute, in the viewer's own zone.
  const clock = transcript.clock;
  const stamp = (ms) => { const d = new Date(ms), z = (n, w = 2) => String(n).padStart(w, '0');
    const off = -d.getTimezoneOffset(), sign = off >= 0 ? '+' : '-';
    return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}.${z(d.getMilliseconds(), 3)} UTC${sign}${z(Math.floor(Math.abs(off) / 60))}:${z(Math.abs(off) % 60)}`; };
  const startMs = clock ? clock.firstMs - usOf(clock.firstTick - from) / 1000 : null;
  const endMs = clock ? clock.lastMs + usOf(from + transcript.ticks.length - clock.lastTick) / 1000 : null;
  const dl = document.getElementById('details');
  const rows = [['Round', round], ['Entry', entry], ['Host', here]];
  if (clock) rows.push(['Start', stamp(startMs)], ['End', stamp(endMs)]);
  rows.push(['Core', hexOf(contract.simCoreHash)]);
  for (const [k, v] of rows) {
    const dt = document.createElement('dt'); dt.textContent = k; const dd = document.createElement('dd'); dd.textContent = v; dl.append(dt, dd);
  }
  show(0);
