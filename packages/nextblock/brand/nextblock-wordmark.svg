  <circle cx="256" cy="256" r="178" fill="none" stroke="#f7931a" stroke-width="44"/>
  <g fill="#f7931a"><rect x="244" y="96" width="24" height="40" rx="6"/><rect x="244" y="376" width="24" height="40" rx="6"/><rect x="96" y="244" width="40" height="24" rx="6"/><rect x="376" y="244" width="40" height="24" rx="6"/></g>
