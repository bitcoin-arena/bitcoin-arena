<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bitcoin Up or Down · 15 min</title>
<!-- THE MARKET'S OWN CLIENT (kanban #237): btc-updown-15m, pinned by its manifest's clients[] and run by the Arena page in its
     frame. Laid out as Polymarket's (Daniel 2026-10-10 screenshots): the window's question and prices, "Buy Up 52¢" / "Buy
     Down 48¢", and a buy sheet - MARKET (an amount in sats, "To win") or, behind the settings icon, LIMIT (a limit price,
     shares, an expiry, Total and To win). Every order brings its own amount (order-book.js MIN_ORDER_MSAT .. MAX_ORDER_MSAT)
     and goes through the page's own join, deposit and locks (window.parent.ARENA_GAME.market.order). A share pays 1 sat if
     its side wins. The live BTC price and the price to beat are Coinbase's, for the eye; the outcome is the attestors'. -->
<style>
  :root { --bg:#0e1117; --card:#171b24; --line:#262d3b; --text:#e8edf3; --dim:#8d99a8; --up:#2fd38a; --down:#ff5a6a; --blue:#4f7cff; color-scheme:dark; }
  * { box-sizing:border-box; } html,body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--text); font:15px/1.4 system-ui,-apple-system,sans-serif; display:flex; flex-direction:column;
    padding:max(10px,env(safe-area-inset-top)) 12px 10px; gap:8px; overflow:hidden; }
  button { font:inherit; color:inherit; cursor:pointer; }
  /* THE WAY BACK ON ITS OWN ROW, THE TITLE ON ITS OWN LINE (kanban #388, Daniel 2026-10-16: Rock Paper Scissors' "is easier to
     recognize and the game title looks much nicer and is separated from the navigation button ... make is consistent") */
  button.back { display:inline-flex; align-items:center; gap:6px; align-self:flex-start; background:var(--card); border:1px solid var(--line);
    border-radius:8px; padding:6px 12px; font:600 13px system-ui; color:var(--dim); cursor:pointer; }
  button.back:hover { color:#f7931a; }
  header { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:10px 0 12px; }
  header h1 { font:800 22px/1.15 system-ui; letter-spacing:-0.01em; margin:0; flex:1; }
  header h1 .arrows { margin-left:8px; font-size:18px; } header h1 .up { color:#3fb950; } header h1 .down { color:#f85149; } .chip { font:700 11px system-ui; letter-spacing:.06em; padding:4px 8px; border-radius:99px; border:1px solid var(--line); color:var(--dim); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 12px; }
  .q { font:700 16px system-ui; } .sub { color:var(--dim); font-size:13px; }
  .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:8px; text-align:center; }
  .row3 b { display:block; font:700 16px system-ui; font-variant-numeric:tabular-nums; } .row3 span { color:var(--dim); font-size:11.5px; }
  .odds { display:flex; justify-content:space-between; align-items:baseline; margin-top:6px; } .odds b { font:800 26px system-ui; }
  .sides { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .side { border:0; border-radius:12px; padding:12px 6px; font:700 16px system-ui; }
  .side.up { background:#12301f; color:var(--up); } .side.down { background:#3a1216; color:#ff8a94; }
  .side.on.up { outline:2px solid var(--up); } .side.on.down { outline:2px solid var(--down); }
  .sheet { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:12px; position:relative; }
  .sheet .top { display:flex; justify-content:space-between; align-items:center; }
  .pill { background:#232937; border-radius:99px; padding:5px 14px; font-weight:600; }
  .gear { background:none; border:0; font-size:20px; padding:2px 6px; }
  .menu { position:absolute; right:12px; top:44px; background:#1d222d; border:1px solid var(--line); border-radius:12px; padding:4px 0; z-index:5; display:none; min-width:130px; }
  .menu.open { display:block; } .menu button { display:block; width:100%; text-align:left; background:none; border:0; padding:9px 14px; }
  .menu button.on { color:var(--blue); font-weight:700; }
  .amount { text-align:center; font:800 42px system-ui; margin:6px 0 0; font-variant-numeric:tabular-nums; }
  .amount input { width:100%; text-align:center; background:none; border:0; color:var(--text); font:inherit; outline:none; }
  .center { text-align:center; } .win { color:var(--up); font-weight:800; }
  .chips { display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin:6px 0; }
  .chips button { background:#2a3040; border:0; border-radius:10px; padding:6px 11px; font-weight:600; }
  .line { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-top:1px solid var(--line); }
  .line input, .line select { width:7.5em; text-align:right; background:var(--bg); border:1px solid var(--line); border-radius:10px; color:var(--text); padding:7px; font:600 16px system-ui; }
  .stepper { display:flex; gap:4px; align-items:center; } .stepper button { background:#2a3040; border:0; border-radius:8px; width:30px; height:32px; }
  .total { font:700 18px system-ui; color:var(--blue); } .bigwin { font:800 22px system-ui; color:var(--up); }
  .go { width:100%; padding:13px; border:0; border-radius:12px; background:var(--blue); color:#fff; font:800 16px system-ui; margin-top:8px; }
  .go:disabled { opacity:.45; } .err { color:var(--down); font-size:13px; min-height:1em; text-align:center; }
  .list { flex:1; min-height:0; overflow:auto; } .list h3 { margin:0 0 4px; font:700 12px system-ui; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  .r { display:flex; justify-content:space-between; gap:8px; padding:5px 0; border-bottom:1px solid var(--line); font-size:13.5px; } .r:last-child { border:0; }
  .r button { background:none; border:1px solid var(--line); border-radius:8px; padding:2px 8px; font-size:12px; }
  a { color:#7cc4ff; } .none { color:var(--dim); text-align:center; padding:30px 10px; } [hidden] { display:none !important; }
</style></head><body>
<button class="back" type="button" id="back">&larr; Games</button>
<header><h1>Bitcoin Up or Down<span class="arrows" aria-hidden="true"><span class="up">&#9650;</span><span class="down">&#9660;</span></span></h1><span class="chip" id="kind">…</span></header>
<div id="view" style="display:contents"></div>
<script>
const A = window.parent && window.parent.ARENA_GAME;
const $ = (id) => document.getElementById(id);
const SCALE = 100000, TICK = 1000, PERIOD_MS = 15 * 60000;
const MIN_SHARES = 5, FEE_BPS = 100, MIN_SAT = 1, MAX_SAT = 100000;   // the book's minimum shares; 1 % fee; order-book.js limits
const usd = (c) => (c === null || c === undefined ? '…' : '$' + (c / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
const sats = (n) => Math.floor(n).toLocaleString('en-US') + ' sats';
const hhmm = (ms) => new Date(ms).toISOString().slice(11, 16);
const mmss = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const esc = (v) => String(v).replace(/[<>&"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));

if (!A || !A.market) {
  $('view').innerHTML = '<div class="none">This market runs inside the Bitcoin Arena page, which hands it the market.</div>';
} else {
  window.UPDOWN_CLIENT = { hash: A.clientHash, game: A.game.id, state: {} };
  $('back').onclick = () => A.back();
  const outcomes = A.game.outcomes.length ? A.game.outcomes : ['Up', 'Down'];
  $('view').innerHTML = `
    <div class="card"><div class="q" id="q">…</div><div class="sub"><span id="left"></span> · <a id="poly" target="_blank" rel="noopener">Polymarket</a></div>
      <div class="row3"><div><b id="beat">…</b><span>price to beat</span></div><div><b id="now">…</b><span>BTC now</span></div><div><b id="delta">…</b><span>change</span></div></div>
      <div class="odds"><span class="sub">chance of Up</span><b id="chance">50%</b></div></div>
    <div class="sides"><button class="side up" id="s0">Buy ${esc(outcomes[0])} <span id="p0">50¢</span></button><button class="side down" id="s1">Buy ${esc(outcomes[1])} <span id="p1">50¢</span></button></div>
    <div class="sheet">
      <div class="top"><span class="pill" id="mode">Buy · Market</span><button class="gear" id="gear" aria-label="order type">⚙︎</button></div>
      <div class="menu" id="menu"><button data-mode="market">Market</button><button data-mode="limit">Limit</button></div>
      <div id="market">
        <div class="amount"><input id="amt" inputmode="numeric" value="1000" aria-label="amount in sats"></div>
        <div class="center sub">sats · <span id="side">Up</span></div>
        <div class="chips"><button data-add="100">+100</button><button data-add="500">+500</button><button data-add="1000">+1,000</button><button data-add="10000">+10,000</button></div>
        <div class="center">To win <span class="win" id="mwin">…</span> <span class="sub" id="mprice"></span></div>
      </div>
      <div id="limit" hidden>
        <div class="line"><span>Limit price</span><span class="stepper"><button data-lp="-1">−</button><input id="lp" inputmode="numeric" value="50"><button data-lp="1">+</button></span></div>
        <div class="line"><span>Shares</span><input id="sh" inputmode="numeric" value="100"></div>
        <div class="chips" style="justify-content:flex-end"><button data-sh="-100">−100</button><button data-sh="-10">−10</button><button data-sh="10">+10</button><button data-sh="100">+100</button></div>
        <div class="line"><span class="sub">Expires</span><select id="exp"><option value="0">at the close</option><option value="60000">in 1 min</option></select></div>
        <div class="line"><span>Total</span><span class="total" id="ltotal">…</span></div>
        <div class="line"><span>To win</span><span class="bigwin" id="lwin">…</span></div>
      </div>
      <div class="err" id="err"></div><button class="go" id="go">Buy Up</button>
      <div class="center sub" id="fee">Fee 1 %: 0.5 % nodes + 0.5 % donation, due when the market resolves; all back if it is void.</div>
    </div>
    <div class="card list"><h3>My orders</h3><div id="mine"></div><h3 style="margin-top:8px">Results</h3><div id="results"></div></div>`;
  let pick = 0, mode = 'market', current = null, book = null, live = { now: null, beat: null, beatFor: null };
  const windowNow = () => (A.allRows ? A.allRows() : A.rows()).filter((r) => r.entryCloseMs && r.entryCloseMs > Date.now()).sort((x, y) => x.entryCloseMs - y.entryCloseMs)[0] || null;
  // THE PRICE OF UP: the last certified batch's, else 50¢; Down is 1 less it
  const upCents = () => { const b = book && book.batches ? book.batches.filter((x) => x.price) : []; return b.length ? Math.round(Number(b[b.length - 1].price) / TICK) : 50; };
  const priceOf = (i) => (i === 0 ? upCents() : 100 - upCents());
  const net = (s) => s * (1 - FEE_BPS / 10000);
  async function prices() {
    try { const j = await (await fetch('https://api.coinbase.com/v2/prices/BTC-USD/spot', { cache: 'no-store' })).json(); live.now = Math.round(Number(j.data.amount) * 100); } catch {}
    if (current && live.beatFor !== current.id && Date.now() >= current.entryCloseMs - PERIOD_MS) {
      try {
        const start = current.entryCloseMs - PERIOD_MS, iso = (ms) => new Date(ms).toISOString();
        const c = await (await fetch(`https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=60&start=${iso(start - 60000)}&end=${iso(start)}`)).json();
        const before = c.filter((x) => x[0] * 1000 < start).sort((a, b) => b[0] - a[0])[0];
        if (before) { live.beat = Math.round(before[4] * 100); live.beatFor = current.id; }
      } catch {}
    }
    draw();
  }
  async function readBook() { if (current) { try { book = await A.market.book(current.id); } catch { book = null; } } draw(); }
  // WHAT THE SHEET ASKS: { stakeSat, limitCents, expiryMs, shares, win } or why not
  function asked() {
    if (mode === 'market') {
      const amt = Math.floor(Number($('amt').value));
      const p = Math.min(99, priceOf(pick) + 10);               // a market order: at most 10¢ over the price now, filled at the batch's
      if (!(amt >= MIN_SAT && amt <= MAX_SAT)) return { why: `an amount of ${MIN_SAT} to ${MAX_SAT.toLocaleString('en-US')} sats` };
      const shares = Math.floor(net(amt) / (priceOf(pick) / 100));
      if (Math.floor(net(amt) / (p / 100)) < MIN_SHARES) return { why: `at this price an order is at least ${Math.ceil(MIN_SHARES * p / 100 / (1 - FEE_BPS / 10000))} sats` };
      // A MARKET ORDER DOES NOT REST: what its first batches do not fill expires 60 s on - time for its locks to reach the seats
      // and a batch to clear - and comes back at settlement (book-ledger.js: an expired rest is refunded whole)
      return { stakeSat: amt, limitCents: p, expiryMs: Date.now() + 60000, shares, win: shares };
    }
    const lp = Math.floor(Number($('lp').value)), sh = Math.floor(Number($('sh').value));
    if (!(lp >= 1 && lp <= 99)) return { why: 'a limit price of 1 to 99¢' };
    if (!(sh >= MIN_SHARES)) return { why: `at least ${MIN_SHARES} shares` };
    const stakeSat = Math.ceil(sh * lp / 100 / (1 - FEE_BPS / 10000));
    if (stakeSat > MAX_SAT) return { why: `at most ${MAX_SAT.toLocaleString('en-US')} sats an order` };
    const e = Number($('exp').value);
    return { stakeSat, limitCents: lp, expiryMs: e ? Date.now() + e : 0, shares: sh, win: sh, total: sh * lp / 100 };
  }
  function draw() {
    current = windowNow();
    if (!current) { $('q').textContent = 'No window is open on these nodes right now.'; $('go').disabled = true; return; }
    const start = current.entryCloseMs - PERIOD_MS;
    $('kind').textContent = current.free ? 'FREE' : 'PAID';
    $('q').textContent = `BTC up or down, ${hhmm(start)}–${hhmm(current.entryCloseMs)} UTC?`;
    $('left').textContent = (Date.now() < start ? 'opens in ' + mmss(start - Date.now()) + ', ' : '') + 'closes in ' + mmss(current.entryCloseMs - Date.now());
    $('poly').href = 'https://polymarket.com/event/btc-updown-15m-' + Math.floor(start / 1000);
    $('beat').textContent = Date.now() < start ? 'at ' + hhmm(start) : usd(live.beat);
    $('now').textContent = usd(live.now);
    const d = live.now !== null && live.beat !== null && Date.now() >= start ? live.now - live.beat : null;
    $('delta').textContent = d === null ? '–' : (d >= 0 ? '▲ ' : '▼ ') + usd(Math.abs(d));
    $('delta').style.color = d === null ? '' : d >= 0 ? 'var(--up)' : 'var(--down)';
    $('p0').textContent = priceOf(0) + '¢'; $('p1').textContent = priceOf(1) + '¢'; $('chance').textContent = upCents() + '%';
    $('s0').classList.toggle('on', pick === 0); $('s1').classList.toggle('on', pick === 1);
    $('side').textContent = outcomes[pick];
    $('mode').textContent = 'Buy · ' + (mode === 'market' ? 'Market' : 'Limit');
    $('market').hidden = mode !== 'market'; $('limit').hidden = mode !== 'limit';
    for (const b of document.querySelectorAll('#menu button')) b.classList.toggle('on', b.dataset.mode === mode);
    const a = asked();
    if (mode === 'market') { $('mwin').textContent = a.why ? '–' : sats(a.win); $('mprice').textContent = a.why ? '' : 'at ' + priceOf(pick) + '¢'; }
    else { $('ltotal').textContent = a.why ? '–' : sats(a.stakeSat); $('lwin').textContent = a.why ? '–' : sats(a.win); }
    $('err').textContent = current.free ? 'Orders need a paid round' : (a.why || '');
    $('go').disabled = !!a.why || current.free;
    $('go').textContent = 'Buy ' + outcomes[pick];
    const mine = A.market.orders();
    $('mine').innerHTML = mine.length ? mine.slice(-4).reverse().map((o) => `<div class="r"><span>${esc(outcomes[o.pick] || o.pick)} ≤ ${Math.round(o.limitPrice / TICK)}¢ · ${sats(Number(o.stakeMsat) / 1000)} · ${hhmm(o.entryCloseMs - PERIOD_MS)}</span>`
      + `<span>${o.cancelled ? 'cancelled' : o.entryCloseMs > Date.now() ? `<button data-cancel="${o.entry}">cancel</button>` : 'closed'}</span></div>`).join('') : '<div class="sub">No orders yet.</div>';
    const lines = (A.state().picks || []).filter((l) => l && l.text).slice(-3);
    $('results').innerHTML = lines.length ? lines.map((l) => `<div class="r"><span>${esc(l.text)}</span></div>`).join('') : '<div class="sub">Results of your windows show here.</div>';
    window.UPDOWN_CLIENT.state = { round: current.id, free: current.free, window: [start, current.entryCloseMs], beat: live.beat, now: live.now, pick, mode, asked: a, orders: mine.length, upCents: upCents() };
  }
  $('s0').onclick = () => { pick = 0; draw(); }; $('s1').onclick = () => { pick = 1; draw(); };
  $('gear').onclick = () => $('menu').classList.toggle('open');
  $('menu').onclick = (e) => { const m = e.target.dataset && e.target.dataset.mode; if (m) { mode = m; $('menu').classList.remove('open'); if (m === 'limit') $('lp').value = String(priceOf(pick)); draw(); } };
  for (const b of document.querySelectorAll('[data-add]')) b.onclick = () => { $('amt').value = String(Math.min(MAX_SAT, (Math.floor(Number($('amt').value)) || 0) + Number(b.dataset.add))); draw(); };
  for (const b of document.querySelectorAll('[data-sh]')) b.onclick = () => { $('sh').value = String(Math.max(0, (Math.floor(Number($('sh').value)) || 0) + Number(b.dataset.sh))); draw(); };
  for (const b of document.querySelectorAll('[data-lp]')) b.onclick = () => { $('lp').value = String(Math.min(99, Math.max(1, (Math.floor(Number($('lp').value)) || 50) + Number(b.dataset.lp)))); draw(); };
  for (const id of ['amt', 'lp', 'sh', 'exp']) $(id).oninput = draw;
  $('mine').onclick = async (e) => {
    const id = e.target && e.target.dataset && e.target.dataset.cancel; if (!id) return;
    e.target.disabled = true; const r = await A.market.cancel(id); $('err').textContent = r.ok ? '' : 'Cancel refused: ' + (r.why || (r.seats || []).map((s) => s.why).join('; ')); draw();
  };
  $('go').onclick = () => {
    const a = asked(); if (a.why) return;
    $('err').textContent = '';
    const ok = A.market.order(current.id, pick, a.limitCents * TICK, a.expiryMs, a.stakeSat * 1000);
    if (ok === false) $('err').textContent = 'The page did not take the order.';
    setTimeout(draw, 500);
  };
  draw(); prices(); readBook();
  setInterval(draw, 1000); setInterval(prices, 5000); setInterval(readBook, 3000);
}
</script>
</body></html>
