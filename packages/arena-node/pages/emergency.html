<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bitcoin Arena · My node is offline</title>
<!-- MY NODE IS OFFLINE (spec §23A.5a, protocol 17): /Dashboard/emergency on every node, no login. The owner types the emergency code
     written down at install; the browser makes the emergency key from it, finds the node whose bond advert names that key, and signs a
     leave request at this node's tip. Only the request and its signature leave the browser; this node passes it on to every seat.
     THE PAGE IS REACT'S (kanban #564, Daniel 2026-10-21: "Delete the old html code of those components you have ported, no fall backs"):
     the steps drawn by /emergency/react.js (packages/arena-web/src/emergency) - the code, the key and the signature still made in this
     browser, by this node's /owner/client.js, which the page hands in with its fetches. -->
<style>
:root{--bg:#0f1218;--card:#171c25;--line:#2a3140;--text:#e6e9ef;--dim:#8b93a3;--gv:#f2a93b;--st:#4fa3ff;--ok:#3fbf7f;--bad:#e25c5c;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f5f6f8;--card:#fff;--line:#dde1e7;--text:#1b2230;--dim:#5d6676;color-scheme:light}}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;padding:16px;max-width:760px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--dim);margin-bottom:14px;overflow-wrap:anywhere}a{color:var(--st)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:16px}.card p{margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 10px;padding:4px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row b{overflow-wrap:anywhere;text-align:right}
button{font:600 15px system-ui;border-radius:10px;padding:11px 16px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;margin:4px 6px 4px 0}
button.primary{background:var(--gv);border-color:var(--gv);color:#1a1200}button:disabled{opacity:.5;cursor:default}
input{width:100%;font:16px ui-monospace,monospace;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);letter-spacing:.04em}
.warn{border-left:3px solid var(--gv);padding:8px 12px;background:rgba(242,169,59,.08);border-radius:0 8px 8px 0;margin:10px 0}
.err{color:var(--bad);min-height:1.5em}.ok{color:var(--ok)}label{display:block;margin:8px 0 4px;color:var(--dim)}
.emergency h1{font-size:24px;font-weight:750;margin:6px 0 4px}.emergency .card{border-radius:16px;padding:18px 20px}
.steps{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}.steps span{font-size:12px;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
.steps span.now{border-color:var(--gv);color:var(--gv)}.steps span.done{border-color:var(--ok);color:var(--ok)}
.emergency input{font-size:17px;padding:13px 14px;border-radius:12px}.emergency .hint{color:var(--dim);font-size:13px;margin:6px 0 10px}
.emergency button{width:100%;margin:6px 0 0}.actions{display:grid;grid-template-columns:1fr 2fr;gap:8px}.actions button{margin:0}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.kv .row{padding:8px 0}.kv .row span{color:var(--dim)}
.outcomes{display:flex;flex-direction:column;gap:8px}.outcome{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.outcome span{color:var(--dim);font-size:13px;grid-column:1/-1}.outcome b{font-weight:600}.outcome i{font-style:normal;font-weight:700;font-size:13px;white-space:nowrap}.outcome i.ok{color:var(--ok)}.outcome i.bad{color:var(--bad)}
.done{text-align:center}.done .big{font-size:44px;line-height:1}
.emergency .err:empty{min-height:0;margin:0}
</style></head><body>
<div id="app"></div>
<script type="module">
const BASE = location.pathname.replace(/\/[Dd]ashboard\/emergency\/?$/, '');
const at = (p) => BASE + p;
const [C] = await Promise.all([import(at('/owner/client.js')), import(at('/emergency/react.js'))]);
window.ArenaEmergency.mount(document.getElementById('app'), { client: C, dashboardHref: at('/Dashboard'),
  get: async (p) => (await fetch(at(p))).json(),
  post: async (p, body) => { const r = await fetch(at(p), { method: 'POST', body }); const t = await r.text(); if (!r.ok) throw new Error(t.trim() || 'HTTP ' + r.status); return JSON.parse(t); } });
</script>
</body></html>
