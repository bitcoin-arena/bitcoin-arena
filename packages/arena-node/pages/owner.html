<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bitcoin Arena · Node Owner</title>
<!-- THE OWNER AREA OF A NODE (kanban #276): /Dashboard/owner. The owner is a key made from 24 words this browser keeps;
     every request it sends is signed with it (src/owner.js). Nothing here is a password, and nothing leaves the browser
     but public keys and signatures. -->
<style>
:root{--bg:#0f1218;--card:#171c25;--line:#2a3140;--text:#e6e9ef;--dim:#8b93a3;--gv:#f2a93b;--st:#4fa3ff;--ok:#3fbf7f;--bad:#e25c5c;color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f5f6f8;--card:#fff;--line:#dde1e7;--text:#1b2230;--dim:#5d6676;color-scheme:light}}
*{box-sizing:border-box}body{margin:0 auto;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;padding:16px;max-width:760px}
h1{font-size:20px;margin:0 0 4px}h2{font-size:14px;margin:22px 0 8px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.sub{color:var(--dim);margin-bottom:14px;overflow-wrap:anywhere}a{color:var(--st)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:16px}.card p{margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 10px;padding:4px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row b{overflow-wrap:anywhere;text-align:right}
button{font:600 15px system-ui;border-radius:10px;padding:11px 16px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;margin:4px 6px 4px 0}
button.primary{background:var(--gv);border-color:var(--gv);color:#1a1200}button:disabled{opacity:.5;cursor:default}
input,textarea{width:100%;font:15px ui-monospace,monospace;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
textarea{min-height:110px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin:10px 0;counter-reset:w}
.words span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:14px ui-monospace,monospace}
.words span::before{counter-increment:w;content:counter(w) ". ";color:var(--dim)}
.warn{border-left:3px solid var(--gv);padding:8px 12px;background:rgba(242,169,59,.08);border-radius:0 8px 8px 0;margin:10px 0}
.err{color:var(--bad);min-height:1.5em}.ok{color:var(--ok)}
label{display:block;margin:8px 0 4px;color:var(--dim)}
  table.found { width: 100%; border-collapse: collapse; } table.found th, table.found td { padding: 4px 6px; text-align: left; vertical-align: top; } .info { margin: 2px 0 6px; } .info a { color: inherit; }
</style></head><body>
<h1>Bitcoin Arena · Node Owner</h1>
<div class="sub" id="who">loading…</div>
<div id="view"></div>
<p class="sub"><a id="public" href="#">← Public dashboard</a></p>
<script type="module">
// The node's address: this page is <base>/Dashboard/owner, its doors are <base>/owner...
const BASE = location.pathname.replace(/\/[Dd]ashboard\/owner\/?$/, '');
const at = (p) => BASE + p;
document.getElementById('public').href = at('/Dashboard');
const C = await import(at('/owner/client.js'));
const STORE = 'arena-owner-seed:' + BASE;          // per node address, in this browser only
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v).replace(/[<>&"]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
const view = (html) => { $('view').innerHTML = html; };
const readSeed = () => { try { const h = localStorage.getItem(STORE); return h && /^[0-9a-f]{64}$/.test(h) ? C.fromHex(h) : null; } catch { return null; } };
const keepSeed = (seed) => { try { localStorage.setItem(STORE, C.toHex(seed)); return true; } catch { return false; } };
// LOGIN WITH NOSTR (kanban #277, Daniel 2026-10-10: "a login with Nostr feature for node claiming instead of generating your
// own seed"): the owner key is the Nostr key itself. An nsec signs owner requests as the words' key does; an extension
// (NIP-07) or a remote signer (NIP-46: bunker://, or a code a phone signer scans) signs each request as a Nostr event.
// Kept per node address in this browser: { how: 'nsec', secret } | { how: 'extension', pubkey } | { how: 'bunker', bunker, client }
const NSTORE = 'arena-owner-nostr:' + BASE;
const readNostr = () => { try { const j = JSON.parse(localStorage.getItem(NSTORE) || 'null'); return j && j.how ? j : null; } catch { return null; } };
const keepNostr = (o) => { try { localStorage.setItem(NSTORE, JSON.stringify(o)); return true; } catch { return false; } };
const forget = () => { try { localStorage.removeItem(STORE); localStorage.removeItem(NSTORE); } catch {} me = null; start(); };
let state = null, me = null;     // me: { how, pubkey, sign(action, args) -> request, devSeed, words }
async function identity() {
  if (me) return me;
  const seed = readSeed();
  const plain = (secret) => (action, args) => C.signOwnerRequest({ node: state.node, action, args, secret, sign: C.sign, pubkeyOf: C.pubkeyOf });
  if (seed) { const secret = C.ownerSecretFromSeed(seed); return (me = { how: 'words', pubkey: C.toHex(C.pubkeyOf(secret)), sign: plain(secret), devSeed: C.devSeedFromSeed(seed), words: true }); }
  const n = readNostr();
  if (!n) return null;
  if (n.how === 'nsec') { const secret = C.fromHex(n.secret); return (me = { how: 'nsec', pubkey: C.toHex(C.pubkeyOf(secret)), sign: plain(secret), devSeed: C.devSeedFromSeed(secret) }); }
  const viaEvent = (signEvent) => (action, args) => C.signOwnerEvent({ node: state.node, action, args, signEvent });
  if (n.how === 'extension') {
    const x = await C.extensionSigner(window.nostr);
    if (n.pubkey && x.pubkey !== n.pubkey) throw new Error('your Nostr extension now holds another key than the one this browser signed in with');
    return (me = { how: 'extension', pubkey: x.pubkey, sign: viaEvent((t) => x.signEvent(t)) });
  }
  if (n.how === 'bunker') {
    const b = await C.bunkerSigner(n.bunker, { clientSecret: C.fromHex(n.client), onauth: (u) => window.open(u, '_blank') });
    return (me = { how: 'bunker', pubkey: b.pubkey, sign: viaEvent((t) => b.signEvent(t)) });
  }
  return null;
}
const signed = async (action, args = {}) => (await identity()).sign(action, args);
const post = async (path, body) => {
  body = await body;
  const r = await fetch(at(path), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  const t = await r.text();
  let j = null; try { j = JSON.parse(t); } catch {}
  if (!r.ok) throw new Error((j && j.why) || t.trim() || 'HTTP ' + r.status);
  return j;
};

// 1. NO WORDS IN THIS BROWSER: make new ones, or restore
function welcome() {
  view(`<div class="card"><h3>Your owner key</h3>
    <p>The owner of this node is a key made from <b>24 words</b>. This browser keeps them; anyone with them is the owner.</p>
    <button class="primary" id="make">Create new 24 words</button><button id="restore">I have my 24 words</button>
    <button id="nostr">Login with Nostr</button></div>`);
  $('make').onclick = () => make(globalThis.crypto.getRandomValues(new Uint8Array(32)));
  $('restore').onclick = restore;
  $('nostr').onclick = nostrLogin;
}
// 1c. LOGIN WITH NOSTR: an extension, a remote signer (bunker:// or a code to scan), an nsec, or a new account
function nostrLogin() {
  view(`<div class="card"><h3>Login with Nostr</h3>
    <p>Your Nostr key becomes this node's owner key - no 24 words to make. Requests are signed by your extension or signer each time.</p>
    <button class="primary" id="ext">Browser extension (Alby, nos2x…)</button>
    <button id="scan">Phone signer (Amber…): show a code</button><div id="qr"></div>
    <label>Or a bunker link</label><input id="bunker" placeholder="bunker://… or you@your-bunker" autocomplete="off" autocapitalize="none" spellcheck="false">
    <button id="bk">Connect the bunker</button>
    <label>Or your nsec (only on a device you trust - it is kept in this browser)</label><input id="nsec" type="password" placeholder="nsec1…" autocomplete="off" autocapitalize="none">
    <button id="ns">Log in with the nsec</button> <button id="newacct">New to Nostr? Create an account</button>
    <div class="err" id="err"></div><button id="back">Back</button></div>`);
  $('back').onclick = welcome;
  const fail = (e) => { $('err').textContent = e && e.message ? e.message : String(e); };
  const done = (o, signer) => { if (!keepNostr(o)) return fail('This browser does not let the page keep it (private mode?)'); me = null; window.OWNER_NOSTR = { how: o.how, pubkey: signer.pubkey }; start(); };
  $('ext').onclick = async () => { try { const x = await C.extensionSigner(window.nostr); done({ how: 'extension', pubkey: x.pubkey }, x); } catch (e) { fail(e); } };
  $('bk').onclick = async () => {
    try { const client = globalThis.crypto.getRandomValues(new Uint8Array(32)); const b = await C.bunkerSigner($('bunker').value, { clientSecret: client, onauth: (u) => window.open(u, '_blank') });
      done({ how: 'bunker', bunker: $('bunker').value.trim(), client: C.toHex(client) }, b); } catch (e) { fail(e); }
  };
  $('scan').onclick = async () => {
    try {
      const client = globalThis.crypto.getRandomValues(new Uint8Array(32));
      const c = C.nostrConnect({ url: location.origin, clientSecret: client, onauth: (u) => window.open(u, '_blank') });
      $('qr').innerHTML = `<div style="background:#fff;padding:8px;border-radius:10px;max-width:240px">${C.textQrSvg(c.uri)}</div><p class="sub">Scan it with your signer, or <a href="${esc(c.uri)}">open it on this phone</a>. Waiting…</p>`;
      window.OWNER_CONNECT_URI = c.uri;
      const b = await c.signer;
      // kept as a bunker link to the signer that answered, with this page's client key, so it reconnects next time
      done({ how: 'bunker', bunker: `bunker://${b.bunker.bp.pubkey}?${b.bunker.bp.relays.map((r) => 'relay=' + encodeURIComponent(r)).join('&')}`, client: C.toHex(client) }, b);
    } catch (e) { fail(e); }
  };
  $('ns').onclick = () => { try { const x = C.signerFromNsec($('nsec').value); done({ how: 'nsec', secret: C.toHex(x.secret) }, x); } catch (e) { fail(e); } };
  $('newacct').onclick = () => {
    const a = C.newAccount();
    view(`<div class="card"><h3>Your new Nostr account</h3>
      <div class="warn"><b>Save this key now</b> - in a password manager or on paper. It is your Nostr account and this node's owner key. Nobody can recover it for you.</div>
      <div class="words" style="display:block;font:14px ui-monospace,monospace;word-break:break-all;padding:10px">${esc(a.nsec)}</div>
      <label><input type="checkbox" id="saved" style="width:auto"> I saved my key</label>
      <div class="err" id="err"></div><button class="primary" id="ok" disabled>Continue</button><button id="back">Back</button></div>`);
    window.OWNER_NEW_NSEC = a.nsec;
    $('saved').onchange = () => { $('ok').disabled = !$('saved').checked; };
    $('back').onclick = nostrLogin;
    $('ok').onclick = () => done({ how: 'nsec', secret: C.toHex(a.signer.secret) }, a.signer);
  };
}
// 1a. NEW WORDS: shown once, written down, three of them typed back
function make(seed) {
  const words = C.phraseFromSeed(seed).words;
  const ask = [2, 10, 19].map((i) => i + Math.floor(Math.random() * 3));      // three words, a different three each time
  view(`<div class="card"><h3>Write these 24 words down</h3>
    <div class="warn">On paper, in this order. They are the only way back to this node's owner area: from another browser, or after this one is cleared. Nobody can recover them for you.</div>
    <div class="words">${words.map((w) => `<span>${w}</span>`).join('')}</div>
    <p>Then type three of them back:</p>
    ${ask.map((i) => `<label>Word ${i + 1}</label><input id="w${i}" autocomplete="off" autocapitalize="none" spellcheck="false">`).join('')}
    <div class="err" id="err"></div><button class="primary" id="ok">I wrote them down</button><button id="back">Back</button></div>`);
  $('back').onclick = welcome;
  $('ok').onclick = () => {
    if (!ask.every((i) => $('w' + i).value.trim().toLowerCase() === words[i])) { $('err').textContent = 'One of the three words is not right. Check what you wrote.'; return; }
    if (!keepSeed(seed)) { $('err').textContent = 'This browser does not let the page keep them (private mode?).'; return; }
    start();
  };
}
// 1b. RESTORE: the 24 words, checked by their checksum word
function restore() {
  view(`<div class="card"><h3>Restore from your 24 words</h3><label>The 24 words, in order</label>
    <textarea id="ws" autocomplete="off" autocapitalize="none" spellcheck="false"></textarea>
    <div class="err" id="err"></div><button class="primary" id="ok">Restore</button><button id="back">Back</button></div>`);
  $('back').onclick = welcome;
  $('ok').onclick = () => {
    const got = C.seedFromPhrase($('ws').value);
    if (!got.ok) { $('err').textContent = 'These are not your 24 words: ' + got.why; return; }
    const seed = got.seed;
    if (!keepSeed(seed)) { $('err').textContent = 'This browser does not let the page keep them (private mode?).'; return; }
    start();
  };
}
// 2. THE NODE HAS NO OWNER: claim it with the code from its log
function claim(mine) {
  view(`<div class="card"><h3>Claim this node</h3>
    <p>This node has no owner yet. Its claim code is in the node's log and in the file <code>&lt;database&gt;.owner-claim</code> on its machine.</p>
    <label>Claim code</label><input id="code" placeholder="XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters">
    <div class="err" id="err"></div><button class="primary" id="ok">Become the owner</button></div>
    <div class="card"><div class="row"><span>Your owner key</span><b>${esc(mine)}</b></div></div>`);
  $('ok').onclick = async () => {
    $('ok').disabled = true;
    try { await post('/owner/claim', signed('claim', { code: $('code').value })); start(); }
    catch (e) { $('err').textContent = e.message; $('ok').disabled = false; }
  };
}
// 3. THE OWNER AREA
async function area() {
  let me;     // the node's answer to the login, as before (the identity is the outer \`me\` behind signed())
  try { me = await post('/owner/login', signed('login')); }
  catch (e) { view(`<div class="card"><h3>Could not sign in</h3><p class="err">${esc(e.message)}</p><button id="again">Try again</button></div>`); $('again').onclick = start; return; }
  const games = me.games || [];
  view(`<div class="card"><h3>Signed in as the owner <span class="ok">✓</span></h3>
      <div class="row"><span>Owner key</span><b>${esc(state.owner.slice(0, 16))}…</b></div>
      <div class="row"><span>Signed in with</span><b>${esc({ words: 'your 24 words', nsec: 'Nostr (nsec)', extension: 'Nostr (extension)', bunker: 'Nostr (remote signer)' }[(await identity()).how])}${(await identity()).how === 'words' ? '' : ' · ' + esc(C.npubOf(state.owner).slice(0, 20)) + '…'}</b></div>
      <div class="row"><span>Owner since</span><b>${new Date(state.claimedAtMs).toISOString().slice(0, 16).replace('T', ' ')} UTC</b></div></div>
    <h2>This node</h2><div class="card">
      <div class="row"><span>Node key</span><b>${esc(state.node.slice(0, 16))}…</b></div>
      <div class="row"><span>Guardian</span><b>${me.guardian ? 'yes · ' + esc(me.guardian) : 'no'}</b></div>
      <div class="row"><span>Games hosted</span><b>${games.length ? games.map((g) => esc(g.name)).join(', ') : 'none'}</b></div></div>
    <h2>Standing</h2><div class="card" id="standing"><p class="sub">reading this node's seatings and its bond's standing…</p></div>
    <h2>Leave</h2><div class="card" id="leave"><p class="sub">reading what this seat holds…</p></div>
    <h2>Donations</h2><div id="dons"><div class="card"><p class="sub">reading this seat's donations…</p></div></div>
    <h2>Games from other seats</h2><div class="card" id="store">
      <p>Games and new versions other seats host. Check runs every check in this browser and shows it; the seat checks again,
      runs the code in a sandbox, and only then runs it - at once, no restart. A version that is newer keeps the old one for
      the rounds it holds. To be drawn for a game's rounds, this seat's advertisement must name it.</p>
      <h3>Games / markets found on the network</h3>
      <p class="sub" id="netfound-at">this seat is asking the network's seats…</p><div id="netfound"></div>
      <button id="netagain">Search again</button>
      <details><summary class="sub">Or look at one seat by its address</summary>
      <label>Another seat's address</label><input id="from" placeholder="https://seat.example" autocomplete="off" autocapitalize="none">
      <button id="look">Look</button></details><div class="err" id="perr"></div><div id="offer"></div><div id="installed"></div></div>
    <h2>Networks</h2><div class="card" id="nets">
      <p>A seat's network is four settings, each signed or fixed by whoever has authority over it: its chain, the donation sets in
      force, its series and its federation invite. Check runs every check in this browser and shows it; the seat checks again,
      tries every series' rounds at its own doors, and only then takes it - at once, no restart.</p>
      <div id="netmine"><p class="sub">reading this seat's network…</p></div>
      <label>Another seat's address</label><input id="nfrom" placeholder="https://seat.example" autocomplete="off" autocapitalize="none">
      <button id="nlook">Look</button><div class="err" id="nerr"></div><div id="noffer"></div></div>
    <h2>Sign a game or market</h2><div class="card">
      <p>Your developer key, made from the same 24 words: <b id="devkey"></b>. A game or market you sign here names it as its developer;
      an update of it is signed by it again.</p>
      <label>The manifest body (JSON: 32-byte values in hex, big numbers as decimal strings; leave out gameDevPubkey - it is yours)</label>
      <textarea id="body" rows="8" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder='{ "gameName": "my-game", "version": 1, "resultType": "HEAD_TO_HEAD", ... }'></textarea>
      <div class="err" id="serr"></div><button class="primary" id="sign">Sign</button><div id="signed"></div></div>
    ${(await identity()).words ? `<h2>Your 24 words</h2><div class="card"><p>They are kept in this browser only.</p>
      <button id="show">Show them</button><button id="forget">Forget them on this browser</button><div id="shown"></div></div>`
      : `<h2>Your Nostr login</h2><div class="card"><p>This browser keeps your login${(await identity()).how === 'nsec' ? ' and your nsec' : ''}. Your key stays with your ${(await identity()).how === 'nsec' ? 'nsec - keep it written down' : 'signer'}.</p>
      <button id="forget">Sign out on this browser</button></div>`}`);
  if ($('show')) $('show').onclick = () => { $('shown').innerHTML = `<div class="words">${C.phraseFromSeed(readSeed()).words.map((w) => `<span>${w}</span>`).join('')}</div>`; };
  $('forget').onclick = () => { if (confirm('Sign out on this browser? You need your 24 words or your Nostr key to come back.')) forget(); };
  donations();
  standingPanel();
  leavePanel();
  storePanel();
  networkPanel();
  // SIGN A GAME OR MARKET (kanban #276 step 4): signed here as the developer's command-line client signs it
  // the developer key comes from the words or the nsec; a signer never gives its secret out, so it signs no game here
  const devSeed = (await identity()).devSeed;
  if (!devSeed) { $('sign').disabled = true; $('devkey').textContent = 'none with a Nostr signer - sign games with your 24 words or your nsec'; return; }
  const devPub = C.devPubkeyOf(devSeed);
  $('devkey').textContent = C.toHex(devPub);
  $('sign').onclick = () => {
    $('serr').textContent = ''; $('signed').innerHTML = '';
    try {
      const out = C.signManifestWithSeed(C.bodyFromJson($('body').value, { devPubkey: devPub }), devSeed);
      $('signed').innerHTML = `<div class="row"><span>Game id</span><b>${esc(out.gameId.slice(0, 16))}…</b></div>
        <label>The signed manifest (hex)</label><textarea id="mhex" rows="5" readonly>${esc(out.hex)}</textarea><button id="copy">Copy</button>`;
      window.OWNER_SIGNED = out;
      $('copy').onclick = () => { navigator.clipboard.writeText(out.hex).then(() => { $('copy').textContent = 'Copied ✓'; }, () => { $('mhex').select(); }); };
    } catch (e) { $('serr').textContent = e.message; }
  };
}
// THIS NODE'S STANDING (kanban #302 §5A.3, #310 §5A.10B): the seatings it was drawn for and missed - from three in a row the
// warning and the serving = false update offered - and its bond against the bracket now common: own weight, brackets served,
// headroom, and each warning in the seat's own words (FALLING SHARE is no fault; LOSING BRACKETS / NEAR THE FLOOR are urgent)
async function standingPanel() {
  let seat, st;
  try { [seat, st] = await Promise.all(['/owner/seatings', '/owner/standing'].map(async (p) => (await fetch(at(p), { cache: 'no-store' })).json())); }
  catch (e) { $('standing').innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  const pct = (x) => (typeof x === 'number' ? (x * 100).toFixed(1) + ' %' : '-');
  const warns = [...(seat.warning ? [{ urgent: true, kind: 'missed seatings', says: seat.warning.says, update: seat.warning.update }] : []), ...(st.warnings || [])];
  $('standing').innerHTML = `
    <div class="row"><span>Seatings missed in a row</span><b>${esc(seat.missedInARow)}</b></div>
    <div class="row"><span>Bond</span><b>${st.ownBondSats === null ? 'not in the census read' : esc(Number(st.ownBondSats).toLocaleString('en-US')) + ' sat'}</b></div>
    <div class="row"><span>Share of the bonded capital</span><b>${pct(st.ownWeight)}</b></div>
    <div class="row"><span>Brackets served</span><b>${esc(st.bracketsServed.eligible)} of ${esc(st.bracketsServed.of)} recent rounds</b></div>
    <div class="row"><span>Headroom</span><b>${typeof st.headroom === 'number' ? st.headroom.toFixed(2) + 'x the bond_min now common (' + esc(Number(st.commonBondMinSats).toLocaleString('en-US')) + ' sat)' : '-'}</b></div>
    ${st.bondMin && st.bondMin.inForce !== null ? `<div class="row"><span>bond_min in force</span><b>${esc(Number(st.bondMin.inForce).toLocaleString('en-US'))} sat${st.bondMin.pending
      ? ' · rising to ' + esc(Number(st.bondMin.pending.value).toLocaleString('en-US')) + ' sat at block ' + esc(st.bondMin.pending.effectiveAt) + ' if it holds (notice ' + esc(st.bondMin.noticeBlocks) + ' blocks)' : ''}</b></div>` : ''}
    ${warns.length ? warns.map((w) => `<p class="${w.urgent ? 'err' : 'sub'}"><b>${esc(w.kind.toUpperCase())}</b>: ${esc(w.says)}</p>${w.update ? `<p class="sub">Step out: <code>${esc(w.update)}</code></p>` : ''}`).join('')
      : '<p class="sub ok">No warning: this node is seated when drawn, and its bond is above the margin.</p>'}`;
}
// LEAVE WITHOUT BEING SLASHED (kanban #276 step 2): from the moment the owner signs Leave this seat takes no new round and
// serves the ones it holds to their end; it is free once the last is past its objection window and settled. Custody: only if
// the federation keeps its threshold without this guardian.
const when = (ms) => new Date(ms).toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
async function leavePanel() {
  let st;
  try { st = await (await fetch(at('/owner/leave'), { cache: 'no-store' })).json(); }
  catch (e) { $('leave').innerHTML = `<p class="err">${esc(e.message)}</p>`; return; }
  const free = st.freeNow ? 'now' : st.freeAtMs ? when(st.freeAtMs) : 'once its last paying round is settled';
  $('leave').innerHTML = `
    <div class="row"><span>State</span><b>${st.leaving ? 'leaving since ' + when(st.leavingAtMs) : 'taking rounds'}</b></div>
    <div class="row"><span>Rounds it still serves</span><b>${st.owed}</b></div>
    <div class="row"><span>Free to stop</span><b>${esc(free)}</b></div>
    <div class="row"><span>Custody</span><b>${st.custody.guardian ? (st.custody.allowed ? 'may leave' : 'may NOT leave') : 'none'}</b></div>
    <p class="sub">${esc(st.custody.why)}</p>
    <p class="sub">Leaving is never a slash: a seat is slashed only for a false or double signature, or a fee for service it did not give.
      From Leave on it takes no new round and serves the ones it holds to their end, so nobody loses a round.</p>
    <div class="err" id="lerr"></div>
    ${st.leaving ? '<button id="stay">Stay: take rounds again</button>' : '<button class="primary" id="go">Leave</button>'}`;
  const act = async (action) => {
    $('lerr').textContent = '';
    try { await post('/owner/' + action, signed(action)); leavePanel(); } catch (e) { $('lerr').textContent = e.message; }
  };
  if ($('go')) $('go').onclick = () => { if (confirm('Leave: this seat takes no new round from now and serves the ones it holds. Continue?')) act('leave'); };
  if ($('stay')) $('stay').onclick = () => act('stay');
}
// THE PLUGIN STORE, LIKE AN APP STORE (kanban #276 step 5, Daniel 2026-10-10: in the browser, no restart, updates as a
// setting, malicious-code checks): look at another seat, Check a game - this page fetches its package and runs every check
// itself, shown line by line - then Install or Update; Remove; automatic updates. The seat runs the same checks again, plus
// a trial run in a sandbox, before anything runs; installing and updating take effect at once.
async function storePanel() {
  let mine = { hosted: [], installed: [], settings: { autoUpdate: false, sources: [] } };
  const reload = async () => {
    try { mine = await (await fetch(at('/owner/plugins'), { cache: 'no-store' })).json(); } catch { /* shown as empty */ }
    const rows = mine.hosted.map((g) => `<div class="row"><span>${esc(g.title || g.name)} v${g.version}${g.supersededBy ? ' · replaced by ' + esc(g.supersededBy.slice(0, 8)) + '…' : ''}</span>
      <b>${g.installed ? `<button data-remove="${esc(g.id)}">Remove</button>` : 'built in'}</b></div>${infoLine(g.info)}`).join('');
    $('installed').innerHTML = `<p class="sub">Games on this seat:</p>${rows || '<p class="sub">none</p>'}
      <label><input type="checkbox" id="auto" ${mine.settings.autoUpdate ? 'checked' : ''}> Update games and networks automatically (a network naming another federation is never taken by itself)</label>
      <label>From these seats (one address per line)</label><textarea id="srcs" rows="2" autocomplete="off" autocapitalize="none">${esc((mine.settings.sources || []).join('\n'))}</textarea>
      <button id="saveset">Save</button>`;
    for (const b of $('installed').querySelectorAll('button[data-remove]')) b.onclick = async () => {
      try { await post('/owner/plugins/remove', signed('remove', { game: b.dataset.remove })); reload(); } catch (e) { $('perr').textContent = e.message; }
    };
    $('saveset').onclick = async () => {
      try { await post('/owner/settings', signed('settings', { autoUpdate: $('auto').checked, sources: $('srcs').value.split(/\s+/).filter(Boolean) })); $('saveset').textContent = 'Saved ✓'; }
      catch (e) { $('perr').textContent = e.message; }
    };
  };
  await reload();
  // THE NETWORK'S GAMES, FOUND BY THE SEAT (kanban #276, Daniel 2026-10-11: automatic, not by address): name, type, version,
  // the developer's signed description and website, how many seats host it, and Install (or Update, for a newer version of a
  // game hosted here). Install checks the package in this browser first, as Check does, then the seat checks it again.
  const found = async (fresh) => {
    let ng = null;
    try { ng = await (await fetch(at('/network-games' + (fresh ? '?fresh=1' : '')), { cache: 'no-store' })).json(); } catch (e) { $('netfound-at').textContent = 'the seat did not answer: ' + e.message; return; }
    const answered = (ng.seats || []).filter((x) => x.answered).length;
    $('netfound-at').textContent = `${answered} of ${(ng.seats || []).length} seat(s) answered · read ${ng.atMs ? new Date(ng.atMs).toLocaleTimeString() : '-'}`;
    const offers = (ng.games || []).filter((g) => !g.hostedHere);
    window.OWNER_FOUND = ng;
    if (!offers.length) { $('netfound').innerHTML = '<p class="sub">Every game the network\'s seats host is on this seat.</p>'; return; }
    $('netfound').innerHTML = `<table class="found"><tr><th>Name</th><th>Type</th><th>Version</th><th>Seats</th><th></th></tr>${offers.map((g, i) => `
      <tr><td><b>${esc(g.title)}</b></td><td>${esc(g.type)}</td><td>v${g.version}</td>
      <td>${g.seats.length}</td><td><button class="primary" data-found="${i}">${g.updateOf ? 'Update' : 'Install'}</button></td></tr>
      <tr><td colspan="5">${infoLine(g.infoSigned ? { description: g.description, website: g.website } : null) || '<div class="sub info">no signed description</div>'}<div id="frep${i}"></div></td></tr>`).join('')}</table>`;
    for (const b of $('netfound').querySelectorAll('button[data-found]')) b.onclick = async () => {
      const g = offers[Number(b.dataset.found)];
      const parent = g.updateOf ? mine.hosted.find((h) => h.id === g.updateOf) || null : null;
      const took = await checkAndTake({ g, parent, from: g.seats[0], box: $('frep' + b.dataset.found), button: b, auto: true });
      if (took) { await found(false); $('netfound-at').insertAdjacentHTML('beforeend', ` · <span class="ok">${esc(g.title)} v${g.version} ${parent ? 'updated' : 'installed'} - running now ✓</span>`); }
    };
  };
  $('netagain').onclick = () => { $('netfound-at').textContent = 'asking the network\'s seats again…'; found(true); };
  found(false);
  const report = (r) => `<div class="report">${r.checks.map((c) => `<div class="row"><span>${c.ok ? '✓' : '✗'} ${esc(c.check)}</span><b class="sub">${esc(c.detail || '')}</b></div>`).join('')}
    ${r.ok ? '' : `<p class="err">${esc(r.why)}</p>`}</div>`;
  $('look').onclick = async () => {
    $('perr').textContent = ''; $('offer').innerHTML = '';
    const from = $('from').value.trim().replace(/\/+$/, '');
    let got;
    try { got = await (await fetch(from + '/games', { cache: 'no-store' })).json(); } catch (e) { $('perr').textContent = 'That seat did not answer: ' + e.message; return; }
    const here = new Map(mine.hosted.map((g) => [g.id, g]));
    const offers = [];
    for (const g of got.games || []) {
      if (here.has(g.id)) continue;
      // a newer version of a game hosted here: its parent is hosted, same developer
      let parent = null;
      for (const h of mine.hosted) if (!h.supersededBy && g.manifest && g.manifest.includes(h.id)) parent = h;
      offers.push({ g, parent });
    }
    if (!offers.length) { $('offer').innerHTML = '<p class="sub">That seat hosts nothing newer or new for this seat.</p>'; return; }
    $('offer').innerHTML = offers.map(({ g, parent }, i) => `<div class="card"><div class="row"><span>${esc(g.title || g.name)}${g.attested ? ' · market' : ''} · ${esc(g.id.slice(0, 12))}…</span>
      <b><button data-check="${i}">Check${parent ? ' update' : ''}</button></b></div><div id="rep${i}"></div></div>`).join('');
    for (const b of $('offer').querySelectorAll('button[data-check]')) b.onclick = async () => {
      const { g, parent } = offers[Number(b.dataset.check)];
      await checkAndTake({ g, parent, from, box: $('rep' + b.dataset.check), button: b, auto: false });
    };
  };
  // CHECK IN THIS BROWSER, THEN INSTALL OR UPDATE: the package fetched from `from`, every check shown; `auto` takes it as soon
  // as every check passed (the network list's one Install), else the owner presses Install after reading the report
  async function checkAndTake({ g, parent, from, box, button, auto }) {
      box.innerHTML = '<p class="sub">checking in this browser…</p>';
      if (button) button.disabled = true;
      let pkg;
      try { const r = await fetch(`${from}/plugin?game=${g.id}`, { cache: 'no-store' }); if (!r.ok) throw new Error((await r.text()).trim()); pkg = await r.json(); }
      catch (e) { box.innerHTML = `<p class="err">That seat did not hand the game over: ${esc(e.message)}</p>`; return; }
      const parentOf = (id) => { const h = parent && parent.id === C.toHex(id) ? parent : null; return h ? { gameDevPubkey: C.fromHex(h.devKey), version: h.version } : null; };
      const r = C.checkPackage(pkg, { verify: C.verifyEd25519, want: g.id, parentOf });
      let u = { ok: true };
      if (r.ok && parent) u = C.checkUpdate({ gameId: parent.id, devKey: parent.devKey, version: parent.version }, r);
      window.OWNER_REPORT = { game: g.id, ok: r.ok && u.ok, checks: r.checks, why: r.why || u.why };
      const tid = 'take' + g.id.slice(0, 12);
      box.innerHTML = report(r) + (u.ok ? '' : `<p class="err">${esc(u.why)}</p>`)
        + (r.ok && u.ok ? `<button class="primary" id="${tid}">${parent ? 'Update' : 'Install'}</button><p class="sub">The seat checks it again and runs it in a sandbox first.</p>` : '');
      if (button) button.disabled = false;
      const t = $(tid);
      const take = async () => {
        t.disabled = true; t.textContent = 'the seat is checking…';
        try {
          const res = parent ? await post('/owner/plugins/update', signed('update', { game: g.id, from, replaces: parent.id }))
            : await post('/owner/plugins/install', signed('install', { game: g.id, from }));
          window.OWNER_INSTALLED = res;
          box.innerHTML = report(res) + `<p class="ok">${parent ? 'Updated' : 'Installed'} - running now ✓</p>`;
          await reload();
          return true;
        } catch (e) { t.textContent = 'refused'; box.insertAdjacentHTML('beforeend', `<p class="err">${esc(e.message)}</p>`); return false; }
      };
      if (t) t.onclick = take;
      if (t && auto) return take();
      return false;
  }
}
// A GAME'S DESCRIPTION AND WEBSITE, as its developer signed them (kanban #276); nothing when they do not stand
function infoLine(info) {
  if (!info || (!info.description && !info.website)) return '';
  const site = info.website && /^https:\/\//.test(info.website) ? ` <a href="${esc(info.website)}" target="_blank" rel="noopener">${esc(info.website.replace(/^https:\/\//, ''))}</a>` : '';
  return `<div class="sub info">${esc(info.description || '')}${site} <span title="signed by its developer key">✓ signed</span></div>`;
}
// THE NETWORK STORE (kanban #276, letter 2026-10-10: federation invite, donation sets, series and chain, on the game store's
// check-then-install path): this seat's four settings and who signs each; another seat's network package listed with the four,
// Check in this browser line by line, then Install or Update; Remove (refused by the seat while a round that depends on it is open)
const WHO = {
  chain: 'the network\'s genesis - its network id commits to the chain',

  series: 'the protocol\'s series rules: this network, the genesis grid and lead, the set in force, a game this seat hosts',

const fourRows = (n) => `

async function networkPanel() {
  let mine = { chain: null, own: null, installed: [] }, games = [];
  const reload = async () => {
    try { mine = await (await fetch(at('/owner/network'), { cache: 'no-store' })).json(); } catch { /* shown as empty */ }
    try { games = (await (await fetch(at('/owner/plugins'), { cache: 'no-store' })).json()).hosted.map((g) => g.id); } catch { games = []; }
    const inst = mine.installed.map((n) => `<div class="card"><div class="row"><span>Installed · network ${esc(n.network.slice(0, 12))}… · package ${esc(n.id.slice(0, 12))}…</span>

      <div class="row"><span>Chain</span><b>${esc(m.chain)}</b></div>
      <div class="row"><span>Donation sets</span><b>${(m.donationSets || []).length} · ${(m.donationSets || []).map((x) => esc(x.slice(0, 10)) + '…').join(', ')}</b></div>

// THE DEV CLIENT (kanban #276 step 3): what this seat verified for the protocol developers and for each game it hosts, in
// sat to the msat, per round and per UTC day (GET /owner/donations, from the seat's own donation index)
const sat = (msat) => { const m = BigInt(msat); const w = (m / 1000n).toLocaleString('en-US'); const f = m % 1000n; return (f ? `${w}.${String(f).padStart(3, '0').replace(/0+$/, '')}` : w) + ' sat'; };

  let r;

  catch (e) { $('dons').innerHTML = `<div class="card"><p class="err">${esc(e.message)}</p></div>`; return; }
  if (!r.sets || !r.sets.length) { $('dons').innerHTML = '<div class="card"><p>This seat deals with no donation set yet.</p></div>'; return; }
  $('dons').innerHTML = `<div class="card"><div class="row"><span>In all, verified by this seat</span><b>${sat(r.totalMsat)}</b></div></div>` + r.sets.map((s) => `<div class="card">
    <h3>${esc(s.title)}</h3><div class="row"><span>${s.kind === 'protocol' ? 'Protocol set, serial ' + s.serial : 'Game developer set'} · per UTC day this seat verified it</span><b>${esc(s.setId.slice(0, 16))}…</b></div>
    ${s.recipients.map((x) => `<div class="row"><span>${esc(x.label || 'recipient')} · ${esc(x.key.slice(0, 12))}…</span><b>${sat(x.totalMsat)} · ${x.donations} donation${x.donations === 1 ? '' : 's'}</b></div>
      ${x.byDay.slice(0, 7).map((d) => `<div class="row sub"><span>${d.day}</span><b>${sat(d.msat)}</b></div>`).join('')}
      ${x.byRound.length ? `<details><summary class="sub">${x.byRound.length} round${x.byRound.length === 1 ? '' : 's'}</summary>${x.byRound.slice(0, 50).map((d) => `<div class="row sub"><span>round ${esc(d.roundId.slice(0, 16))}…</span><b>${sat(d.msat)}</b></div>`).join('')}</details>` : ''}`).join('')}
  </div>`).join('');
}
async function start() {
  try { state = await (await fetch(at('/owner'), { cache: 'no-store' })).json(); }
  catch (e) { $('who').textContent = 'This node did not answer: ' + e.message; return; }
  $('who').textContent = 'Node ' + state.node;
  let id = null;
  try { id = await identity(); } catch (e) { view(`<div class="card"><h3>Your Nostr login did not answer</h3><p class="err">${esc(e.message)}</p><button id="again">Try again</button> <button id="out">Sign out on this browser</button></div>`); $('again').onclick = () => { me = null; start(); }; $('out').onclick = forget; return; }
  if (!id) return welcome();
  const mine = id.pubkey;
  if (!state.claimed) return claim(mine);
  if (state.owner !== mine) {
    view(`<div class="card"><h3>This key is not this node's owner</h3><p>This node belongs to another key. Sign in with the right 24 words or Nostr key, or forget this one.</p>
      <button id="forget">Sign out on this browser</button></div>`);
    $('forget').onclick = forget; return;
  }
  return area();
}
start();
